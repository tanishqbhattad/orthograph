defc('rect', {
  hint: 'Specify first corner point or [Chamfer/Fillet]:', group: 'draw', init: c => c.pts = [],
  text(c, s) {
    if (c.pts.length === 1) {
      const m = s.match(/^(.+?)[x,](.+)$/i);
      if (m) {
        const w = parseLen(m[1]), h = parseLen(m[2]);
        if (!isNaN(w) && !isNaN(h)) {
          const a = c.pts[0], b = [a[0] + w, a[1] + h];
          begin(); addEnt(rectEnt(a, b, c.data)); commit('Rectangle');
          c.pts = []; hint('Specify first corner point or [Chamfer/Fillet]:'); return true;
        }
      }
    }
    const m2 = s.match(/^f\s*([\d.]+)?$/i);         /* fillet radius */
    if (m2) { c.data.fillet = parseLen(m2[1] || '0') || 0; echo('Fillet ' + fmt(c.data.fillet)); return true; }
    const m3 = s.match(/^c\s*([\d.]+)?$/i);         /* chamfer */
    if (m3) { c.data.cham = parseLen(m3[1] || '0') || 0; echo('Chamfer ' + fmt(c.data.cham)); return true; }
    return false;
  },
  point(c, p) {
    c.pts.push(p);
    if (c.pts.length === 2) {
      begin(); addEnt(rectEnt(c.pts[0], p, c.data)); commit('Rectangle');
      c.pts = []; hint('Specify first corner point or [Chamfer/Fillet]:');
    } else hint('Specify other corner point or [Fillet/Chamfer]: · type <em>W,H</em> for an exact size');
  },
  preview(c, p) { return c.pts.length === 1 ? [pv(rectEnt(c.pts[0], p, c.data))] : null; },
});
function rectEnt(a, b, o) {
  o = o || {};
  const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]);
  const y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
  const r = Math.min(Math.max(o.fillet || o.cham || 0, 0), (x1 - x0) / 2, (y1 - y0) / 2);
  if (r <= 1e-9) return { t: 'pline', pts: [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], closed: true };
  if (o.cham) {
    return { t: 'pline', closed: true, pts: [
      [x0 + r, y0], [x1 - r, y0], [x1, y0 + r], [x1, y1 - r],
      [x1 - r, y1], [x0 + r, y1], [x0, y1 - r], [x0, y0 + r]] };
  }
  const pts = [[x0 + r, y0], [x1 - r, y0]];
  const corners = [
    [[x1 - r, y0 + r], -Math.PI / 2, 0], [[x1 - r, y1 - r], 0, Math.PI / 2],
    [[x0 + r, y1 - r], Math.PI / 2, Math.PI], [[x0 + r, y0 + r], Math.PI, Math.PI * 1.5],
  ];
  const straights = [[x1, y1 - r], [x0 + r, y1], [x0, y0 + r], null];
  for (let i = 0; i < 4; i++) {
    pts.push(...arcPts({ c: corners[i][0], r, a0: corners[i][1], a1: corners[i][2] }, 12).slice(1, -1));
    if (straights[i]) pts.push(polarPt(corners[i][0], r, corners[i][2]), straights[i]);
    else pts.push(polarPt(corners[i][0], r, corners[i][2]));
  }
  return { t: 'pline', pts, closed: true };
}
defc('circle', {
  hint: 'Specify center point for circle or [3P/2P/Ttr (tan tan radius)]:', group: 'draw',
  init: c => { c.pts = []; c.mode = 'cr'; c.data = {}; },
  text(c, s) {
    if (/^2p?$/i.test(s)) { c.mode = '2p'; c.pts = []; hint('Specify first end point of circle diameter:'); return true; }
    if (/^3p?$/i.test(s)) { c.mode = '3p'; c.pts = []; hint('Specify first point on circle:'); return true; }
    if (/^t(tr)?$/i.test(s)) { c.mode = 'ttr'; c.pts = []; c.ents = []; hint('Specify point on object for first tangent of circle:'); return true; }
    if (/^d$/i.test(s)) { c.data.dia = true; cliPrint('Specify diameter of circle:'); return true; }
    if (c.mode === 'ttr' && c.ents && c.ents.length === 2) {
      const r = parseLen(s);
      if (!isNaN(r) && r > 0) { ttrCircle(c, r); return true; }
    }
    if (c.mode === 'cr' && c.pts.length === 1) {
      const d = parseLen(s);
      if (!isNaN(d) && d > 0) {
        begin(); addEnt({ t: 'circle', c: c.pts[0], r: c.data.dia ? d / 2 : d }); commit('Circle');
        c.pts = []; c.data.dia = false; hint('Specify center point for circle or [3P/2P/Ttr (tan tan radius)]:'); return true;

    }

  },
  point(c, p) {

      if (!e) return echo('Pick a line, circle or arc');
      c.ents = c.ents || []; c.ents.push(e); c.tp = c.tp || []; c.tp.push(p);
      SEL.add(e.id);
      hint(c.ents.length === 1 ? 'Specify point on object for second tangent of circle:' : 'Specify radius of circle:');
      return;
    }
    c.pts.push(p);
    if (c.mode === 'cr' && c.pts.length === 2) { begin(); addEnt({ t: 'circle', c: c.pts[0], r: dist(c.pts[0], p) }); commit('Circle'); c.pts = []; }
    else if (c.mode === '2p' && c.pts.length === 2) { begin(); addEnt({ t: 'circle', c: mid(c.pts[0], p), r: dist(c.pts[0], p) / 2 }); commit('Circle'); c.pts = []; }
    else if (c.mode === '3p' && c.pts.length === 3) {
      const cc = circum(c.pts[0], c.pts[1], c.pts[2]);
      if (cc) { begin(); addEnt({ t: 'circle', c: cc.c, r: cc.r }); commit('Circle'); } else echo('Those points are collinear');
      c.pts = [];
    } else hint(c.mode === 'cr' ? 'Specify radius of circle or [Diameter]:' : 'Specify next point:');

  preview(c, p) {

    if (c.mode === '2p' && c.pts.length === 1) return [pv({ t: 'circle', c: mid(c.pts[0], p), r: dist(c.pts[0], p) / 2 })];
    if (c.mode === '3p' && c.pts.length === 2) { const cc = circum(c.pts[0], c.pts[1], p); return cc ? [pv({ t: 'circle', c: cc.c, r: cc.r })] : null; }

function ttrCircle(c, r) {
  const [e1, e2] = c.ents, [p1, p2] = c.tp;
  const f = filletCurves(e1, p1, e2, p2, r);

defc('ellipse', {
  hint: 'Specify center of ellipse or [Axis endpoint]:', group: 'draw', init: c => { c.pts = []; c.mode = 'c'; },
  text(c, s) { if (/^a$/i.test(s)) { c.mode = 'a'; c.pts = []; hint('Specify axis endpoint of ellipse:'); return true; } return false; },
  point(c, p) {
    c.pts.push(p);
    const need = 3;
    if (c.pts.length === need) {
      const e = c.mode === 'a' ? ellipseFromAxis(c.pts) : ellipseFromCentre(c.pts);
      if (e) { begin(); addEnt(e); commit('Ellipse'); }
      c.pts = []; hint(c.mode === 'a' ? 'Specify axis endpoint of ellipse:' : 'Specify center of ellipse or [Axis endpoint]:');
    } else hint(c.pts.length === 1 ? (c.mode === 'a' ? 'Specify other endpoint of axis:' : 'Specify endpoint of axis:') : 'Specify distance to other axis:');
  },
  preview(c, p) {

function ellipseFromCentre(p) {
  const cc = p[0], rx = dist(cc, p[1]);
  if (rx < EPS) return null;
  return { t: 'ellipse', c: cc, rx, ry: Math.max(segDist(p[2], cc, p[1]), 1e-6), rot: ang(cc, p[1]) };
}
function ellipseFromAxis(p) {
  const cc = mid(p[0], p[1]), rx = dist(p[0], p[1]) / 2;
  if (rx < EPS) return null;
  return { t: 'ellipse', c: cc, rx, ry: Math.max(segDist(p[2], p[0], p[1]), 1e-6), rot: ang(p[0], p[1]) };
}

defc('revcloud', {
  hint: 'Guide crosshairs along the cloud path · <em>Enter</em> to close', group: 'draw',
  init: c => { c.pts = []; c.arc = DOC.revArc || 500; },
  text(c, s) { const v = parseLen(s); if (!isNaN(v) && v > 0) { c.arc = DOC.revArc = v; cliPrint('Arc length ' + fmt(v)); return true; } return false; },
  point(c, p) {
    if (!c.pts.length || dist(c.pts[c.pts.length - 1], p) > c.arc * 0.8) c.pts.push(p);
  },
  preview(c, p) {
    const pts = [...c.pts, p];
    return pts.length > 2 ? [pv({ t: 'pline', pts: revCloud(pts, c.arc, false) })] : null;
  },
  enter(c) {
    if (c.pts.length > 2) { begin(); addEnt({ t: 'pline', pts: revCloud(c.pts, c.arc, true), closed: true }); commit('Revision cloud'); }
    endCmd();
  },
});
function revCloud(pts, r, closed) {
  const out = [];
  const P = closed ? [...pts, pts[0]] : pts;
  for (let i = 1; i < P.length; i++) {
    const a = P[i - 1], b = P[i], L = dist(a, b);
    if (L < 1e-9) continue;
    const n = Math.max(1, Math.round(L / r));
    const seg = L / n, rr = seg / 2;
    const u = norm(sub(b, a)), nn = perp(u);
    for (let k = 0; k < n; k++) {
      const c0 = add(a, mul(u, seg * (k + .5)));
      const base = Math.atan2(u[1], u[0]);
      for (let s = 0; s <= 8; s++) {
        const t = Math.PI - (s / 8) * Math.PI;
        out.push([c0[0] + rr * Math.cos(base + t), c0[1] + rr * Math.sin(base + t)]);
      }
    }
  }
  return out.length > 2 ? out : pts;
}

/** DIMLINEAR picks horizontal or vertical from where the dimension line is

function linearK(a, b, o) {

  return Math.abs(o[0] - m[0]) > Math.abs(o[1] - m[1]) ? 'vertical' : 'horizontal';
}
const DIM_PROMPT = {

defc('dim', {

    const k = map[s.toLowerCase()];

    return false;
  },
  point(c, p) {

      const e = pickAt(p, 10, x => x.t === 'circle' || x.t === 'arc');
      if (!e) return echo('Pick a circle or an arc');
      begin();
      addEnt({ t: 'dim', k: c.k, p1: e.c, p2: [e.c[0] + e.r * Math.cos(ang(e.c, p)), e.c[1] + e.r * Math.sin(ang(e.c, p))], layer: dimLayer() });
      commit('Dimension');

    }
    if (c.k === 'angular') {

/* ============================================================
   Undo: steps, groups and marks
   ------------------------------------------------------------
   `commit()` stamps every patch with a sequence number and, if a
   group is open, the group it belongs to. That is all UNDO needs
   to offer AutoCAD's Mark/Back and BEgin/End: a mark is a
   sequence number, and a group undoes as one operation because
   its patches all carry the same tag.
   ============================================================ */
function undoStep() {
  if (!HIST.past.length) { cliPrint('Nothing to undo'); return false; }
  const g = HIST.past[HIST.past.length - 1].grp;
  undo();
  if (g) while (HIST.past.length && HIST.past[HIST.past.length - 1].grp === g) undo();
  return true;
}
function redoStep() {
  if (!HIST.future.length) { cliPrint('Nothing to redo'); return false; }
  const g = HIST.future[HIST.future.length - 1].grp;
  redo();
  if (g) while (HIST.future.length && HIST.future[HIST.future.length - 1].grp === g) redo();
  return true;
}
function undoN(n) {
  let done = 0;
  for (let i = 0; i < n; i++) { if (!undoStep()) break; done++; }
  return done;
}
function undoMark() { HIST.marks.push(HIST.seq); cliPrint('Mark placed'); }
function undoBack() {
  if (!HIST.marks.length) { cliPrint('No mark has been placed. Use UNDO Mark first.', 'warn'); return 0; }
  const m = HIST.marks.pop();
  let n = 0;
  while (HIST.past.length && HIST.past[HIST.past.length - 1].seq > m) { undo(); n++; }
  cliPrint(n + ' operation' + (n === 1 ? '' : 's') + ' undone back to the mark');
  return n;
}
function undoGroupBegin() { HIST.group = ++HIST.groupSeq; cliPrint('Group begun'); }
function undoGroupEnd() { HIST.group = 0; cliPrint('Group ended'); }

/* ============================================================
   View commands — ZOOM and PAN, both transparent
   ============================================================ */
const VHIST = [];                                 /* ZOOM Previous stack */
function viewPush() {
  VHIST.push({ z: V.z, px: V.px, py: V.py, rot: V.rot });
  if (VHIST.length > 20) VHIST.shift();
}
function viewPop() {
  const v = VHIST.pop();
  if (!v) { cliPrint('No previous view.', 'warn'); return false; }
  V.z = v.z; V.px = v.px; V.py = v.py; V.rot = v.rot;
  draw(); if (typeof syncNav === 'function') syncNav();
  return true;
}
function docLimits() { return DOC.limits || [[0, 0], [420000, 297000]]; }
/** ZOOM All: the limits, or the extents when the drawing spills past them */
function zoomAll() {
  const L = docLimits();
  const b = bboxAll([...DOC.ents.values()].filter(visible));
  const box = b
    ? [Math.min(L[0][0], b[0]), Math.min(L[0][1], b[1]), Math.max(L[1][0], b[2]), Math.max(L[1][1], b[3])]
    : [L[0][0], L[0][1], L[1][0], L[1][1]];
  fit([{ t: 'line', a: [box[0], box[1]], b: [box[2], box[3]], layer: DOC.cur }]);
}
function zoomCenter(p, h) {
  if (h > 0) V.z = clamp(V.h / h, 1e-6, 20000);
  const s = w2s(p);
  V.px += V.w / 2 - s[0]; V.py += V.h / 2 - s[1];
  draw();
}
function zoomWindow(a, b) {
  const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
  const cr = Math.cos(V.rot), sr = Math.sin(V.rot);
  const cs = [a, [b[0], a[1]], b, [a[0], b[1]]].map(p => [p[0] * cr - p[1] * sr, p[0] * sr + p[1] * cr]);
  const xs = cs.map(p => p[0]), ys = cs.map(p => p[1]);
  const w = Math.max(Math.max(...xs) - Math.min(...xs), 1e-6);
  const h = Math.max(Math.max(...ys) - Math.min(...ys), 1e-6);
  V.z = clamp(Math.min(V.w / w, V.h / h), 1e-6, 20000);
  zoomCenter([cx, cy], 0);
}
const ZOOM_PROMPT = 'Specify corner of window, enter a scale factor (nX or nXP), or [All/Center/Dynamic/Extents/Previous/Scale/Window/Object]:';
defc('zoom', {
  group: 'view', hint: ZOOM_PROMPT,
  init(c) {
    c.pts = []; c.mode = 'win';
    if (c.arg && c.arg.opt) { if (this.text(c, c.arg.opt)) return; }
  },
  text(c, s) {
    const k = String(s).trim().toLowerCase();
    if (k === 'a') { viewPush(); zoomAll(); endCmd(); return true; }
    if (k === 'e') { viewPush(); fit(); endCmd(); return true; }
    if (k === 'p') { viewPop(); endCmd(); return true; }
    if (k === 'o') {
      if (!SEL.size) { cliPrint('Select objects first, then ZOOM Object.', 'warn'); endCmd(); return true; }
      viewPush(); fit(selEnts()); endCmd(); return true;
    }
    if (k === 'd') { cliPrint('Dynamic zoom is not available; use Window or Extents.', 'warn'); return true; }
    if (k === 'c') { c.mode = 'cen'; c.pts = []; hint('Specify center point:'); return true; }
    if (k === 'w') { c.mode = 'win'; c.pts = []; hint('Specify first corner:'); return true; }
    if (k === 's') { hint('Enter a scale factor (nX or nXP):'); return true; }
    /* 2x / 0.5x relative to the current view, plain n relative to the limits */
    const m = k.match(/^(-?[\d.]+)(xp?)?$/);

      viewPush();
      if (m[2]) zoomAt(V.w / 2, V.h / 2, n);
      else {
        const L = docLimits();
        const h = Math.max(L[1][1] - L[0][1], 1e-6);
        zoomCenter(s2w(V.w / 2, V.h / 2), h / n);
      }
      endCmd(); return true;
    }
    if (c.mode === 'cen' && c.pts.length === 1) {
      const h = parseLen(s);
      if (!isNaN(h) && h > 0) { viewPush(); zoomCenter(c.pts[0], h); endCmd(); return true; }
    }
    return false;
  },
  point(c, p) {
    c.pts.push(p);

      return;
    }

  preview(c, p) {

function varReport(pattern) {

    .replace(/\*/g, '.*').replace(/\?/g, '.') + '$', 'i');
  const names = varNames().filter(n => rx.test(n));
  if (!names.length) { cliPrint('No variable matches "' + pattern + '".', 'warn'); return; }
  for (const n of names) {
    const v = SYSVAR[n];
    cliPrint('  ' + n.padEnd(18) + varStr(v).padEnd(14) + (v.ro ? '(read only) ' : '') + (v.desc || ''));
  }

/* Commands that may be run inside another command with a leading apostrophe.
   AutoCAD's rule: anything that does not change the drawing database. */
const TRANSPARENT = {
  zoom: 1, pan: 1, gridcmd: 1, snapcmd: 1, orthocmd: 1, osnapcmd: 1,
  setvar: 1, layercmd: 1, limits: 1, linetype: 1, lweight: 1, unitscmd: 1,
};

/* ============================================================
   The dispatcher — one entry point for everything typed
   ------------------------------------------------------------
   Order of interpretation follows AutoCAD: a running command
   gets first refusal on its own prompt (keyword, then number,
   then coordinate), and only when nothing is running does a word
   get to name a command, an alias or a system variable. Typing
   CIRCLE at "Specify next point:" is an error there too — that
   is what the leading apostrophe is for.
   ============================================================ */
function repeatLast() {
  if (ST.lastCmd && CMDS[ST.lastCmd]) {
    if (CLI.echo) cliPrint('Command: ' + cmdName(ST.lastCmd));
    startCmd(ST.lastCmd, ST.lastArg, true);
    return true;
  }
  if (CLI.history.length) return runInput(CLI.history[CLI.history.length - 1]);
  return false;
}
function runInput(line) {
  const s = String(line == null ? '' : line).trim();
  if (!s) {
    if (CMD) { cliAnswer(''); cmdEnter(); return true; }
    return repeatLast();
  }
  cliAnswer(s);
  if (s[0] === "'") return runTransparentInput(s.slice(1));
  return dispatch(s);
}
function runTransparentInput(rest) {
  const words = String(rest).trim().split(/\s+/).filter(Boolean);
  if (!words.length) return false;
  const r = resolveWord(words[0]);
  if (!r) { cliPrint('Unknown command "' + words[0].toUpperCase() + '".  Press F1 for help.', 'err'); return false; }
  if (r.kind === 'var') return setVarFromWords(r, words);
  if (r.kind === 'meta') { META[r.key].fn(); return true; }
  if (!TRANSPARENT[r.key]) {
    cliPrint('** ' + r.name + ' may not be invoked transparently **', 'err');
    return false;
  }
  startTransparent(r.key, r.opt);
  for (let i = 1; i < words.length && CMD; i++) runInput(words[i]);
  return true;
}
function setVarFromWords(r, words) {
  const v = SYSVAR[r.name];
  if (words.length < 2) {
    if (CMD) { cliPrint(v.name + ' = ' + varStr(v)); return true; }
    startCmd('setvar', { name: r.name }, true);
    return true;
  }
  if (v.ro) { cliPrint(v.name + ' = ' + varStr(v) + '  (read only)'); return true; }
  const val = varParse(v, words.slice(1).join(' '));
  if (val === undefined) { cliPrint('Requires a ' + v.type + ' value.', 'err'); return false; }
  v.set(val);
  cliPrint(v.name + ' = ' + varStr(v));
  return true;
}
function dispatch(s) {
  const words = s.split(/\s+/).filter(Boolean);
  const first = words[0];
  if (CMD) {
    if (CMD.phase === 'sel') {
      if (/^all$/i.test(first)) { selectAll(); cliPrint(SEL.size + ' found'); return true; }
      cliPrint('Invalid selection.', 'err');
      return false;
    }
    if (cmdText(s)) {
      cmdPreview(ST.cur || [0, 0]);
      if (typeof syncDyn === 'function') syncDyn();
      draw(); return true;
    }
    cliPrint('Point or option keyword required.', 'err');
    if (typeof renderPrompt === 'function') renderPrompt();
    return false;
  }
  const r = resolveWord(first);
  if (!r) { cliPrint('Unknown command "' + first.toUpperCase() + '".  Press F1 for help.', 'err'); return false; }
  if (r.kind === 'var') return setVarFromWords(r, words);
  if (r.kind === 'meta') {
    cliRemember(r.name);
    try { META[r.key].fn(); } catch (e) { console.error(e); cliPrint('That did not work.', 'err'); }
    return true;
  }
  if (CMDS[r.key].group === 'arch' && typeof MODE !== 'undefined' && MODE !== 'arch') setMode('arch');
  startCmd(r.key, r.opt, true);
  /* the rest of the line is fed in as if each word had been Entered, which is
     how AutoCAD scripts work: LINE 0,0 1000,0 draws a line */
  for (let i = 1; i < words.length && CMD; i++) runInput(words[i]);
  return true;
}

/* ============================================================
   AutoComplete
   ------------------------------------------------------------
   Prefix matches first, then mid-string, and inside each band
   the commands used most recently come first. Aliases are listed
   next to the command they expand to, the way AutoCAD's list
   shows them.
   ============================================================ */
function cmdCatalog() {
  const idx = nameIndex(), out = [];
  for (const name of Object.keys(idx)) out.push({ name, kind: idx[name].kind, key: idx[name].key });
  if (CLI.autoComplete & 8) for (const n of varNames()) out.push({ name: n, kind: 'var', key: n });
  return out;
}
/** the alias that expands to `name`, shortest first, for the list hint */
function aliasFor(name) {
  let best = null;
  for (const src of [USERALIAS, ALIAS])
    for (const a of Object.keys(src))
      if (src[a] === name && (!best || a.length < best.length)) best = a;
  return best ? best.toUpperCase() : null;
}
function acSuggest(text, limit) {
  const q = String(text || '').trim().replace(/^[_'-]+/, '').toLowerCase();
  if (!q) return [];
  const mid = !!(CLI.autoComplete & 16);
  const seen = new Set(), out = [];
  for (const c of cmdCatalog()) {
    const lo = c.name.toLowerCase();
    let rank = -1;
    if (lo.startsWith(q)) rank = 0;
    else if (mid && lo.indexOf(q) > 0) rank = 2;
    /* an alias typed in full offers its command straight away */
    const al = (USERALIAS[q] || ALIAS[q] || '').toUpperCase();
    if (al && al === c.name) rank = Math.min(rank < 0 ? 9 : rank, 1);
    if (rank < 0 || seen.has(c.name)) continue;
    seen.add(c.name);
    const m = CLI.mru.indexOf(c.name);
    out.push({ name: c.name, kind: c.kind, key: c.key, alias: aliasFor(c.name), rank, mru: m < 0 ? 999 : m });
  }
  out.sort((a, b) => a.rank - b.rank || a.mru - b.mru || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
  return out.slice(0, limit || 12);
}

/* ============================================================
   ORTHOGRAPH — 07b navigation commands and view variables
   ------------------------------------------------------------
   ZOOM with the options AutoCAD offers, PAN, DRAWORDER, and the

/* ---- the view scale, the way a drafter reads it ---- */
function viewScale() { return V.z / PX_PER_MM; }   /* screen mm per drawing mm */
function viewScaleText() {
  const s = viewScale();
  if (!isFinite(s) || s <= 0) return '—';
  if (s >= 1) { const n = s < 10 ? +s.toFixed(2) : Math.round(s); return n + ':1'; }
  const inv = 1 / s;
  const n = inv < 10 ? +inv.toFixed(2) : inv < 1e6 ? Math.round(inv) : inv.toPrecision(3);
  return '1:' + n;
}
/** every view change funnels through here, so the shell can follow along */
function onViewChanged() {
  if (typeof syncNav === 'function') syncNav();
  if (typeof syncScale === 'function') syncScale();
  if (typeof syncCoord === 'function') syncCoord();
}

/* ---- cursor ----
   The crosshair is drawn on the canvas, so the operating system cursor is
   hidden over the drawing area and only comes back for the modes that have
   their own: the pan hand and the real-time zoom lens. */
const CUR_PAN = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><g fill='%23fff' stroke='%23000' stroke-width='1.2'><path d='M11 21c-3 0-5-2-6-4l-2-4c-.4-.9.6-1.8 1.4-1.2L7 14V5.5a1.2 1.2 0 0 1 2.4 0V11h.6V4a1.2 1.2 0 0 1 2.4 0v7h.6V5a1.2 1.2 0 0 1 2.4 0v6h.6V7.2a1.2 1.2 0 0 1 2.4 0V15c0 3.3-2 6-5.4 6z'/></g></svg>\") 12 12, grab";
const CUR_ZOOM = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><g fill='none' stroke='%23000' stroke-width='3'><circle cx='10' cy='10' r='6'/><path d='M14.5 14.5L21 21M7 10h6M10 7v6'/></g><g fill='none' stroke='%23fff' stroke-width='1.5'><circle cx='10' cy='10' r='6'/><path d='M14.5 14.5L21 21M7 10h6M10 7v6'/></g></svg>\") 10 10, zoom-in";
function navCursor() {
  const st = typeof stage !== 'undefined' ? stage : (typeof $ === 'function' ? $('#stage') : null);
  if (!st || !st.style) return;
  if (ST.panning) st.style.cursor = 'grabbing';
  else if (ST.panCmd || ST.panReady) st.style.cursor = CUR_PAN;
  else if (ST.rtzoom) st.style.cursor = CUR_ZOOM;
  else st.style.cursor = ST.inView === false ? 'crosshair' : 'none';
}

/* ============================================================
   ZOOM
   ============================================================ */
const ZOOM_HINT = 'Window corner, a scale (<em>2x</em>, <em>2xp</em>), or ' +
  '<em>A</em>ll <em>C</em>entre <em>D</em>ynamic <em>E</em>xtents <em>O</em>bject ' +
  '<em>P</em>revious <em>S</em>cale <em>W</em>indow · <em>Enter</em> for real time';

function endZoomModes() { ST.rtzoom = false; ST.dynz = null; navCursor(); }

/** a preview rectangle in the current layer colour */
function boxPv(b) { return pv({ t: 'pline', pts: [[b[0], b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]]], closed: true }); }

defc('zoom', {
  key: 'zoom', group: 'view', hint: ZOOM_HINT,
  init(c) {
    if (c.data && c.data.mode === 'object') {          /* returning from the select phase */
      const es = selEnts();
      const b = es.length ? bboxAll(es) : null;
      if (b) { pushView(); animView(viewForBox(b), true); }
      else echo('Nothing selected');
      c.done = true; endCmd(); return;
    }
    c.data = {};
    hint(ZOOM_HINT);
  },
  point(c, p) {
    const d = c.data;
    if (d.mode === 'center') {
      if (!d.cp) { d.cp = p; hint('Height in drawing units, or <em>Enter</em> to keep the current one'); return; }
      return;
    }
    if (d.mode === 'dynamic') { d.size = !d.size; hint(d.size ? 'Drag right to enlarge the view box · <em>Enter</em> to accept' : 'Move the view box · click to resize · <em>Enter</em> to accept'); return; }
    if (!d.w0) { d.w0 = p; hint('Opposite corner'); return; }
    pushView(); zoomWindow(d.w0, p, true); endCmd();
  },
  preview(c, p) {
    const d = c.data;
    if (d.mode === 'dynamic') {
      const out = [];
      if (d.ext) out.push(boxPv(d.ext));
      const hw = d.vw / 2 * (d.k || 1), hh = d.vh / 2 * (d.k || 1);
      if (d.size && d.anchor) {
        const k = clamp(dist(d.anchor, p) / Math.max(d.vw / 2, 1e-9), 0.02, 200);
        d.k = k;
      } else d.centre = p;
      const cpt = d.centre || p;
      if (d.size && d.anchor) { out.push(boxPv([d.anchor[0] - hw, d.anchor[1] - hh, d.anchor[0] + hw, d.anchor[1] + hh])); }
      else out.push(boxPv([cpt[0] - hw, cpt[1] - hh, cpt[0] + hw, cpt[1] + hh]));
      if (d.size && !d.anchor) d.anchor = cpt;
      if (!d.size) d.anchor = null;
      return out;
    }
    if (d.w0) return [boxPv([Math.min(d.w0[0], p[0]), Math.min(d.w0[1], p[1]), Math.max(d.w0[0], p[0]), Math.max(d.w0[1], p[1])])];
    return null;
  },
  text(c, s) {
    const d = c.data;
    s = String(s).trim();
    if (d.mode === 'center' && d.cp) {
      const h = parseLen(s);
      pushView(); zoomCenter(d.cp, isNaN(h) ? 0 : h, true); endCmd(); return true;
    }
    if (d.mode === 'scale') { return zoomScaleText(s) ? (endCmd(), true) : false; }
    const k = s.toLowerCase();
    if (k === 'a' || k === 'all') { pushView(); zoomAll(true); endCmd(); return true; }
    if (k === 'e' || k === 'extents') { pushView(); fit(null, true); endCmd(); return true; }
    if (k === 'p' || k === 'previous') { zoomPrev(); endCmd(); return true; }
    if (k === 'w' || k === 'window') { d.mode = 'window'; hint('First corner of the window'); return true; }
    if (k === 'c' || k === 'centre' || k === 'center') { d.mode = 'center'; hint('Centre point'); return true; }
    if (k === 's' || k === 'scale') { d.mode = 'scale'; hint('Scale factor — <em>2</em> of the full view, <em>2x</em> of the current one, <em>2xp</em> relative to paper'); return true; }
    if (k === 'r' || k === 'realtime') { startRealtimeZoom(c); return true; }
    if (k === 'o' || k === 'object') {
      d.mode = 'object';
      if (SEL.size) { c.data = { mode: 'object' }; this.init(c); return true; }
      c.phase = 'sel'; hint('Select the objects to zoom to, then press <em>Enter</em>'); return true;
    }
    if (k === 'd' || k === 'dynamic') { startDynamicZoom(c); return true; }
    if (zoomScaleText(s)) { endCmd(); return true; }
    return false;
  },
  enter(c) {
    const d = c.data;
    if (d.mode === 'dynamic') { applyDynamicZoom(c); return; }
    if (d.mode === 'center' && d.cp) { pushView(); zoomCenter(d.cp, 0, true); endCmd(); return; }
    if (!d.mode) { startRealtimeZoom(c); return; }
    endCmd();
  },
  done() { endZoomModes(); },
});
/** 2 · 2x · 2xp — returns true when the text really was a scale */
function zoomScaleText(s) {
  const m = String(s).trim().match(/^(-?[\d.]+)\s*(xp|x)?$/i);
  if (!m) return false;
  const f = parseFloat(m[1]);
  if (!(f > 0)) return false;
  pushView();
  const kind = (m[2] || '').toLowerCase();
  /* xp is paper-relative: at 1xp one drawing unit plots one paper unit */
  if (kind === 'xp') { const c = viewCentreR(viewState()), nz = clamp(PX_PER_MM * f, ZMIN, ZMAX); animView({ z: nz, px: V.w / 2 - c[0] * nz, py: V.h / 2 + c[1] * nz, rot: V.rot }, true); }
  else zoomScale(f, kind === 'x', true);
  return true;
}
function startRealtimeZoom(c) {
  ST.rtzoom = true; ST.dynz = null;
  hint('Drag up to zoom in, down to zoom out · <em>Esc</em> or right-click to stop');
  navCursor(); echo('ZOOM real time');
}
function startDynamicZoom(c) {
  const d = c.data;
  d.mode = 'dynamic'; d.size = false; d.k = 1; d.anchor = null;
  const b = bboxAll([...DOC.ents.values()].filter(visible));
  d.ext = b ? b.slice() : null;
  d.vw = V.w / V.z; d.vh = V.h / V.z;
  const cur = s2w(V.w / 2, V.h / 2);
  d.centre = cur;
  pushView();
  if (b) animView(viewForBox(b, 0.55), true);
  hint('Move the view box · click to resize · <em>Enter</em> to accept');
}
function applyDynamicZoom(c) {
  const d = c.data;
  const cpt = (d.size && d.anchor) ? d.anchor : (d.centre || s2w(V.w / 2, V.h / 2));
  const hw = d.vw / 2 * (d.k || 1), hh = d.vh / 2 * (d.k || 1);
  animView(viewForBox([cpt[0] - hw, cpt[1] - hh, cpt[0] + hw, cpt[1] + hh], 1), true);
  endCmd();
}

DOC.blocks = DOC.blocks || {};
function insertEnts(ins) {
  const b = (DOC.blocks || {})[ins.name];
  if (!b) return [];
  const cs = Math.cos(ins.rot || 0), sn = Math.sin(ins.rot || 0);
  const sx = ins.sx == null ? 1 : ins.sx, sy = ins.sy == null ? 1 : (ins.sy == null ? sx : ins.sy);
  const f = p => {
    const q = [(p[0] - b.base[0]) * sx, (p[1] - b.base[1]) * sy];
    return [ins.p[0] + q[0] * cs - q[1] * sn, ins.p[1] + q[0] * sn + q[1] * cs];
  };
  return b.ents.map(e => { const n = clone(e); delete n.id; n.layer = n.layer === '0' ? ins.layer : n.layer; return xf(n, f); });
}
GEOM.insert = {
  shapes(ins, tol) {
    const out = [];
    for (const e of insertEnts(ins)) out.push(...(GEOM[e.t] ? shapes(e, tol) : shapesOfPrimitive(e, tol)));
    return out;
  },
  grips: ins => [{ p: ins.p, k: 'p' }],
  grip(ins, k, p) { ins.p = p; },
  xf(ins, fn) {
    const p2 = fn(ins.p), q = fn(add(ins.p, [Math.cos(ins.rot || 0), Math.sin(ins.rot || 0)]));
    const s = dist(p2, q);
    ins.rot = ang(p2, q); ins.sx = (ins.sx == null ? 1 : ins.sx) * s; ins.sy = (ins.sy == null ? 1 : ins.sy) * s; ins.p = p2;
  },
};
function shapesOfPrimitive(e, tol) {
  switch (e.t) {
    case 'line': return [{ pts: [e.a, e.b], lt: e.lt }];
    case 'pline': case 'spline': return [{ pts: e.pts, closed: !!e.closed, lt: e.lt }];
    case 'circle': return [{ c: e.c, r: e.r, lt: e.lt }];
    case 'arc': return [{ c: e.c, r: e.r, a0: e.a0, a1: e.a1, lt: e.lt }];
    case 'ellipse': return [{ pts: poly(e, tol || 48), lt: e.lt }];
    case 'text': return [{ text: e.s, p: e.p, h: e.h, rot: e.rot || 0, anchor: e.anchor || 'l' }];
    case 'dim': return flattenToPrimitives(e).flatMap(q => shapesOfPrimitive(q, tol));

}

/** closed entities whose interior contains p, smallest area first */
function findEnclosing(p) {
  const hits = [];
  for (const e of DOC.ents.values()) {
    if (!visible(e)) continue;
    let ring = null;
    if ((e.t === 'pline' || e.t === 'spline') && e.closed) ring = e.pts;
    else if (e.t === 'circle' || e.t === 'ellipse') ring = poly(e, 64);
    else if (e.t === 'room') ring = e.pts;
    else if (e.t === 'wall') ring = wallOutline(e);
    if (!ring || ring.length < 3) continue;
    if (pointInPoly(p, ring)) hits.push({ e, a: polyArea(ring) });
  }
  hits.sort((x, y) => x.a - y.a);
  return hits.length ? [hits[0].e] : [];
}
function hatchFrom(ents) {
  const loops = [];
  for (const e of ents) {
    if ((e.t === 'pline' || e.t === 'spline') && e.closed) loops.push(e.pts);
    else if (e.t === 'circle' || e.t === 'ellipse') loops.push(poly(e, 64));
    else if (e.t === 'room') loops.push(e.pts);
    else if (e.t === 'wall') loops.push(wallOutline(e));
  }
  if (!loops.length) return echo('Select closed shapes to hatch');
  modal(`<h3>Hatch</h3>
    <div class="row"><label>Pattern</label><select class="f" id="hp">
      <option value="line">Diagonal lines</option><option value="cross">Cross hatch</option><option value="solid">Solid fill</option></select></div>

      sp: parseLen($('#hs').value) || 200, hatchAng: parseFloat($('#ha').value) || 0,
    });
    SEL.clear(); SEL.add(n.id);
    commit('Hatch');
  });
}
GEOM.hatch = {
  shapes: h => (h.loops || []).map(L => ({ pts: L, closed: true, role: 'room' })),

/* ===== 09-archcmd.js ===== */
/* ============================================================
   ORTHOGRAPH — 09 architecture commands
   ============================================================ */
const ARCH = { wt: 'brk230', dt: 'sgl900', wtp: 'w1212', just: 'center', jmode: 'centre', wallH: 3000 };

/* ---------------- wall placement ----------------
   Architects place walls by centreline, inner face or outer face. Left and
   right are what the geometry actually stores; which of them "inner" means
   depends on which way round the chain being drawn encloses its space, so the
   winding is worked out as the chain grows and the walls already placed are
   re-justified the moment the first corner tells us the answer.            */
const JUST_MODES = ['centre', 'inner', 'outer'];
const justLabel = m => m === 'centre' ? 'centreline' : m === 'inner' ? 'inner face' : 'outer face';
/** +1 anticlockwise, -1 clockwise, 0 while the chain is still a straight line */
function chainWind(pts) {
  if (!pts || pts.length < 3) return 0;
  let a = 0;
  for (let i = 0; i < pts.length; i++) a += cross(pts[i], pts[(i + 1) % pts.length]);
  if (Math.abs(a) < 1e-6) return 0;
  return a > 0 ? 1 : -1;
}
/** the stored justification for a placement mode and a chain winding.
    An anticlockwise ring encloses the space on the left of every leg. */
function justFor(mode, wind) {
  if (mode !== 'inner' && mode !== 'outer') return 'center';
  const inner = wind < 0 ? 'right' : 'left';
  return mode === 'inner' ? inner : (inner === 'left' ? 'right' : 'left');
}

/** Ortho and polar as hard constraints on the point the command accepts —
    not merely on the cursor. An object snap must never be able to slip a
    three degree wall past F8. */
function wallConstrain(ref, p) {
  if (!ref || !p) return p ? p.slice() : p;
  const d = sub(p, ref);
  if (Math.abs(d[0]) < 1e-12 && Math.abs(d[1]) < 1e-12) return p.slice();
  if (ST.ortho) {
    const q = Math.abs(d[0]) >= Math.abs(d[1]) ? [ref[0] + d[0], ref[1]] : [ref[0], ref[1] + d[1]];
    ST.tracks = [[ref, q]];
    return q;
  }
  if (ST.polar) {
    const inc = rad(ST.polarInc || 90);
    if (inc > 1e-9) {
      const a = Math.atan2(d[1], d[0]), k = Math.round(a / inc) * inc;
      if (Math.abs(wrapS(a - k)) < rad(3.2)) {
        const dir = [Math.cos(k), Math.sin(k)], L = dot(d, dir);
        if (L > EPS) { const q = add(ref, mul(dir, L)); ST.tracks = [[ref, q]]; return q; }
      }
    }
  }
  return p.slice();
}
/** unit direction from ref towards the cursor, after the same constraint */
function wallDir(ref, cur) {
  if (!ref || !cur) return null;
  const u = norm(sub(wallConstrain(ref, cur), ref));
  return (u[0] || u[1]) ? u : null;
}
function wallCmdT(c) { return (wallType(c.wt) || {}).t || 100; }
/** the point the wall command really commits to: constrained, then pulled onto
    a neighbouring node or centreline — but never at the cost of the constraint */
function wallAcceptPoint(c, p, raw) {
  const ref = c.pts.length ? c.pts[c.pts.length - 1] : null;
  const q = raw ? p.slice() : wallConstrain(ref, p);
  const s = wallCleanPoint(q, wallCmdT(c), null, ref);
  if (dist(s, q) < 1e-9) return q;
  if (!raw && ref && ST.ortho && dist(wallConstrain(ref, s), s) > 1e-6) return q;
  return s;
}
function wallHint(c) {
  const n = (wallType(c.wt) || {}).name;
  hint(`${c.pts.length ? 'Next point' : 'Wall start point'} · <em>T</em> type (${esc(n)})` +
    ` · <em>J</em> ${justLabel(c.jmode)}` +
    (c.pts.length > 1 ? ' · <em>C</em> close · <em>U</em> undo · <em>Enter</em> end' : ''));
}

defc('wall', {
  group: 'arch', hint: 'Wall start point',
  init(c) {
    c.pts = []; c.ids = []; c.wind = 0;
    c.wt = ARCH.wt; c.jmode = ARCH.jmode;
    c.th = ARCH.wallTh || null;                    /* a thickness override outlives the command */
    wallHint(c);
  },
  text(c, s) {
    if (/^t$/i.test(s)) { pickWallType(t => { c.wt = ARCH.wt = t; echo((wallType(t) || {}).name); wallHint(c); draw(); }); return true; }
    if (/^j$/i.test(s)) {
      c.jmode = ARCH.jmode = JUST_MODES[(JUST_MODES.indexOf(c.jmode) + 1) % JUST_MODES.length];
      if (c.ids && c.ids.length) { begin(); wallRejustify(c); commit('Placement'); }
      wallHint(c);
      echo('Placement: ' + justLabel(c.jmode)); draw(); return true;
    }
    if (/^c$/i.test(s) && c.pts.length > 2) {
      placeWall(c, c.pts[c.pts.length - 1], c.pts[0]); endCmd(); return true;
    }
    if (/^u$/i.test(s) && c.pts.length > 1) { undo(); c.pts.pop(); c.ids.pop(); wallRejustify(c); wallHint(c); return true; }
    const ref = c.pts.length ? c.pts[c.pts.length - 1] : null;
    /* typed coordinates are explicit and override ortho, exactly as in AutoCAD */
    if (/[@<,]/.test(s)) {
      const q = parseCoord(s, ref, ST.cur);
      if (q) { c.raw = true; cmdPoint(q); return true; }
    }
    const v = parseLen(s);                          /* a bare length runs along the lock */
    if (!isNaN(v) && v > 0 && ref) {
      const u = wallDir(ref, ST.cur);
      if (u) { c.raw = true; cmdPoint(add(ref, mul(u, v))); return true; }
    }
    return false;
  },
  point(c, p) {
    const raw = !!c.raw; c.raw = false;
    const q = wallAcceptPoint(c, p, raw);
    c.pts.push(q);
    if (c.pts.length >= 2) placeWall(c, c.pts[c.pts.length - 2], q);
    wallHint(c);
  },
  preview(c, p) {
    if (!c.pts.length) return null;
    const a = c.pts[c.pts.length - 1];
    const b = wallAcceptPoint(c, p, false);
    const wind = chainWind([...c.pts, b]) || c.wind;
    return [pv({ t: 'wall', a, b, wt: c.wt, th: c.th || null, just: justFor(c.jmode, wind),
      h: ARCH.wallH, lvl: DOC.curLevel, layer: 'A-WALL' })];
  },

}

defc('wallrect', {
  group: 'arch', hint: 'First corner of the room',
  init: c => { c.pts = []; c.wt = ARCH.wt; c.jmode = ARCH.jmode; c.th = ARCH.wallTh || null; },

    if (/^j$/i.test(s)) {

/* corners run anticlockwise, so the enclosed side is the left of every leg */
function wallRectPts(a, b) {
  const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]);

  const c = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];

/* WALLJOIN — pick two walls and their corner is solved, or clean a whole
   selection of near-miss corners in one go. Esc leaves nothing behind. */
defc('walljoin', {
  group: 'arch', needSel: true,
  selHint: 'Select the walls to clean up and press <em>Enter</em> — or press <em>Enter</em> now to pick two',
  init(c) {

    if (ws.length >= 2) { cleanWallSet(ws); return endCmd(); }
    if (ws.length === 1) { c.w = ws[0]; hint('Pick the wall to join it to · <em>Esc</em> cancel'); return; }
    hint('Pick the first wall · <em>Esc</em> cancel');

      echo('First wall — now pick the one it should meet');
      hint('Pick the wall to join it to · <em>Esc</em> cancel');
      return;
    }
    if (w.id === c.w.id) return echo('Pick a different wall');
    joinTwoWalls(c.w, w);
    endCmd();
  },
  done() { SEL.clear(); },
});
/** move the nearest end of each wall onto the true centreline intersection */
function joinTwoWalls(A, B) {
  const X = xLineLine(A.a, A.b, B.a, B.b, true);
  if (!X.length) { echo('Those two walls are parallel'); return; }
  const P = X[0];
  const reach = w => Math.max(wallLen(w) * 0.75, wallT(w) * 10);
  const ea = dist(A.a, P) <= dist(A.b, P) ? 'a' : 'b';
  const eb = dist(B.a, P) <= dist(B.b, P) ? 'a' : 'b';
  if (dist(A[ea], P) > reach(A) || dist(B[eb], P) > reach(B)) {
    echo('Those two walls do not meet anywhere near their ends'); return;
  }
  begin();
  for (const [w, e] of [[A, ea], [B, eb]]) {
    const L0 = wallLen(w);
    mut(w); w[e] = P.slice();
    if (e === 'a') wallShiftOpenings(w, wallLen(w) - L0);
    wallReclampOpenings(w);
  }
  commit('Walls joined');
}
/** pull every near-miss corner in a set onto its solved intersection */
function cleanWallSet(ws) {
  const tol = ws.reduce((m, w) => Math.max(m, wallT(w)), 100) * 1.5;
  begin();
  let n = 0;
  for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++) {
    const A = ws[i], B = ws[j];
    for (const ea of ['a', 'b']) for (const eb of ['a', 'b']) {
      const d = dist(A[ea], B[eb]);
      if (d <= 1e-9 || d > tol) continue;
      const X = xLineLine(A.a, A.b, B.a, B.b, true);
      const P = (X.length && dist(X[0], A[ea]) <= tol * 2) ? X[0] : mid(A[ea], B[eb]);
      mut(A); A[ea] = P.slice(); mut(B); B[eb] = P.slice(); n++;
    }
  }
  for (const w of ws) wallReclampOpenings(w);
  commit(n ? `Cleaned ${n} corner${n > 1 ? 's' : ''}` : 'Nothing to clean up');
}

/* WALLSPLIT — click the wall, then the split point. A click that already

  group: 'arch', hint: 'Click the wall you want to split · <em>Esc</em> cancel',

  },
  point(c, p) {
    if (!c.w || !DOC.ents.get(c.w.id)) {
      const hit = pickWallAt(p, px(30));
      if (!hit) return echo('Click on a wall to split it');
      c.w = hit.w; SEL.clear(); SEL.add(hit.w.id);
      const L = wallLen(hit.w);
      if (hit.d > 10 && hit.d < L - 10) return doWallSplit(c, hit.d);
      echo('Now pick the point to split at');
      hint(`Split point along the wall (0 – ${fmt(L)}) · type a distance · <em>Esc</em> cancel`);
      return;
    }
    doWallSplit(c, dot(sub(p, c.w.a), wallU(c.w)));
  },
  preview(c, p) {
    if (!c.w || !DOC.ents.get(c.w.id)) return null;
    const u = wallU(c.w), d = clamp(dot(sub(p, c.w.a), u), 0, wallLen(c.w));
    const q = add(c.w.a, mul(u, d)), n = mul(perp(u), wallT(c.w));
    return [pv({ t: 'line', a: sub(q, n), b: add(q, n), lt: 'dashed', layer: 'A-WALL' })];
  },
  done() { SEL.clear(); },
});
function doWallSplit(c, d) {
  const w = c.w && DOC.ents.get(c.w.id);
  if (!w) { echo('That wall has gone'); return endCmd(); }
  const L = wallLen(w);
  if (!(d > 10 && d < L - 10)) return echo('Too close to the end — pick a point along the wall');
  const u = wallU(w), split = add(w.a, mul(u, d));
  begin();
  const b0 = w.b;
  mut(w); w.b = split;
  const n = addEnt({ t: 'wall', a: split, b: b0, wt: w.wt, th: w.th, just: w.just,
    hatch: w.hatch, h: w.h, lvl: w.lvl, layer: w.layer });
  /* re-home openings that now sit past the split */
  for (const o of (openingsByHost().get(w.id) || [])) {
    if (o.pos > d) { mut(o); o.host = n.id; o.pos -= d; }
  }
  commit('Wall split');
  SEL.clear(); SEL.add(n.id);
  c.w = null;
  hint('Click the wall you want to split · <em>Esc</em> cancel');
}

/* ===== 10-dxf.js ===== */
/* ============================================================
   ORTHOGRAPH — 10 DXF in and out
   Writer targets AC1015 (R2000) so ellipses, splines and real
   DIMENSION entities survive the round trip. Reader accepts
   R12 through R2018.
   ============================================================ */

/* ---------------- reader ---------------- */
function dxfScan(txt) {
  const raw = txt.split(/\r\n|\r|\n/);
  const out = [];
  for (let i = 0; i + 1 < raw.length; i++) {
    const code = parseInt(raw[i].trim(), 10);
    if (isNaN(code)) continue;
    out.push([code, raw[i + 1]]);
    i++;
  }
  return out;
}
/** collect one entity's group codes; points assembled per 10/11/12… family */
function readOne(g, i) {
  const type = g[i][1];
  const o = { type, g: Object.create(null), P: Object.create(null) };
  let j = i + 1;
  for (; j < g.length && g[j][0] !== 0; j++) {
    const c = g[j][0], v = g[j][1];
    if (c >= 10 && c <= 39) {
      const f = c % 10, ax = Math.floor(c / 10) - 1;
      const arr = o.P[f] || (o.P[f] = []);
      if (ax === 0) arr.push([parseFloat(v), 0, 0]);
      else if (arr.length) arr[arr.length - 1][ax] = parseFloat(v);
      continue;
    }
    (o.g[c] || (o.g[c] = [])).push(v);
  }
  return { o, next: j };
}
const G = (o, c, d) => (o.g[c] !== undefined ? o.g[c][0] : d);
const GN = (o, c, d) => (o.g[c] !== undefined ? parseFloat(o.g[c][0]) : d);
const GI = (o, c, d) => (o.g[c] !== undefined ? parseInt(o.g[c][0]) : d);
const GA = (o, c) => (o.g[c] || []).map(parseFloat);
const PT = (o, f, i) => (o.P[f] && o.P[f][i || 0]) ? o.P[f][i || 0].slice(0, 2) : null;

function dxfParse(txt) {
  const g = dxfScan(txt);
  const res = { layers: {}, ents: [], blocks: {}, header: {}, styles: {} };
  let i = 0;
  while (i < g.length) {
    const [c, v] = g[i];
    if (c === 0 && v === 'SECTION') {

function exportSVG() {
  const b = bboxAll([...DOC.ents.values()].filter(visible)) || [0, 0, 100, 100];
  const pad = Math.max((b[2] - b[0]), (b[3] - b[1])) * .04 + 5;
  const x0 = b[0] - pad, y0 = b[1] - pad, w = b[2] - b[0] + pad * 2, h = b[3] - b[1] + pad * 2;
  const T2 = p => `${(+p[0].toFixed(4))},${(+(-p[1]).toFixed(4))}`;
  const out = [
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${(+x0.toFixed(3))} ${(+(-(y0 + h)).toFixed(3))} ${(+w.toFixed(3))} ${(+h.toFixed(3))}" width="${Math.round(w)}" height="${Math.round(h)}">`,
    `<rect x="${x0}" y="${-(y0 + h)}" width="${w}" height="${h}" fill="#ffffff"/>`,
  ];
  const dashMap = { dashed: '4,2.5', hidden: '2.5,1.8', center: '8,2,2,2', dashdot: '6,2,1,2' };
  const ink = c => (c.toLowerCase() === '#ffffff' || c.toLowerCase() === '#d7dee8' || c.toLowerCase() === '#e8e8e8') ? '#111111' : c;
  const strokeOf = (col, lw, lt) =>
    `stroke="${col}" stroke-width="${Math.max(lw, 0.13)}" fill="none" stroke-linecap="round" stroke-linejoin="round"` +
    (dashMap[lt] ? ` stroke-dasharray="${dashMap[lt]}"` : '');

  const emitShape = (s, col, lw, baseLt) => {
    const lt = s.lt || baseLt;
    const st = strokeOf(col, lw * (ROLE_W[s.role] || 1), lt);
    if (s.text != null) {
      out.push(`<text x="${s.p[0]}" y="${-s.p[1]}" font-family="Inter,Helvetica,sans-serif" font-size="${s.h}" fill="${col}" text-anchor="${s.anchor === 'c' ? 'middle' : s.anchor === 'r' ? 'end' : 'start'}" transform="rotate(${-deg(s.rot || 0)} ${s.p[0]} ${-s.p[1]})">${esc(s.text)}</text>`);
    } else if (s.pts) {
      if (s.pts.length < 2) return;
      out.push(`<path d="M${s.pts.map(T2).join('L')}${s.closed ? 'Z' : ''}" ${st}${s.role === 'arrowhead' ? ` fill="${col}"` : ''}/>`);
    } else if (s.r != null && s.a0 != null) {
      out.push(`<path d="M${arcPts(s, 64).map(T2).join('L')}" ${st}/>`);
    } else if (s.r != null) {
      out.push(`<circle cx="${s.c[0]}" cy="${-s.c[1]}" r="${s.r}" ${st}/>`);
    }
  };
  const ordered = [...DOC.ents.values()].filter(visible);
  ordered.sort((a, x) => ((a.t === 'hatch' || a.t === 'room') ? 0 : 1) - ((x.t === 'hatch' || x.t === 'room') ? 0 : 1));
  for (const e of ordered) {
    const col = ink(entColor(e));
    const lw = Math.max(entLw(e), 0.13);
    const lt = entLt(e);
    if (e.t === 'hatch') {
      for (const L of (e.loops || [])) {
        out.push(`<path d="M${L.map(T2).join('L')}Z" fill="${e.solid ? col + '55' : 'none'}" stroke="${col}" stroke-width="${lw}"/>`);
      }
      continue;
    }
    if (e.t === 'dim') {
      const g = dimGeom(e);
      for (const [a, bb] of g.lines) out.push(`<line x1="${a[0]}" y1="${-a[1]}" x2="${bb[0]}" y2="${-bb[1]}" ${strokeOf(col, lw, '')}/>`);
      for (const ar of g.arrows) out.push(`<path d="M${arrowPoly(ar.p, ar.a, g.S.arrow).map(T2).join('L')}Z" fill="${col}" stroke="none"/>`);
      out.push(`<text x="${g.tp[0]}" y="${-g.tp[1]}" font-family="Inter,sans-serif" font-size="${g.S.txt}" fill="${col}" text-anchor="middle" transform="rotate(${-deg(g.tr)} ${g.tp[0]} ${-g.tp[1]})">${esc(g.txt)}</text>`);
      continue;
    }
    if (e.t === 'text') { emitShape({ text: e.s, p: e.p, h: e.h, rot: e.rot, anchor: e.anchor }, col, lw, lt); continue; }
    if (e.t === 'point') {
      const r = DOC.textH * 0.4;
      out.push(`<path d="M${e.p[0] - r},${-e.p[1]}L${e.p[0] + r},${-e.p[1]}M${e.p[0]},${-e.p[1] - r}L${e.p[0]},${-e.p[1] + r}" ${strokeOf(col, lw, '')}/>`);
      continue;
    }
    for (const s of shapes(e, 96)) emitShape(s, col, lw, lt);
  }
  out.push('</svg>');
  return out.join('\n');
}

function exportPNG(maxPx) {
  const b = bboxAll([...DOC.ents.values()].filter(visible)) || [0, 0, 100, 100];
  const pad = Math.max(b[2] - b[0], b[3] - b[1]) * .05 + 4;
  const w = (b[2] - b[0] + pad * 2), h = (b[3] - b[1] + pad * 2);
  const k = clamp((maxPx || 2400) / Math.max(w, h), .001, 400);
  const c2 = document.createElement('canvas');
  c2.width = Math.round(w * k); c2.height = Math.round(h * k);
  const realCtx = ctx, old = Object.assign({}, V);
  const keep = {
    grid: ST.grid, cur: ST.cur, prev: ST.preview, snap: ST.snap, band: ST.band, hot: ST.hot,
    tracks: ST.tracks, sel: new Set(SEL),
  };
  V.z = k; V.px = -(b[0] - pad) * k; V.py = (b[3] + pad) * k;
  V.w = c2.width; V.h = c2.height; V.dpr = 1;
  ST.grid = false; ST.cur = null; ST.preview = null; ST.snap = null; ST.band = null; ST.hot = null; ST.tracks = null;
  SEL.clear();
  ctx = c2.getContext('2d');
  paint();
  ctx = realCtx;
  Object.assign(V, old);
  Object.assign(ST, { grid: keep.grid, cur: keep.cur, preview: keep.prev, snap: keep.snap, band: keep.band, hot: keep.hot, tracks: keep.tracks });
  keep.sel.forEach(i => SEL.add(i));
  draw();
  return c2;
}

const FILE_VERSION = 2;

   shape on demand and caches it outside the entity, so r.pts on a live auto
   room may be stale or absent. Materialise it here, on a copy, so the file
   carries a usable outline for anything that reads it without this app's
   tracer. Copying rather than writing through is the point: the document must
   not change because it was saved. */

  if (e.t !== 'room' || !e.auto || !e.seed) return e;
  const pts = roomBoundary(e);

  return Object.assign({}, e, { pts: pts.map(p => p.slice()) });
}

/** Pixel height the rail needs for a mode — must stay under the stage height. */
function railMetricsFor(mode, cols, tool) {
  const L = RAIL_LAYOUT, groups = RAILS[mode || MODE] || [];
  let rows = 0, tools = 0;
  for (const g of groups) { tools += g[1].length; rows += Math.ceil(g[1].length / cols); }
  const gridRows = groups.length + rows;
  return {
    groups: groups.length, tools, rows, cols, tool,
    height: L.pad * 2 + groups.length * L.head + rows * tool
      + Math.max(gridRows - 1, 0) * L.gap + Math.max(groups.length - 1, 0) * L.groupGap,
    width: cols * tool + (cols - 1) * L.gap + L.pad * 2,
  };
}
/** Height the rail may occupy: the viewport less the top and bottom bars. */
function railAvailable() {
  const h = (typeof window !== 'undefined' && window.innerHeight) || 800;
  return Math.max(h - 46 - 60, 200);
}
/** Every tool has to be visible without scrolling, so the rail fits itself to
    the window rather than assuming a tall one: widen to more columns first,
    then step the button size down. A fixed 3-column rail needed 674px and was
    silently clipping twelve tools on a 1366x768 laptop. */
function railFit(mode, avail) {
  const room = avail == null ? railAvailable() : avail;
  let best = null;
  for (const tool of [26, 24, 22, 20, 18]) {
    for (const cols of [3, 4, 5, 6]) {
      const m = railMetricsFor(mode, cols, tool);
      if (m.height <= room) return m;
      if (!best || m.height < best.height) best = m;
    }
  }

}
function railMetrics(mode) { return railFit(mode); }

const tipEl = el('div', 'tip'); document.body.appendChild(tipEl);
/** Shared hover tooltip. side: 'right' (rail) or 'bottom' (top bar / nav). */
function tipOn(b, label, key, side) {
  b.onpointerenter = () => {
    const q = b.getBoundingClientRect ? b.getBoundingClientRect() : null; if (!q) return;
    tipEl.innerHTML = esc(label) + (key ? '<b>' + esc(key) + '</b>' : '');
    const vh = (typeof window !== 'undefined' && window.innerHeight) || 900;
    const vw = (typeof window !== 'undefined' && window.innerWidth) || 1400;
    if (side === 'bottom') { tipEl.style.left = Math.min(q.left, vw - 190) + 'px'; tipEl.style.top = (q.bottom + 7) + 'px'; }
    else if (side === 'left') { tipEl.style.left = Math.max(q.left - 168, 8) + 'px'; tipEl.style.top = (q.top + 4) + 'px'; }
    else { tipEl.style.left = (q.right + 8) + 'px'; tipEl.style.top = Math.min(q.top + 4, vh - 40) + 'px'; }
    tipEl.style.opacity = 1;
  };
  b.onpointerleave = () => tipEl.style.opacity = 0;
  b.tipText = label + (key ? ' (' + key + ')' : '');
  if ('ariaLabel' in b) b.ariaLabel = b.tipText;      /* the visible tip is ours, not the browser's */
  return b;
}

function buildRail() {
  initShellUI();
  const r = $('#rail'); if (!r) return;
  clearNode(r);
  /* fit the rail to the window so nothing is ever clipped or scrolled away */
  RAIL_FIT = railFit(MODE);
  const cols = (RAIL_FIT && RAIL_FIT.cols) || RAIL_LAYOUT.cols;
  const tool = (RAIL_FIT && RAIL_FIT.tool) || RAIL_LAYOUT.tool;
  r.style.gridTemplateColumns = 'repeat(' + cols + ',var(--tool))';
  if (r.style) {
    r.style.setProperty ? r.style.setProperty('--tool', tool + 'px') : (r.style['--tool'] = tool + 'px');
  }
  const railW = cols * tool + (cols - 1) * RAIL_LAYOUT.gap + RAIL_LAYOUT.pad * 2;
  const root = document.documentElement;
  if (root && root.style && root.style.setProperty) root.style.setProperty('--rail', railW + 'px');
  for (const [title, tools] of (RAILS[MODE] || [])) {
    const h = el('div', 'rgrp', esc(title)); h.dataset.group = title;
    r.appendChild(h);
    for (const [k, label, key] of tools) {
      const b = el('button', 'tool', svg(k));
      b.dataset.tool = k; b.dataset.group = title; if (key) b.dataset.k = key;
      b.onclick = () => { tipEl.style.opacity = 0; k === 'select' ? endCmd() : startCmd(k); };
      tipOn(b, label, key, 'right');
      r.appendChild(b);
    }
  }
  syncTools();
}
function setMode(m) {

   Wired once, lazily, from whichever of buildRail()/buildProps() runs first,

function initShellUI() {
  if (_shellReady) return; _shellReady = true;

  if (u) { u.innerHTML = svg('undo'); u.className = 'tb ico'; tipOn(u, 'Undo', 'Ctrl+Z', 'bottom'); }
  if (rd) { rd.innerHTML = svg('redo'); rd.className = 'tb ico'; tipOn(rd, 'Redo', 'Ctrl+Y', 'bottom'); }

  const f = $('#vFit');
  if (f) { f.innerHTML = svg('fit'); tipOn(f, 'Zoom to fit the drawing', 'Q', 'left'); }
  const n = $('#vNorth');
  if (n) { n.innerHTML = svg('north'); tipOn(n, 'Reset view rotation', '', 'left'); n.onclick = () => setViewRot(0); }
  const g = $('#dsMore');
  if (g) { g.innerHTML = svg('gear'); g.onclick = toggleDrawPop; tipOn(g, 'Drawing settings', '', 'left'); }
  const vs = $('#vscale');
  if (vs) { vs.onclick = () => { pushView(); fit(null, true); }; syncScale(); }

  /* the widget is inside #stage: keep its pointer traffic off the canvas */
  const nav = $('#nav');

    ['pointerdown', 'pointerup', 'pointermove', 'click', 'dblclick'].forEach(t =>
      nav.addEventListener(t, ev => { if (ev.stopPropagation) ev.stopPropagation(); }));

  }

    document.addEventListener('pointerdown', ev => {
      const p = $('#dsPop'); if (!p || !p.classList.contains('show')) return;
      const t = ev.target;

}

/* ---------- navigation: fit + view rotation dial ---------- */
function setViewRot(r) {
  V.rot = wrapS(r);
  if (Math.abs(V.rot) < 1e-9) V.rot = 0;
  draw(); syncNav();
}
function viewRotDeg() { const d = deg(V.rot) % 360; return d < 0 ? d + 360 : d; }
function syncNav() {
  const rose = $('#dialRose');
  if (rose) rose.style.transform = 'rotate(' + (-deg(V.rot)).toFixed(3) + 'deg)';
  const a = $('#navAng'); if (a) a.textContent = viewRotDeg().toFixed(1) + '°';
  const n = $('#vNorth'); if (n) n.classList.toggle('off', !V.rot);
}
function initDial() {
  const d = $('#dialWrap'); if (!d || !d.addEventListener) return;
  let grab = null;
  const angAt = ev => {
    const r = d.getBoundingClientRect();
    return Math.atan2(ev.clientX - (r.left + r.width / 2), -(ev.clientY - (r.top + r.height / 2)));
  };
  d.addEventListener('pointerdown', ev => {
    if (ev.preventDefault) ev.preventDefault();
    if (ev.stopPropagation) ev.stopPropagation();
    grab = { a: angAt(ev), r: V.rot };
    if (d.setPointerCapture && ev.pointerId != null) { try { d.setPointerCapture(ev.pointerId); } catch (e) { } }
  });
  d.addEventListener('pointermove', ev => {
    if (!grab) return;
    if (ev.stopPropagation) ev.stopPropagation();
    let r = grab.r - (angAt(ev) - grab.a);
    if (ev.shiftKey) r = Math.round(r / rad(15)) * rad(15);

  });
  const up = () => { grab = null; };
  d.addEventListener('pointerup', up);
  d.addEventListener('pointercancel', up);
  d.addEventListener('pointerleave', up);
  d.addEventListener('dblclick', () => setViewRot(0));
}

    selRow(w, 'Level', (DOC.levels || []).map((l, i) => [i, l.name]), DOC.curLevel, v => { DOC.curLevel = +v; draw(); });
    selRow(w, 'Wall type', (DOC.wallTypes || []).map(t => [t.id, t.name]), ARCH.wt, v => { ARCH.wt = v; });
    addRow(w, 'Wall height', ARCH.wallH, v => { ARCH.wallH = Math.max(v, 1); });
    btnRow(w, 'Libraries', 'Edit types…', () => { w.classList.remove('show'); openTypeManager(); });
  }
  grpRow(w, 'Drawing');
  ro(w, 'Units', DOC.units);
  ro(w, 'Objects', DOC.ents.size);
  ro(w, 'Layers', DOC.layers.length);
  ro(w, 'Undo steps', HIST.past.length);
}

/* ---------- layers ---------- */
function buildLayers() {
  const w = $('#layers'); if (!w) return;
  clearNode(w);
  for (const l of DOC.layers) {
    const row = el('div', 'lay' + (l.name === DOC.cur ? ' cur' : ''));
    const sw = el('span', 'sw'); sw.style.background = l.color;
    sw.title = 'Layer colour';
    sw.onclick = ev => { ev.stopPropagation(); pickColor(l.color, c => { begin(); touchLayers(); l.color = c; commit('Layer colour'); draw(); }); };
    const nm = el('span', 'lname', esc(l.name));
    nm.title = l.name + ' — double-click to rename';
    nm.ondblclick = ev => { ev.stopPropagation(); renameLayer(l); };
    const eye = el('span', 'ic' + (l.on ? '' : ' off'), svg(l.on ? 'eye' : 'eyeoff', 16));
    eye.title = l.on ? 'Hide layer' : 'Show layer';
    eye.onclick = ev => { ev.stopPropagation(); begin(); touchLayers(); l.on = !l.on; commit(); draw(); buildLayers(); };
    const lk = el('span', 'ic' + (l.lock ? ' off' : ''), svg(l.lock ? 'lock' : 'unlock', 16));
    lk.title = l.lock ? 'Unlock layer' : 'Lock layer';
    lk.onclick = ev => { ev.stopPropagation(); begin(); touchLayers(); l.lock = !l.lock; commit(); draw(); buildLayers(); };
    row.append(sw, nm, eye, lk);
    row.onclick = () => {
      DOC.cur = l.name;
      if (SEL.size) { begin(); selEnts().forEach(e => { mut(e); e.layer = l.name; }); commit('Moved to ' + l.name); }
      buildLayers(); draw(); buildProps();
    };
    w.appendChild(row);
  }
}
function renameLayer(l) {
  modal(`<h3>Layer</h3>
    <div class="row"><label>Name</label><input class="f" id="ln" value="${esc(l.name)}"></div>
    <div class="row"><label>Lineweight</label><select class="f" id="lw">
      ${LW_LADDER.map(v => `<option value="${v}" ${lwSnap(l.lw) === v ? 'selected' : ''}>${v === 0 ? '0.00 (hairline)' : v.toFixed(2) + ' mm'}</option>`).join('')}
    </select></div>
    <div class="row"><label>Linetype</label><select class="f" id="lt">
      ${Object.keys(LTDEF).concat('solid').sort().map(t => `<option ${t === l.lt ? 'selected' : ''}>${t}</option>`).join('')}
    </select></div>`, () => {
    const n = $('#ln').value.trim().toUpperCase();
    begin(); touchLayers();
    if (n && n !== l.name && !DOC.layers.some(x => x.name === n)) {
      const old = l.name; l.name = n;
      for (const e of DOC.ents.values()) if (e.layer === old) { mut(e); e.layer = n; }
      if (DOC.cur === old) DOC.cur = n;
    }
    l.lw = lwSnap(parseFloat($('#lw').value));
    l.lt = $('#lt').value;
    commit('Layer updated'); buildLayers(); draw();
  });
}

/* ---------- property rows ---------- */
function addRow(w, label, val, on, raw) {

  const i = el('input', 'f');
  i.value = dispNum(val, raw);
  i.onchange = () => { const v = raw ? parseFloat(i.value) : parseLen(i.value); if (!isNaN(v)) on(v); };
  r.appendChild(i); w.appendChild(r); return i;
}
function ro(w, label, v) { w.appendChild(el('div', 'row', `<label>${label}</label><span class="ro">${esc(v)}</span>`)); }
function selRow(w, label, options, cur, on) {
  const r = el('div', 'row', `<label>${label}</label>`);
  const s = el('select', 'f');
  for (const [v, t] of options) { const o = el('option', '', t); o.value = v; if (String(v) === String(cur)) o.selected = true; s.appendChild(o); }
  s.onchange = () => on(s.value);
  r.appendChild(s); w.appendChild(r); return s;
}
function btnRow(w, label, text, on) {
  const r = el('div', 'row', `<label>${label}</label>`);
  const b = el('button', 'f'); b.style.textAlign = 'left'; b.textContent = text;
  b.onclick = on; r.appendChild(b); w.appendChild(r); return b;
}
function txtRow(w, label, val, on) {
  const r = el('div', 'row', `<label>${label}</label>`);

}
function grpRow(w, title) { w.appendChild(el('div', 'grp', esc(title))); return w; }

/** a segmented choice — three buttons that read as one control */
function segRow(w, label, options, cur, on) {
  const r = el('div', 'row', `<label>${label}</label>`);
  const g = el('div', 'seg');
  for (const o of options) {
    const [v, title, icon] = o;
    const b = el('button', 'segb' + (String(v) === String(cur) ? ' on' : ''), icon ? svg(icon) : esc(title));
    b.title = title;

/** the style header: what is being drawn, plus its actions */

/** a colour row: swatch, name, and a control to clear it */

  b.appendChild(sw); b.appendChild(el('span', 'swt', esc(text)));
  b.onclick = on;
  r.appendChild(b);
  if (onClear) { const x = el('button', 'swx', '−'); x.title = 'Reset to ByLayer'; x.onclick = onClear; r.appendChild(x); }

}

/* ============================================================
   The Command panel
   ------------------------------------------------------------
   Revit shows you what you are ABOUT to draw the instant a tool

   first click rather than by drawing something and correcting it.
   Split the way Revit splits it: "Active style" is the type — the
   thing shared by every wall of that type — and "Active

   ============================================================ */
function cmdTitle(k) {
  return ({ wall: 'Wall', wallrect: 'Room of walls', door: 'Door', window: 'Window',
    column: 'Column', stair: 'Stair', room: 'Room', grid: 'Grid line',
    line: 'Line', pline: 'Polyline', rect: 'Rectangle', circle: 'Circle', arc: 'Arc',
    ellipse: 'Ellipse', polygon: 'Polygon', spline: 'Spline', text: 'Text',
    mtext: 'Paragraph text', dim: 'Dimension', hatch: 'Hatch', leader: 'Leader',
    point: 'Point', revcloud: 'Revision cloud', xline: 'Construction line', ray: 'Ray',
    donut: 'Donut' }[k]) || (k ? k.charAt(0).toUpperCase() + k.slice(1) : 'Command');
}
const ALIGN_OPTS = [
  ['inner', 'Inner face — the line you draw is the inside of the wall', 'alignIn'],
  ['centre', 'Centreline — the line you draw is the middle of the wall', 'alignMid'],
  ['outer', 'Outer face — the line you draw is the outside of the wall', 'alignOut'],

  wall(w, c) {
    const wt = wallType((c && c.wt) || ARCH.wt) || {};
    styleHead(w, 'Wall', [
      ['eyedrop', 'Copy the settings off an existing wall', () => matchStyleFrom('wall', c)],
      ['plus', 'Save these settings as a new wall type', () => saveWallType(c)],
    ]);
    selRow(w, 'Type', (DOC.wallTypes || []).map(t => [t.id, t.name]), (c && c.wt) || ARCH.wt, v => {
      /* picking a type adopts that type's thickness, so the override goes */
      ARCH.wt = v; ARCH.wallTh = null;
      if (c) { c.wt = v; c.th = null; }
      buildProps(); draw();
    });
    addRow(w, 'Thickness', (c && c.th) || ARCH.wallTh || wt.t || 100, v => {
      const t = Math.max(v, 1);
      ARCH.wallTh = t;
      if (c) c.th = t;
      buildProps(); draw();
    });
    grpRow(w, 'Active properties');
    segRow(w, 'Alignment', ALIGN_OPTS, (c && c.jmode) || ARCH.jmode || 'centre', v => {
      ARCH.jmode = v;
      if (c) { c.jmode = v; if (typeof wallRejustify === 'function') wallRejustify(c); }
      buildProps(); draw();
    });
    addRow(w, 'Height', ARCH.wallH, v => { ARCH.wallH = Math.max(v, 1); buildProps(); draw(); });
  },
  door(w, c) { openingCmdProps(w, c, 'door'); },
  window(w, c) { openingCmdProps(w, c, 'window'); },
  column(w, c) {
    styleHead(w, 'Column', []);
    addRow(w, (c && c.shape) === 'round' ? 'Diameter' : 'Width', (c && c.w) || ARCH.colW || 400,
      v => { if (c) c.w = Math.max(v, 1); ARCH.colW = Math.max(v, 1); buildProps(); draw(); });
    if (!c || c.shape !== 'round')
      addRow(w, 'Depth', (c && c.d) || ARCH.colD || 400,
        v => { if (c) c.d = Math.max(v, 1); ARCH.colD = Math.max(v, 1); buildProps(); draw(); });
    grpRow(w, 'Active properties');
    segRow(w, 'Shape', [['rect', 'Rectangular', 'colRect'], ['round', 'Round', 'colRound']],
      (c && c.shape) || ARCH.colShape || 'rect',
      v => { if (c) c.shape = v; ARCH.colShape = v; buildProps(); draw(); });
  },
  stair(w, c) {
    styleHead(w, 'Stair', []);
    addRow(w, 'Width', (c && c.w) || ARCH.stairW || 1000,
      v => { if (c) c.w = Math.max(v, 1); ARCH.stairW = Math.max(v, 1); buildProps(); draw(); });
    addRow(w, 'Risers', (c && c.risers) || ARCH.risers || 16,
      v => { const n = clamp(Math.round(v), 2, 80); if (c) c.risers = n; ARCH.risers = n; buildProps(); draw(); }, 1);
    grpRow(w, 'Active properties');
    selRow(w, 'Shape', [['straight', 'straight flight'], ['L', 'L with landing'], ['U', 'U with landing']],
      (c && c.kind) || ARCH.stairKind || 'straight',
      v => { if (c) c.kind = v; ARCH.stairKind = v; buildProps(); draw(); });
    if (((c && c.kind) || ARCH.stairKind || 'straight') !== 'straight')
      segRow(w, 'Turn', [[1, 'Turns left', 'turnL'], [-1, 'Turns right', 'turnR']],
        (c && c.turn) || ARCH.stairTurn || 1,
        v => { if (c) c.turn = +v; ARCH.stairTurn = +v; buildProps(); draw(); });
  },
  wallrect(w, c) { CMDPROPS.wall(w, c); },
};
function openingCmdProps(w, c, kind) {
  const lib = kind === 'door' ? (DOC.doorTypes || []) : (DOC.winTypes || []);
  const cur = (c && c.type) || (kind === 'door' ? ARCH.dt : ARCH.wtp);
  const T = (kind === 'door' ? doorType(cur) : winType(cur)) || {};
  styleHead(w, kind === 'door' ? 'Door' : 'Window', [
    ['eyedrop', 'Copy the settings off an existing one', () => matchStyleFrom(kind, c)],
  ]);
  selRow(w, 'Type', lib.map(t => [t.id, t.name]), cur, v => {
    if (c) c.type = v;
    if (kind === 'door') ARCH.dt = v; else ARCH.wtp = v;
    buildProps(); draw();
  });
  ro(w, 'Width', fmt(T.w || 900));
  ro(w, 'Height', fmt(T.h || 2100));
  if (kind === 'window') ro(w, 'Sill', fmt(T.sill || 900));
  grpRow(w, 'Active properties');
  segRow(w, 'Facing', [[0, 'Opens to this side', 'flipA'], [1, 'Opens to the other side', 'flipB']],
    (c && c.flip) ? 1 : 0, v => { if (c) c.flip = !!+v; buildProps(); draw(); });
  if (kind === 'door')
    segRow(w, 'Hinge', [[1, 'Hinge on the near jamb', 'handL'], [-1, 'Hinge on the far jamb', 'handR']],
      (c && c.hand === -1) ? -1 : 1, v => { if (c) c.hand = +v; buildProps(); draw(); });
}
/** pick an existing object and adopt its settings for the tool in hand */
function matchStyleFrom(kind, c) {
  toast('Click an existing ' + kind + ' to copy its settings');
  ST.styleTarget = { kind, c };
}
function saveWallType(c) {
  const base = wallType((c && c.wt) || ARCH.wt) || {};
  const th = (c && c.th) || base.t || 100;
  modal(`<h3>New wall type</h3>
    <div class="row"><label>Name</label><input class="f" id="wtn" value="${esc('Wall ' + Math.round(th))}"></div>
    <div class="row"><label>Thickness</label><input class="f" id="wtt" value="${dispNum(th)}"></div>`, () => {
    const t = parseLen($('#wtt').value) || th;
    const id = 'u' + Date.now().toString(36);
    (DOC.wallTypes = DOC.wallTypes || []).push({ id, name: ($('#wtn').value || 'Wall').trim(), t, fn: 'interior' });
    ARCH.wt = id; if (c) { c.wt = id; c.th = null; }
    buildProps(); draw();
  });
}
/** the pending-element panel shown while a tool is running */
function commandProps(w) {
  const c = activeCmd();
  const key = c ? c.def.key : null;
  if (!key) return false;
  const head = el('div', 'pttl');
  head.appendChild(el('b', '', esc(cmdTitle(key))));
  head.appendChild(el('i', '', 'command'));
  w.appendChild(head);

  grpRow(w, 'Command');
  selRow(w, 'Active layer', DOC.layers.map(l => [l.name, l.name]), DOC.cur, v => {
    DOC.cur = v; buildLayers(); buildProps(); draw();
  });

  const P = CMDPROPS[key];
  if (P) { grpRow(w, 'Active style'); P(w, c); }
  else {
    grpRow(w, 'Active style');
    styleHead(w, cmdTitle(key), []);
    const lay = layer(DOC.cur) || {};
    swatchRow(w, 'Stroke', lay.color, (lay.lt || 'solid') + '  ·  ' + (lay.lw || 0.25) + ' mm',
      () => pickColor(lay.color, col => { begin(); touchLayers(); lay.color = col; commit('Layer colour'); buildProps(); draw(); }));
    ro(w, 'Drawn on', DOC.cur);
  }
  if (c.def.hint) {
    const h = el('div', 'cmdhint');
    h.innerHTML = c.def.hint;
    w.appendChild(h);
  }
  return true;
}

/* ---------- properties panel ---------- */
function buildProps() {
  initShellUI();
  const w = $('#props'); if (!w) return;
  clearNode(w);
  const es = selEnts();
  /* A running tool owns the panel: it shows what is about to be drawn. */
  if (activeCmd() && !es.length) { hideQuickProps(); commandProps(w); return; }
  if (!es.length) { hideQuickProps(); return emptyProps(w); }
  const e = es[0], one = es.length === 1;

  const head = el('div', 'pttl');
  head.appendChild(el('b', '', esc(one ? niceName(e) : es.length + ' objects')));
  head.appendChild(el('i', '', one ? '#' + e.id : esc(kindSummary(es))));
  w.appendChild(head);

  const upd = () => { draw(); buildProps(); };
  const set = fn => v => { begin(); es.forEach(x => mut(x)); fn(v); commit(); upd(); };

  /* most-edited things first: the object's own parameters */
  if (one) {
    const P = PROPS[e.t];
    grpRow(w, P ? 'Parameters' : 'Geometry');
    if (P) P(w, e, set, upd); else genericProps(w, e, set);
  } else {
    totals(w, es);
  }

  /* then the shared appearance controls */
  grpRow(w, 'General');
  selRow(w, 'Layer', DOC.layers.map(l => [l.name, l.name]), e.layer,
    v => { begin(); es.forEach(x => { mut(x); x.layer = v; }); commit('Layer'); draw(); buildProps(); });
  btnRow(w, 'Colour', e.color || 'ByLayer',
    () => pickColor(e.color || entColor(e), c => { begin(); es.forEach(x => { mut(x); x.color = c; }); commit('Colour'); upd(); }, true));
  selRow(w, 'Linetype', [['', 'ByLayer'], ['solid', 'solid'], ['dashed', 'dashed'], ['hidden', 'hidden'], ['center', 'center'], ['dashdot', 'dashdot']],
    e.lt || '', v => { begin(); es.forEach(x => { mut(x); x.lt = v || null; }); commit('Linetype'); draw(); });

  if (one) showQuickProps(e); else hideQuickProps();
}
function kindSummary(es) {
  const c = {}; for (const e of es) c[e.t] = (c[e.t] || 0) + 1;
  return Object.keys(c).sort().map(k => c[k] + '×' + k).join('  ');
}
function niceName(e) {
  return ({ wall: 'Wall', door: 'Door', window: 'Window', column: 'Column', stair: 'Stair',
    room: 'Room', grid: 'Grid line', hatch: 'Hatch', insert: 'Block reference',
    pline: 'Polyline', spline: 'Spline', dim: 'Dimension', xline: 'Construction line',
    line: 'Line', circle: 'Circle', arc: 'Arc', ellipse: 'Ellipse', text: 'Text',
    point: 'Point', ray: 'Ray', leader: 'Leader' }[e.t]) || e.t;
}
/* Nothing selected: say so and stop. Drawing settings live in the bottom bar. */
function emptyProps(w) {
  w.appendChild(el('div', 'empty',
    `<b>Nothing selected</b>
     <p>Click an object to edit it. Drag left→right to take what is fully inside,
        right→left to catch anything you touch.</p>
     <div class="cl">CURRENT LAYER <i>${esc(DOC.cur)}</i></div>`));
}
function genericProps(w, e, set) {
  const L = entLength(e), A = entArea(e);
  if (L) ro(w, 'Length', fmt(L));
  if (A) ro(w, 'Area', fmtArea(A));
  if (!L && !A) ro(w, 'Type', e.t);
}
function totals(w, es) {
  grpRow(w, 'Totals');
  let L = 0, A = 0;
  const counts = {};
  for (const e of es) { L += entLength(e); A += entArea(e); counts[e.t] = (counts[e.t] || 0) + 1; }
  ro(w, 'Count', es.length);
  for (const k in counts) ro(w, '· ' + k, counts[k]);
  if (L) ro(w, 'Length', fmt(L));
  if (A) ro(w, 'Area', fmtArea(A));
}

/* ============================================================
   FLOATING QUICK PROPERTIES
   A small non-modal card beside the selected object with its two to four
   most-edited fields. Never shown while a command is running, so it can
   never collide with the dynamic-input box (.dyn).
   ============================================================ */
let QP = null, QPmuted = null;
function hideQuickProps() { if (QP) { QP.remove(); QP = null; } }
function quickFields(e) { return e && (QUICK[e.t] || QUICK._default); }
function showQuickProps(e) {
  hideQuickProps();

  if (QPmuted === e.id) return;
  const hud = $('#hud'); if (!hud) return;
  const F = quickFields(e); if (!F) return;

  const c = el('div', 'qp'); c._ent = e;
  const h = el('div', 'qph');
  h.appendChild(el('b', '', esc(niceName(e))));
  h.appendChild(el('i', '', '#' + e.id));
  const x = el('button', '', svg('close', 20));
  x.title = 'Dismiss';
  x.onclick = ev => { if (ev && ev.stopPropagation) ev.stopPropagation(); QPmuted = e.id; hideQuickProps(); };
  h.appendChild(x); c.appendChild(h);

  const body = el('div', 'qpb'); c.appendChild(body);
  const upd = () => { draw(); buildProps(); };
  const set = fn => v => { begin(); mut(e); fn(v); commit(); upd(); };
  try { F(body, e, set, upd); } catch (err) { console.error(err); }

  if (c.addEventListener)
    ['pointerdown', 'pointerup', 'pointermove', 'click', 'dblclick', 'wheel'].forEach(t =>
      c.addEventListener(t, ev => { if (ev.stopPropagation) ev.stopPropagation(); }));
  hud.appendChild(c); QP = c;

  return c;
}
function placeQuickProps(e, c) {
  if (!e || !c) return;
  let b = null;
  try { b = bboxAll([e]); } catch (err) { b = null; }
  if (!b || !isFinite(b[0])) return;
  const s = w2s([(b[0] + b[2]) / 2, (b[1] + b[3]) / 2]);
  const vw = V.w || 1200, vh = V.h || 800, cw = 198, ch = 132;
  c.style.left = clamp(s[0] + 22, 8, Math.max(8, vw - cw - 8)) + 'px';
  c.style.top = clamp(s[1] + 18, 8, Math.max(8, vh - ch - 8)) + 'px';
}
const QUICK = {
  _default(w, e, set) {
    const L = entLength(e), A = entArea(e);
    if (L) ro(w, 'Length', fmt(L));
    if (A) ro(w, 'Area', fmtArea(A));
    selRow(w, 'Layer', DOC.layers.map(l => [l.name, l.name]), e.layer,
      v => { begin(); mut(e); e.layer = v; commit('Layer'); draw(); buildProps(); });
  },
  line(w, e, set, upd) {
    addRow(w, 'Length', dist(e.a, e.b), v => {
      if (!(v > 0)) return;
      begin(); mut(e); const a = ang(e.a, e.b);
      e.b = [e.a[0] + Math.cos(a) * v, e.a[1] + Math.sin(a) * v];
      commit('Length'); upd();
    });
    addRow(w, 'Angle °', deg(ang(e.a, e.b)), v => {
      begin(); mut(e); const L = dist(e.a, e.b), a = rad(v);
      e.b = [e.a[0] + Math.cos(a) * L, e.a[1] + Math.sin(a) * L];
      commit('Angle'); upd();
    }, 1);
  },
  circle(w, e, set) {
    addRow(w, 'Radius', e.r, set(v => e.r = Math.max(v, 1e-9)));
    addRow(w, 'Diameter', e.r * 2, set(v => e.r = Math.max(v / 2, 1e-9)));
  },
  arc(w, e, set) {
    addRow(w, 'Radius', e.r, set(v => e.r = Math.max(v, 1e-9)));
    ro(w, 'Included °', deg(arcSweep(e)).toFixed(2));
  },
  ellipse(w, e, set) {
    addRow(w, 'Radius X', e.rx, set(v => e.rx = Math.max(v, 1e-9)));
    addRow(w, 'Radius Y', e.ry, set(v => e.ry = Math.max(v, 1e-9)));
  },
  pline(w, e, set, upd) {
    ro(w, 'Length', fmt(polyLen(e.pts, e.closed)));
    btnRow(w, 'Closed', e.closed ? 'yes' : 'no', () => { begin(); mut(e); e.closed = !e.closed; commit(); upd(); });

function openingProps(w, e, set, upd, kind) {
  const host = hostOf(e);
  const lib = kind === 'door' ? DOC.doorTypes : DOC.winTypes;
  const key = kind === 'door' ? 'dt' : 'wtp';
  selRow(w, 'Type', lib.map(t => [t.id, t.name]), e[key], v => {
    begin(); mut(e); e[key] = v; e.w = null; e.h = null; e.k = null;
    if (host) wallReclampOpenings(host);
    commit('Type'); upd();
  });
  addRow(w, 'Width', openW(e), set(v => { e.w = Math.max(v, 50); if (host) wallReclampOpenings(host); }));
  addRow(w, 'Height', openH(e), set(v => e.h = Math.max(v, 50)));
  if (kind === 'window') {
    const T = winType(e.wtp) || {};
    addRow(w, 'Sill height', e.sill != null ? e.sill : (T.sill || 900), set(v => e.sill = Math.max(v, 0)));
  }
  addRow(w, 'Position on wall', e.pos, set(v => {
    const L = host ? wallLen(host) : v;
    e.pos = clamp(v, openW(e) / 2, Math.max(openW(e) / 2, L - openW(e) / 2));
  }));
  if (host) {
    ro(w, 'Wall', '#' + host.id + ' · ' + fmt(wallLen(host)));
    ro(w, 'From far end', fmt(Math.max(wallLen(host) - e.pos, 0)));
    btnRow(w, '', 'Select the wall', () => { SEL.clear(); SEL.add(host.id); syncUI(); draw(); });
  } else ro(w, 'Wall', 'missing');
  if (kind === 'door') {
    selRow(w, 'Leaf', [['single', 'single'], ['double', 'double'], ['slide', 'sliding'], ['pocket', 'pocket'], ['bifold', 'bifold'], ['opening', 'opening only']],
      e.k || (doorType(e.dt) || {}).k || 'single', v => { begin(); mut(e); e.k = v; commit(); upd(); });
    addRow(w, 'Swing °', e.swing == null ? 90 : e.swing, set(v => e.swing = clamp(v, 5, 180)), 1);
    btnRow(w, 'Flip facing', e.flip ? 'other side' : 'this side',
      () => { begin(); flipFacing(e); commit('Flip facing'); upd(); });
    if (flipHandApplies(e)) btnRow(w, 'Flip hand', e.hand === -1 ? 'far jamb' : 'near jamb',
      () => { begin(); flipHand(e); commit('Flip hand'); upd(); });
    btnRow(w, 'Flip both', 'mirror the door', () => { begin(); flipBoth(e); commit('Flip'); upd(); });
  } else {
    selRow(w, 'Style', [['casement', 'casement'], ['fixed', 'fixed'], ['sliding', 'sliding'], ['bay', 'bay']],
      e.k || (winType(e.wtp) || {}).k || 'casement', v => { begin(); mut(e); e.k = v; commit(); upd(); });
  }
}
