<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orthograph — browser CAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0e1116; --bg1:#151a21; --bg2:#1c222b; --bg3:#242c37;
  --bd:#28313d; --bd2:#394453;
  --tx0:#dbe2ea; --tx1:#8d9aab; --tx2:#5c6878;
  --amber:#ffd166; --mint:#4ee6a8; --steel:#6ba8ff; --rose:#ff6b81;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --top:46px; --right:276px; --bot:60px;
  /* tool rail metrics — mirrored by RAIL_LAYOUT in 13-ui.js.
     The rail is a fixed 3-column grid and never scrolls: see railMetrics(). */
  --tool:26px; --tgap:3px; --rpad:6px; --rhead:14px; --rgap:4px;
  --rail:96px;                     /* 3*26 + 2*3 + 2*6 */
}
/* ---- light theme: the same variables, re-pointed ---- */
body.light{
  --bg0:#f7f8fa; --bg1:#ffffff; --bg2:#f0f2f6; --bg3:#e4e8ef;
  --bd:#dde1e8; --bd2:#c3c9d4;
  --tx0:#1c2430; --tx1:#5a6676; --tx2:#8a93a2;
  --amber:#b57e00; --mint:#0f9d58; --steel:#1a73e8; --rose:#d93025;
}
body.light .tool.on,body.light .mode.on,body.light .tg.on,body.light .btn.pri{color:#fff}
body.light .segb.on{background:#fff;color:var(--amber);box-shadow:0 0 0 1px var(--bd2) inset}
body.light .tip,body.light #toast{background:#1c2430;border-color:#3a4454;color:#f2f5f9}
body.light #hint,body.light .dyn input,body.light #vcube button,body.light #touchbar button{
  background:#ffffffe6;color:var(--tx0)}
body.light .snapmenu{box-shadow:0 12px 34px #0002}
body.light kbd{background:var(--bg2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--tx0);
  font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

#app{display:grid;height:100%;
  grid-template-columns:var(--rail) 1fr var(--right);
  grid-template-rows:var(--top) 1fr var(--bot);
  grid-template-areas:"top top top" "rail stage panel" "bot bot bot"}

/* ---------------- top bar ---------------- */
#topbar{grid-area:top;display:flex;align-items:center;gap:2px;padding:0 10px;
  background:var(--bg1);border-bottom:1px solid var(--bd);z-index:20}
.brand{display:flex;align-items:baseline;gap:7px;margin-right:14px;user-select:none}
.brand b{font-weight:600;letter-spacing:-.02em;font-size:14px}
.brand span{font-family:var(--mono);font-size:9px;color:var(--tx2);
  letter-spacing:.14em;text-transform:uppercase}
.tb{padding:6px 10px;border-radius:5px;color:var(--tx1);font-size:12.5px;white-space:nowrap}
.tb:hover{background:var(--bg3);color:var(--tx0)}
.tb:disabled{opacity:.3;cursor:default;background:none;color:var(--tx2)}
.tb.ico{width:30px;height:28px;padding:0;display:grid;place-items:center}
.tb.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tb.ico:disabled:hover{background:none}
.sep{width:1px;height:20px;background:var(--bd);margin:0 7px;flex:none}
.grow{flex:1}
.modes{display:flex;gap:2px;background:var(--bg2);border-radius:7px;padding:2px;margin-left:8px}
.mode{padding:5px 13px;border-radius:5px;font-size:11.5px;font-weight:500;color:var(--tx1);
  letter-spacing:.03em;white-space:nowrap}
.mode:hover{color:var(--tx0)}
.mode.on{background:var(--amber);color:#141821}
.unit{font-family:var(--mono);font-size:11px;background:var(--bg2);border:1px solid var(--bd);
  border-radius:5px;padding:5px 7px;cursor:pointer}
.unit option{background:var(--bg2)}

/* ---------------- tool rail ----------------
   A fixed multi-column grid. Every tool in the active mode is on screen at
   once — there is no scroll container here by design. */
#rail{grid-area:rail;background:var(--bg1);border-right:1px solid var(--bd);
  display:grid;grid-template-columns:repeat(3,var(--tool));
  justify-content:center;align-content:start;
  gap:var(--tgap);padding:var(--rpad) 0;overflow:hidden;z-index:15}
.rgrp{grid-column:1/-1;height:var(--rhead);margin-top:var(--rgap);
  display:flex;align-items:flex-end;
  font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx2);padding:0 2px 3px;
  border-bottom:1px solid var(--bd);user-select:none;white-space:nowrap;overflow:hidden}
.rgrp:first-child{margin-top:0}
.tool{width:var(--tool);height:var(--tool);border-radius:5px;
  display:grid;place-items:center;color:var(--tx1);position:relative}
.tool svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--bg3);color:var(--tx0)}
.tool.on{background:var(--amber);color:#141821;box-shadow:0 0 0 1px #ffd16655}
.tool[data-k]::after{content:attr(data-k);position:absolute;right:1px;bottom:0;
  font-family:var(--mono);font-size:6.5px;line-height:1;opacity:.5;letter-spacing:-.02em}
.tool.on[data-k]::after{opacity:.65}
.tip{position:fixed;background:#05070a;border:1px solid var(--bd2);border-radius:5px;
  padding:5px 9px;font-size:11.5px;pointer-events:none;opacity:0;z-index:400;
  transition:opacity .1s;white-space:nowrap;box-shadow:0 6px 18px #0009}
.tip b{font-family:var(--mono);color:var(--amber);font-weight:500;margin-left:8px}

/* ---------------- stage ---------------- */
#stage{grid-area:stage;position:relative;overflow:hidden;background:var(--bg0);
  touch-action:none;cursor:crosshair}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
.dyn{position:absolute;display:flex;gap:4px;transform:translate(14px,14px);pointer-events:auto}
.dyn input{font-family:var(--mono);font-size:11.5px;width:78px;padding:4px 6px;
  background:#0b0e13ee;border:1px solid var(--bd2);border-radius:4px;color:var(--tx0)}
.dyn input.act{border-color:var(--amber);color:var(--amber)}
.dyn label{position:absolute;top:-13px;font-family:var(--mono);font-size:8.5px;
  color:var(--tx2);letter-spacing:.1em}
#hint{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:11px;
  color:var(--tx1);background:#0b0e13cc;border:1px solid var(--bd);border-radius:5px;
  padding:5px 10px;pointer-events:none;max-width:58%}
#hint em{color:var(--amber);font-style:normal}

/* ---- navigation widget: fit + view rotation ---- */
#nav{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;
  align-items:center;gap:6px;pointer-events:auto;user-select:none}
.navbtn{width:32px;height:26px;display:grid;place-items:center;color:var(--tx1);
  background:#0b0e13cc;border:1px solid var(--bd);border-radius:5px}
.navbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{color:var(--amber);border-color:var(--bd2)}
.navbtn.off{opacity:.35}
.navbtn.off:hover{color:var(--tx1);border-color:var(--bd)}
#dialWrap{position:relative;width:60px;height:60px;border-radius:50%;
  background:#0b0e13d9;border:1px solid var(--bd);display:grid;place-items:center;
  cursor:grab;touch-action:none}
#dialWrap:hover{border-color:var(--bd2)}
#dialWrap:active{cursor:grabbing;border-color:var(--amber)}
#dial{width:56px;height:56px;overflow:visible;display:block}
#dial .ring{stroke:var(--bd2);fill:none;stroke-width:1}
#dial .tick{stroke:var(--tx2);stroke-width:1}
#dial .tick.maj{stroke:var(--tx1)}
#dial .idx{fill:var(--tx1)}
#dial .n{fill:var(--amber)}
#dial .s{fill:var(--tx2)}
#dial .bar{stroke:var(--bd2);stroke-width:1}
#dial .lbl{fill:var(--tx2);font-family:var(--mono);font-size:6px;letter-spacing:.06em}
#dialRose{transform-origin:28px 28px;transform-box:view-box}
#navAng{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--amber);
  background:#0b0e13cc;border:1px solid var(--bd);border-radius:4px;
  padding:2px 0;width:52px;text-align:center;letter-spacing:.01em}
#vlegacy{display:none}

#touchbar{position:absolute;right:12px;bottom:12px;display:none;gap:6px;z-index:30}
#touchbar.show{display:flex}
#touchbar button{font-family:var(--mono);font-size:11px;padding:9px 13px;border-radius:6px;
  background:#0b0e13ee;border:1px solid var(--bd2);color:var(--tx0)}
#touchbar button.pri{background:var(--amber);border-color:var(--amber);color:#141821}
#drop{position:absolute;inset:0;display:none;place-items:center;background:#0e1116e0;
  border:2px dashed var(--amber);z-index:50;font-family:var(--mono);
  font-size:13px;color:var(--amber);letter-spacing:.08em;text-align:center;line-height:2}
#drop.show{display:grid}

/* ---- floating quick properties ---- */
.qp{position:absolute;width:198px;pointer-events:auto;z-index:40;
  background:#0f141bf5;border:1px solid var(--bd2);border-radius:7px;
  box-shadow:0 10px 28px #000a;overflow:hidden}
.qp .qph{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 8px;
  background:var(--bg2);border-bottom:1px solid var(--bd)}
.qp .qph b{flex:1;font-size:11px;font-weight:600;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qp .qph i{font-family:var(--mono);font-size:9px;color:var(--tx2);font-style:normal}
.qp .qph button{width:16px;height:16px;display:grid;place-items:center;
  color:var(--tx2);border-radius:3px;flex:none}
.qp .qph button svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.qp .qph button:hover{color:var(--rose);background:#ffffff10}
.qp .qpb{padding:5px 0 6px}
.qp .row{padding:2px 8px;min-height:23px;gap:6px}
.qp .row label{width:60px;font-size:10px}
.qp .row .f{padding:3px 6px;font-size:11px;border-radius:3px}
.qp .row .ro{font-size:11px}

/* ---------------- right panel ---------------- */
#panel{grid-area:panel;background:var(--bg1);border-left:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;z-index:15}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tx2);border-bottom:1px solid var(--bd);flex:none}
.ph button{color:var(--tx1);font-size:15px;line-height:1;padding:0 3px}
.ph button:hover{color:var(--amber)}
#layers{overflow-y:auto;flex:none;max-height:32%}
.lay{display:flex;align-items:center;gap:7px;padding:5px 11px;font-size:12px;cursor:pointer}
.lay:hover{background:var(--bg2)}
.lay.cur{background:var(--bg3)}
.lay.cur .lname{color:var(--amber)}
.sw{width:11px;height:11px;border-radius:2px;border:1px solid #0006;flex:none}
.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay .ic{opacity:.42;width:14px;height:14px;flex:none}
.lay .ic:hover{opacity:1}
.lay .ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5}
.lay .ic.off{opacity:.85;color:var(--rose)}

#props{flex:1;overflow-y:auto;padding:0 0 14px}
.pttl{display:flex;align-items:center;gap:8px;padding:8px 11px;
  background:var(--bg2);border-bottom:1px solid var(--bd)}
.pttl b{flex:1;font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pttl i{font-family:var(--mono);font-size:9.5px;color:var(--tx2);font-style:normal}
.row{display:flex;align-items:center;gap:8px;padding:3px 11px;min-height:26px}
.row label{width:80px;font-size:11px;color:var(--tx1);flex:none;line-height:1.25}
.row .f{flex:1;font-family:var(--mono);font-size:11.5px;background:var(--bg2);
  border:1px solid var(--bd);border-radius:4px;padding:4px 7px;min-width:0}
.row .f:hover{border-color:var(--bd2)}
.row .f:focus{border-color:var(--amber)}
.row .ro{flex:1;text-align:right;color:var(--tx1);font-family:var(--mono);font-size:11.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{padding:12px 11px 4px;font-family:var(--mono);font-size:8.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);
  border-top:1px solid var(--bd);margin-top:7px}
.grp:first-child{border-top:none;margin-top:0}
.pttl + .grp{border-top:none;margin-top:0;padding-top:9px}
.empty{padding:20px 13px;color:var(--tx2);font-size:11.5px;line-height:1.65}
.empty b{display:block;color:var(--tx0);font-size:12.5px;font-weight:600;margin-bottom:5px}
.empty p{margin:0}
.empty .cl{margin-top:12px;font-family:var(--mono);font-size:10px;letter-spacing:.05em}
.empty .cl i{color:var(--amber);font-style:normal}

/* ---------------- bottom bar ---------------- */
#bot{grid-area:bot;background:var(--bg1);border-top:1px solid var(--bd);
  display:flex;flex-direction:column;z-index:20}
#cmdwrap{display:flex;align-items:center;gap:8px;padding:0 11px;height:32px;flex:none}
#caret{font-family:var(--mono);color:var(--amber);font-size:12px;flex:none}
#cmd{flex:1;font-family:var(--mono);font-size:12px;min-width:0}
#cmd::placeholder{color:var(--tx2)}
#echo{font-family:var(--mono);font-size:11px;color:var(--tx1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%;text-align:right}
#status{display:flex;align-items:center;gap:6px;padding:0 11px 4px;height:28px;flex:none;
  overflow:hidden}
#coord{font-family:var(--mono);font-size:11px;color:var(--tx1);
  min-width:168px;flex:none;letter-spacing:-.01em}
#coord b{color:var(--tx2);font-weight:400}
.tgs{display:flex;align-items:center;gap:3px;flex:none}
.tg{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;padding:3px 7px;
  border-radius:4px;border:1px solid var(--bd);color:var(--tx2);flex:none;height:21px}
.tg:hover{border-color:var(--bd2);color:var(--tx1)}
.tg.on{background:var(--amber);border-color:var(--amber);color:#141821}
#dset{display:flex;align-items:center;gap:4px;flex:none}
.ds{display:flex;align-items:center;gap:5px;height:21px;padding:0 6px;flex:none;
  background:var(--bg2);border:1px solid var(--bd);border-radius:4px;cursor:text}
.ds i{font-family:var(--mono);font-size:8.5px;font-style:normal;letter-spacing:.1em;
  color:var(--tx2);user-select:none}
.ds input{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--tx0);
  width:44px;text-align:right}
.ds:hover{border-color:var(--bd2)}
.ds:focus-within{border-color:var(--amber)}
.ds:focus-within i{color:var(--amber)}
.gear{width:24px;height:21px;flex:none;display:grid;place-items:center;color:var(--tx2);
  border:1px solid var(--bd);border-radius:4px}
.gear:hover{color:var(--amber);border-color:var(--bd2)}
.gear svg{width:13px;height:13px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dsPop{position:fixed;right:10px;bottom:calc(var(--bot) + 8px);width:242px;z-index:120;
  background:var(--bg1);border:1px solid var(--bd2);border-radius:8px;
  box-shadow:0 14px 34px #000b;padding-bottom:9px;display:none;
  max-height:60vh;overflow-y:auto}
#dsPop.show{display:block}
#dsPop .ph{position:sticky;top:0;background:var(--bg1);z-index:1}

/* ---------------- modal ---------------- */
#modal{position:fixed;inset:0;background:#060810cc;display:none;
  place-items:center;z-index:300;backdrop-filter:blur(3px)}
#modal.show{display:grid}
.card{background:var(--bg1);border:1px solid var(--bd2);border-radius:10px;
  width:min(460px,92vw);padding:20px;max-height:86vh;overflow-y:auto}
.card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.card p{color:var(--tx1);font-size:12px;line-height:1.6;margin-bottom:14px}
.card .row{padding:5px 0;min-height:0}
.card .row label{width:96px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{padding:7px 14px;border-radius:6px;background:var(--bg3);font-size:12.5px}
.btn:hover{background:var(--bd2)}
.btn.pri{background:var(--amber);color:#141821;font-weight:500}
.btn.pri:hover{filter:brightness(1.08)}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--bg2);border:1px solid var(--bd);
  border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--tx0)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;
  font-size:12px;color:var(--tx1)}
/* ---- Command panel: the style header, segmented controls, swatches ---- */
.sty{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:5px 11px 7px}
.sty b{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.styacts{display:flex;gap:2px}
.styb{width:24px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--tx1)}
.styb:hover{background:var(--bg3);color:var(--tx0)}
.styb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:2px;flex:1;background:var(--bg2);border:1px solid var(--bd);
  border-radius:6px;padding:2px;min-width:0}
.segb{flex:1;height:24px;border-radius:4px;display:grid;place-items:center;
  color:var(--tx1);font-size:11px;min-width:0}
.segb:hover{background:var(--bg3);color:var(--tx0)}
.segb.on{background:var(--bg0);color:var(--amber);box-shadow:0 1px 0 #0006 inset}
.segb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
.swrow{display:flex;align-items:center;gap:7px;text-align:left}
.swb{width:22px;height:13px;border-radius:3px;border:1px solid #0006;flex:none}
.swt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swx{width:20px;height:22px;border-radius:4px;color:var(--tx2);flex:none;font-size:14px;line-height:1}
.swx:hover{background:var(--bg3);color:var(--rose)}
.cmdhint{margin:10px 11px 4px;padding:7px 9px;border-radius:6px;background:var(--bg2);
  border:1px solid var(--bd);font-family:var(--mono);font-size:10.5px;color:var(--tx1);line-height:1.55}
.cmdhint em{color:var(--amber);font-style:normal}
.snapmenu{position:fixed;z-index:400;background:var(--bg1);border:1px solid var(--bd2);
  border-radius:8px;padding:5px;min-width:186px;box-shadow:0 12px 34px #000a}
.snapmenu .smh{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tx2);padding:5px 8px 6px}
.snapmenu .smi{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  padding:5px 8px;border-radius:5px;font-size:12px;color:var(--tx0)}
.snapmenu .smi:hover{background:var(--bg3)}
.snapmenu .smx{width:11px;color:var(--amber);font-size:11px}
.snapmenu .smsep{height:1px;background:var(--bd);margin:5px 4px}
#toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(8px);
  background:#000;border:1px solid var(--bd2);border-radius:6px;padding:8px 14px;
  font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:250}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:980px){
  :root{--right:0px;--top:42px;--tool:24px;--rail:90px}
  #panel{position:fixed;right:0;top:var(--top);bottom:var(--bot);width:250px;
    transform:translateX(100%);transition:transform .2s;border-left:1px solid var(--bd2)}
  #panel.open{transform:none}
  #app{grid-template-columns:var(--rail) 1fr;grid-template-areas:"top top" "rail stage" "bot bot"}
  .hide-sm{display:none}
  .brand span{display:none}
  .brand b{font-size:13px}

<script>
'use strict';
/* ===== 00-core.js ===== */
/* ============================================================
   ORTHOGRAPH — 00 core: math, colour, units
   ============================================================ */
const TAU = Math.PI * 2, EPS = 1e-9;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = (x, y) => Math.sqrt(x * x + y * y);
const dist = (a, b) => hyp(b[0] - a[0], b[1] - a[1]);
const dist2 = (a, b) => (b[0] - a[0]) ** 2 + (b[1] - a[1]) ** 2;
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];

const norm = a => { const l = hyp(a[0], a[1]); return l < EPS ? [0, 0] : [a[0] / l, a[1] / l]; };

const ang = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);
const rot = (p, c, t) => {

const wrap = t => { t %= TAU; return t < 0 ? t + TAU : t; };

const wrapS = t => { t = wrap(t); return t > Math.PI ? t - TAU : t; };
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const near = (a, b, e = 1e-7) => Math.abs(a - b) < e;
const clone = e => JSON.parse(JSON.stringify(e));

/* AutoCAD Color Index (256 entries, packed hex) */
const ACI_HEX = "000000ff0000ffff0000ff0000ffff0000ffff00ffffffff808080c0c0c0ff0000ff7f7fcc0000cc6666990000994c4c7f00007f3f3f4c00004c2626ff3f00ff9f7fcc3300cc7f66992600995f4c7f1f007f4f3f4c13004c2f26ff7f00ffbf7fcc6600cc9966994c0099724c7f3f007f5f3f4c26004c3926ffbf00ffdf7fcc9900ccb26699720099854c7f5f007f6f3f4c39004c4226ffff00ffff7fcccc00cccc6698980098984c7f7f007f7f3f4c4c004c4c26bfff00dfff7f99cc00b2cc6672980085984c5f7f006f7f3f394c00424c267fff00bfff7f66cc0099cc664c980072984c3f7f005f7f3f264c00394c263fff009fff7f33cc007fcc662698005f984c1f7f004f7f3f134c002f4c2600ff007fff7f00cc0066cc660098004c984c007f003f7f3f004c00264c2600ff3f7fff9f00cc3366cc7f0098264c985f007f1f3f7f4f004c13264c2f00ff7f7fffbf00cc6666cc9900984c4c9872007f3f3f7f5f004c26264c3900ffbf7fffdf00cc9966ccb20098724c9885007f5f3f7f6f004c39264c4200ffff7fffff00cccc66cccc0098984c9898007f7f3f7f7f004c4c264c4c00bfff7fdfff0099cc66b2cc0072984c8598005f7f3f6f7f00394c26424c007fff7fbfff0066cc6699cc004c984c7298003f7f3f5f7f00264c26394c003fff7f9fff0033cc667fcc0026984c5f98001f7f3f4f7f00134c262f4c0000ff7f7fff0000cc6666cc0000984c4c9800007f3f3f7f00004c26264c3f00ff9f7fff3300cc7f66cc2600985f4c981f007f4f3f7f13004c2f264c7f00ffbf7fff6600cc9966cc4c0098724c983f007f5f3f7f26004c39264cbf00ffdf7fff9900ccb266cc720098854c985f007f6f3f7f39004c42264cff00ffff7fffcc00cccc66cc980098984c987f007f7f3f7f4c004c4c264cff00bfff7fdfcc0099cc66b2980072984c857f005f7f3f6f4c00394c2642ff007fff7fbfcc0066cc669998004c984c727f003f7f3f5f4c00264c2639ff003fff7f9fcc0033cc667f980026984c5f7f001f7f3f4f4c00134c262f3333335b5b5b848484adadadd6d6d6ffffff";

}
const _aciCache = new Map();
function toAci(hex) {                      /* nearest ACI slot for export */
  if (!hex) return 7;

const rgb2int = h => { const [r, g, b] = hex2rgb(h); return (r << 16) | (g << 8) | b; };
const int2hex = n => '#' + ((n >>> 0) & 0xffffff).toString(16).padStart(6, '0');

/* ---------------- unit formatting ---------------- */
/* internal working unit is always the millimetre */
const U = { mm: 1, cm: 10, m: 1000, in: 25.4, ft: 304.8 };
function fmt(v, u) {
  u = u || DOC.units;

    const neg = v < 0;
    const inch = Math.abs(v) / 25.4; let ft = Math.floor(inch / 12);
    let rem = inch - ft * 12;
    const six = Math.round(rem * 16) / 16;
    if (six >= 12) { ft++; rem = 0; } else rem = six;
    const frac = rem - Math.floor(rem);
    let fs = '';

      let n = Math.round(frac * 16), d = 16;
      while (n % 2 === 0 && d > 1) { n /= 2; d /= 2; } fs = ' ' + n + '/' + d;

  return (+k.toFixed(dp)).toString() + (u === 'in' ? '"' : '');
}

  s = String(s).trim().replace(/,/g, '.'); if (!s) return NaN;
  /* 4'-6 1/2"  |  4' 6"  |  4' */
  let m = s.match(/^(-?[\d.]+)\s*'\s*-?\s*([\d.]+)?(?:\s+(\d+)\/(\d+))?"?$/);
  if (m) return ((+m[1]) * 12 + (+(m[2] || 0)) + (m[3] ? +m[3] / +m[4] : 0)) * 25.4;

  m = s.match(/^(-?\d+)\s+(\d+)\/(\d+)\s*"?$/);
  if (m) return ((+m[1]) + (+m[2]) / (+m[3])) * 25.4;
  m = s.match(/^(-?[\d.]+)\s*(mm|cm|m|in|ft|"|')$/i);
  if (m) { const u = { '"': 'in', "'": 'ft' }[m[2]] || m[2].toLowerCase(); return +m[1] * U[u]; }

  return isNaN(v) ? NaN : v * U[DOC.units];
}
/** Area, shown in the unit an architect actually wants: square metres for
    metric drawings and square feet for imperial, dropping to the small unit
    only when the area is genuinely small. */
function fmtArea(mm2) {
  const u = DOC.units;
  if (u === 'ft' || u === 'in') {
    const ft2 = mm2 / (304.8 * 304.8);
    if (ft2 >= 0.5 || mm2 === 0) return ft2.toFixed(2) + ' ft²';
    return (mm2 / (25.4 * 25.4)).toFixed(1) + ' in²';
  }
  const m2 = mm2 / 1e6;
  if (m2 >= 0.01 || mm2 === 0) return m2.toFixed(2) + ' m²';
  const k = U[u] * U[u];
  return (+(mm2 / k).toFixed(2)) + ' ' + u + '²';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ===== 01-doc.js ===== */
/* ============================================================
   ORTHOGRAPH — 01 document, journalled history, spatial index
   ============================================================ */

  ents: new Map(),
  cur: '0',
  units: 'mm',
  gridStep: 10,
  snapStep: 10,
  textH: 2.5,

};
const SEL = new Set();

function newLayer(name, color) {
  return { name, color: color || '#d7dee8', on: true, lock: false, lw: 0.25, lt: 'solid' };
}
function layer(n) { return DOC.layers.find(l => l.name === n) || DOC.layers[0]; }
function hasLayer(n) { return DOC.layers.some(l => l.name === n); }
function ensureLayer(n, col, lt) {

}

/* ============================================================
   spatial index — uniform hash on unbounded integer cells
   Cell size comes from a high percentile of entity extent, so a
   single far-away entity can no longer collapse the whole grid.
   Anything spanning too many cells lands in `big` and is always
   considered. Kept incrementally in sync; never silently stale.
   ============================================================ */
let IDX = null, IDXok = false;

function buildIndex() {

  const j0 = Math.floor(b[1] / c), j1 = Math.floor(b[3] / c);

  const keys = [];
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
    const k = ikey(i, j); let a = IDX.map.get(k); if (!a) IDX.map.set(k, a = []); a.push(e); keys.push(k);
  }

}

  if (!IDX || !e) return;
  const keys = IDX.cells.get(e.id);

  else for (const k of keys) {
    const a = IDX.map.get(k); if (!a) continue;

  return { p: [a[0] + d[0] * t, a[1] + d[1] * t], t, on: t >= -1e-9 && t <= 1 + 1e-9 };
}
/** intersections between two decomposed primitives (see prims() in 03-solve) */
function xPrim(A, B) {
  let ps;
  if (A.k === 'l' && B.k === 'l') ps = xLineLine(A.a, A.b, B.a, B.b, false);
  else if (A.k === 'l') ps = xLineCircle(A.a, A.b, B.c, B.r, false);
  else if (B.k === 'l') ps = xLineCircle(B.a, B.b, A.c, A.r, false);
  else ps = xCircleCircle(A.c, A.r, B.c, B.r);
  const out = [];
  for (const p of ps) {
    if (A.e && angOnArc(A.e, ang(A.c, p)) === null) continue;
    if (B.e && angOnArc(B.e, ang(B.c, p)) === null) continue;
    out.push(p);
  }
  return out;
}
/* entity kinds that take part in the pairwise intersection scan */
const X_TYPES = { line: 1, pline: 1, spline: 1, circle: 1, arc: 1, ellipse: 1, xline: 1, ray: 1 };

/* ============================================================
   the engine
   ============================================================ */
/**
 * Resolve a screen position to a world point.
 * @param sx,sy screen px
 * @param ref   the rubber-band reference point (perp/tan/polar key off it)
 * @param now   optional clock override, for tests
 */
function snapPoint(sx, sy, ref, now) {
  const raw = s2w(sx, sy);
  ST.raw = raw;
  const r = px(SNAP_R);
  const on = ST.osnapOn;
  const tracks = [];

  /* Tab cycling survives a jittery hand but not a real move */
  if (!ST.snapScr || hyp(sx - ST.snapScr[0], sy - ST.snapScr[1]) > SNAP_CYCLE_RESET) {
    ST.snapCycle = 0; ST.snapScr = [sx, sy];
  }

  /* ---- candidate collection, deduplicated on a coarse screen-pixel grid ---- */
  const cands = [];
  const cell = new Map();
  const gtol = Math.max(px(0.5), 1e-12);
  const merge2 = gtol * gtol * 4;
  /* `d` ranks the candidate; the aperture is ALWAYS judged on the true
     distance from the cursor to the point itself. Letting a caller pass the
     distance-to-entity as `d` used to admit points far outside the box — a
     tangent 126mm away would beat the perpendicular 3mm away. `allowFar` is
     the one deliberate exception: picking a big circle's centre by hovering
     its rim. */
  function push(p, k, d, priOverride, allowFar) {
    if (!p) return;
    const x = p[0], y = p[1];
    if (!isFinite(x) || !isFinite(y)) return;
    const dp = hyp(x - raw[0], y - raw[1]);
    if (d == null) d = dp;
    if (!allowFar && !(dp <= r)) return;
    if (!(d <= r)) return;
    const pri = priOverride == null ? (SNAP_PRI[k] || 1) : priOverride;
    const i0 = Math.round(x / gtol), j0 = Math.round(y / gtol);
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const c = cell.get((i0 + a) + ',' + (j0 + b));
      if (c && dist2(c.p, [x, y]) < merge2) {
        if (pri > c.pri || (pri === c.pri && d < c.d)) { c.k = k; c.d = d; c.pri = pri; c.p = [x, y]; }
        return;
      }
    }
    const c = { p: [x, y], k, d, pri };
    cell.set(i0 + ',' + j0, c);
    cands.push(c);
  }

  if (ST.osnap) {
    const hits = nearEnts(raw, r);
    const pool = hits.slice(0, SNAP_MAX_POINT);
    for (const h of pool) entSnaps(h.e, h.d, raw, ref, r, push);
    if (on.int) pairIntersections(pool, raw, r, push);
    if (on.wface && on.int) wallFaceIntersections(pool, raw, r, push);
    if (on.ext) extensionSnaps(hits, raw, r, push, tracks);
    if (on.near) nearestSnaps(hits, raw, r, push);
  }

  /* ---- deferred perpendicular ----
     The foot of a perpendicular can sit far from the geometry that carries it:
     dropping a perpendicular onto a quarter arc lands at 180 degrees, nowhere
     near the arc itself. Those entities never reach the pool above, so scan
     the carriers separately. */
  if (ST.osnap && on.perp && ref) deferredPerp(raw, ref, r, push);

  /* ---- alignment paths from acquired points ---- */
  trackSnaps(raw, r, push, tracks);

  /* ---- grid snap: above nearest, below every real object snap ---- */
  if (ST.snapgrid) {
    const step = DOC.snapStep;
    if (step > 0) push([Math.round(raw[0] / step) * step, Math.round(raw[1] / step) * step], 'grid');
  }

  /* ---- pick the winner: priority first, distance only as a tie-break ---- */
  cands.sort((a, b) => b.pri - a.pri || a.d - b.d);
  ST.snapCands = cands;
  if (ST.snapCycle >= cands.length) ST.snapCycle = 0;
  let best = cands.length ? cands[ST.snapCycle] : null;
  ST.snap = best;
  if (ST.osnap) trackDwell(best, now);

  let out = best ? best.p.slice() : raw;

  /* ---- ortho / polar constrain relative to ref ---- */
  if (ref && !best) {
    if (ST.ortho) {
      const d = sub(out, ref);
      out = Math.abs(d[0]) >= Math.abs(d[1]) ? [ref[0] + d[0], ref[1]] : [ref[0], ref[1] + d[1]];
      tracks.push([ref, out]);
    } else if (ST.polar) {
      const a = ang(ref, out), L = dist(ref, out);
      const inc = rad(ST.polarInc);
      const k = Math.round(a / inc) * inc;
      if (Math.abs(wrapS(a - k)) < rad(3.2) && L > px(6)) {
        out = [ref[0] + Math.cos(k) * L, ref[1] + Math.sin(k) * L];
        tracks.push([ref, [ref[0] + Math.cos(k) * L * 3.5, ref[1] + Math.sin(k) * L * 3.5]]);
      }
    }
  }
  ST.tracks = tracks.length ? tracks : null;
  return out;
}

/* ---------------- entity shortlist ---------------- */
/** entities whose geometry comes within reach of the cursor, closest first */
function nearEnts(raw, r) {
  const w = r * 3;
  let pool = query(raw[0] - w, raw[1] - w, raw[0] + w, raw[1] + w);
  if (pool.length > SNAP_MAX_SCAN) {
    /* the spatial index gave up (or the doc is tiny and returned everything):
       fall back to a cheap bbox pass so we never entDist thousands of objects */
    const f = [];
    for (const e of pool) {
      let b; try { b = bbox(e); } catch (err) { continue; }
      if (bboxHit(b, raw[0] - w, raw[1] - w, raw[0] + w, raw[1] + w)) f.push(e);
      if (f.length >= SNAP_MAX_SCAN) break;
    }
    pool = f;
  }
  const reach = r * 2.4, hits = [];
  for (const e of pool) {
    if (!e || e.t === 'text' || !visible(e)) continue;
    let d; try { d = entDist(raw, e); } catch (err) { continue; }
    if (!(d < reach)) continue;
    hits.push({ e, d });
  }
  hits.sort((a, b) => a.d - b.d);
  return hits;
}

/* ---------------- per-entity snap points ---------------- */
function entSnaps(e, dEnt, raw, ref, r, push) {
  const on = ST.osnapOn;
  switch (e.t) {
    case 'line': {
      if (on.end) { push(e.a, 'end'); push(e.b, 'end'); }
      if (on.mid) push(mid(e.a, e.b), 'mid');
      if (ref && on.perp) perpOnSeg(e.a, e.b, ref, raw, push);
      break;
    }
    case 'xline': case 'ray': {
      const q = xlineSeg(e);
      if (on.end && e.t === 'ray') push(e.a, 'end');
      if (ref && on.perp) perpOnSeg(q[0], q[1], ref, raw, push);
      break;
    }
    case 'pline': case 'spline': {
      const P = e.t === 'spline' ? poly(e, 48) : e.pts;
      if (on.end) for (const p of (e.t === 'spline' ? [e.pts[0], e.pts[e.pts.length - 1]] : P)) push(p, 'end');
      if (on.end && e.t === 'spline' && e.fit) for (const p of e.fit) push(p, 'end');
      const Q = e.closed ? [...P, P[0]] : P;
      for (let i = 1; i < Q.length; i++) {
        if (on.mid && e.t !== 'spline') push(mid(Q[i - 1], Q[i]), 'mid');
        if (ref && on.perp) perpOnSeg(Q[i - 1], Q[i], ref, raw, push);
      }
      break;
    }
    case 'arc': {
      if (on.end) { push(arcPt(e, 0), 'end'); push(arcPt(e, 1), 'end'); }
      if (on.mid) push(arcPt(e, .5), 'mid');
      if (on.cen) centreSnap(e, e.c, raw, dEnt, r, push);
      if (on.quad) for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        if (angOnArc(e, a) === null) continue;
        push([e.c[0] + e.r * Math.cos(a), e.c[1] + e.r * Math.sin(a)], 'quad');
      }
      if (ref) roundPerpTan(e, ref, raw, dEnt, push);
      break;
    }
    case 'circle': {
      if (on.cen) centreSnap(e, e.c, raw, dEnt, r, push);
      if (on.quad) for (let i = 0; i < 4; i++)
        push([e.c[0] + e.r * Math.cos(i * Math.PI / 2), e.c[1] + e.r * Math.sin(i * Math.PI / 2)], 'quad');
      if (ref) roundPerpTan(e, ref, raw, dEnt, push);
      break;
    }
    case 'ellipse': {
      if (on.cen) push(e.c, 'cen');
      if (on.quad) for (let i = 0; i < 4; i++) push(ellPt(e, i * Math.PI / 2), 'quad');
      break;
    }
    case 'point': {
      if (on.node) push(e.p, 'node');
      break;
    }
    case 'dim': {
      if (on.end) { push(e.p1, 'end'); push(e.p2, 'end'); if (e.p3) push(e.p3, 'end'); }
      break;
    }
    case 'hatch': {
      if (on.end) for (const L of (e.loops || [])) for (const p of L) push(p, 'end');
      break;
    }
    case 'wall': {
      wallSnaps(e, raw, ref, push);
      break;
    }
    default: {
      if (!GEOM[e.t]) break;
      for (const s of shapes(e, 24)) {
        if (s.pts) {
          if (on.end) for (const p of s.pts) push(p, 'end');
          if (on.mid && s.pts.length === 2) push(mid(s.pts[0], s.pts[1]), 'mid');
          if (ref && on.perp) for (let i = 1; i < s.pts.length; i++) perpOnSeg(s.pts[i - 1], s.pts[i], ref, raw, push);
        } else if (s.c && s.r != null) {
          if (on.cen) centreSnap({ t: 'circle', c: s.c, r: s.r }, s.c, raw, dEnt, r, push);
          if (on.quad) for (let i = 0; i < 4; i++)
            push([s.c[0] + s.r * Math.cos(i * Math.PI / 2), s.c[1] + s.r * Math.sin(i * Math.PI / 2)], 'quad');
        }
      }
    }
  }
}

/** perpendicular from ref onto one segment. Hovering the segment is enough —
    when the foot falls past the end it is a *deferred* perpendicular (perpx). */
function perpOnSeg(a, b, ref, raw, push, kOn, kOff) {
  const f = perpFoot(a, b, ref);
  if (!f) return;
  push(f.p, f.on ? (kOn || 'perp') : (kOff || 'perpx'), dist(raw, f.p));
}
/** A centre is a full-strength snap when the cursor is on it. Hovering the
    curve instead still offers it — that is how you pick the centre of a big
    circle — but at a lower rank, and never while a point that actually lies
    on the curve (quadrant, end, midpoint) is already inside the aperture. */
function centreSnap(e, c, raw, dEnt, r, push) {
  const dc = dist(raw, c);
  if (dc <= r) { push(c, 'cen', dc); return; }
  if (dEnt > r || curvePtInReach(e, raw, r)) return;
  push(c, 'cen', dEnt, SNAP_PRI.cenEdge, true);
}
/** is a point lying on this circle/arc already within the aperture? */
function curvePtInReach(e, raw, r) {
  if (e.t === 'arc' &&
    (dist(raw, arcPt(e, 0)) <= r || dist(raw, arcPt(e, 1)) <= r || dist(raw, arcPt(e, .5)) <= r)) return true;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    if (e.t === 'arc' && angOnArc(e, a) === null) continue;
    if (hyp(e.c[0] + e.r * Math.cos(a) - raw[0], e.c[1] + e.r * Math.sin(a) - raw[1]) <= r) return true;
  }
  return false;
}
/** perpendicular and tangent onto a circle or an arc */
function roundPerpTan(e, ref, raw, dEnt, push) {
  const on = ST.osnapOn;
  const D = dist(ref, e.c);
  if (on.tan && D > e.r + 1e-9) {
    const a0 = ang(e.c, ref), da = Math.acos(clamp(e.r / D, -1, 1));
    for (const s of [1, -1]) {
      const p = [e.c[0] + e.r * Math.cos(a0 + s * da), e.c[1] + e.r * Math.sin(a0 + s * da)];
      const onArc = e.t !== 'arc' || angOnArc(e, ang(e.c, p)) !== null;
      push(p, onArc ? 'tan' : 'tanx', dist(raw, p));
    }
  }
  if (on.perp && D > 1e-9) {
    const u = norm(sub(ref, e.c));
    for (const s of [1, -1]) {
      const p = [e.c[0] + u[0] * e.r * s, e.c[1] + u[1] * e.r * s];
      const onArc = e.t !== 'arc' || angOnArc(e, ang(e.c, p)) !== null;
      push(p, onArc ? 'perp' : 'perpx', dist(raw, p));
    }
  }
}

/** Perpendicular feet onto carriers whose own geometry is out of reach.
    Cheap because it only looks at entities whose infinite carrier passes
    through the aperture. */
function deferredPerp(raw, ref, r, push) {
  const box = query(raw[0] - r * 2, raw[1] - r * 2, raw[0] + r * 2, raw[1] + r * 2);
  let n = 0;
  for (const e of box) {
    if (n > SNAP_MAX_POINT) break;
    if (!visible(e)) continue;
    if (e.t === 'line') {
      const f = perpFoot(e.a, e.b, ref);
      if (f && !f.on && dist(raw, f.p) <= r) { push(f.p, 'perpx', dist(raw, f.p)); n++; }
    } else if (e.t === 'arc') {
      const D = dist(ref, e.c);
      if (D < 1e-9) continue;
      const u = norm(sub(ref, e.c));
      for (const sg of [1, -1]) {
        const p = [e.c[0] + u[0] * e.r * sg, e.c[1] + u[1] * e.r * sg];
        if (dist(raw, p) > r) continue;
        if (angOnArc(e, ang(e.c, p)) !== null) continue;   /* on the sweep: handled already */
        push(p, 'perpx', dist(raw, p)); n++;
      }
    }
  }
}

/* ---------------- walls ----------------
   wcen: the centreline — its ends, its midpoint, nearest along it.
   wface: the two mitred face lines — their ends, midpoints, nearest,
          and the corner points where faces of different walls cross. */
function wallSnaps(w, raw, ref, push) {
  const on = ST.osnapOn;
  if (wallLen(w) < EPS) return;
  if (on.wcen) {
    if (on.end) { push(w.a, 'end'); push(w.b, 'end'); }
    if (on.mid) push(mid(w.a, w.b), 'mid');
    const c = segClosest(raw, w.a, w.b);
    push(c.p, 'wcen', dist(raw, c.p));
    if (ref && on.perp) perpOnSeg(w.a, w.b, ref, raw, push);
  }
  if (!on.wface) return;
  /* the mitred face carriers are cheap; the full shape list (jambs at
     openings, breaks at T-junctions) costs a scan of every wall, so only take
     it on drawings small enough to afford it. A mitred end has no cap — the
     diagonal between the two face points is not a line anyone can see. */
  const E0 = wallEndPoints(w, 0), E1 = wallEndPoints(w, 1);
  const segs = [[E0.plus, E1.minus], [E0.minus, E1.plus]];
  if (E0.capped) segs.push([E0.plus, E0.minus]);
  if (E1.capped) segs.push([E1.plus, E1.minus]);
  for (const [a, b] of segs) {
    if (on.end) { push(a, 'end'); push(b, 'end'); }
    if (on.mid) push(mid(a, b), 'mid');
    const c = segClosest(raw, a, b);
    push(c.p, 'wface', dist(raw, c.p));
    if (ref && on.perp) perpOnSeg(a, b, ref, raw, push);
  }
  if (allWalls().length > 240) return;
  for (const s of wallShapes(w)) {
    if (!s.pts || s.pts.length < 2) continue;
    const a = s.pts[0], b = s.pts[s.pts.length - 1];
    if (on.end) { push(a, 'end'); push(b, 'end'); }
    if (on.mid) push(mid(a, b), 'mid');
    const c = segClosest(raw, a, b);
    push(c.p, 'wface', dist(raw, c.p));
  }
}
/** walls whose *body* comes near the cursor, closest first.
    A face corner sits a full thickness away from the centreline, so this
    reaches wider than the point-snap shortlist does. */
function nearWalls(raw, r, pool) {
  const all = allWalls();
  const src = all.length <= 400 ? all
    : pool.map(h => h.e).filter(e => e.t === 'wall');
  const out = [];
  for (const w of src) {
    if (wallLen(w) < EPS || !visible(w)) continue;
    const d = segDist(raw, w.a, w.b) - wallT(w) / 2;
    if (d > r * 3) continue;
    out.push({ w, d });
  }
  out.sort((a, b) => a.d - b.d);
  return out.slice(0, SNAP_MAX_WALL).map(x => x.w);
}
/** the two mitred face lines of a wall, as finite segments */
function wallFaceSegs(w) {
  const E0 = wallEndPoints(w, 0), E1 = wallEndPoints(w, 1);
  return [[E0.plus, E1.minus], [E0.minus, E1.plus]];
}
/** where the faces of two nearby walls cross — the corner points of a junction.
    Deliberately segment-to-segment, not carrier-to-carrier: at a T the stem's
    faces stop at the head, and an intersection out on the far face would be a
    point nothing is actually drawn at. */
function wallFaceIntersections(pool, raw, r, push) {
  const ws = nearWalls(raw, r, pool);
  const F = ws.map(wallFaceSegs);
  for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++) {
    if ((ws[i].lvl || 0) !== (ws[j].lvl || 0)) continue;
    for (const A of F[i]) for (const B of F[j]) {
      const X = xLineLine(A[0], A[1], B[0], B[1], false);
      if (X.length) push(X[0], 'int');
    }
  }
}

/* ---------------- pairwise intersections ----------------
   Bounded two ways: only the SNAP_MAX_X entities nearest the cursor take
   part, and each is reduced to the primitives that actually reach into the
   aperture, so a 5000-vertex polyline contributes one or two segments. */
function pairIntersections(pool, raw, r, push) {
  const P = [];
  for (const h of pool) {
    const e = h.e;
    if (!X_TYPES[e.t]) continue;
    let pr; try { pr = prims(e); } catch (err) { continue; }
    const reach = r * 2.5;
    const keep = [];
    for (const q of pr) {
      if (q.k === 'c') { if (Math.abs(dist(raw, q.c) - q.r) < reach) keep.push(q); }
      else if (segDist(raw, q.a, q.b) < reach) keep.push(q);
    }
    if (keep.length) P.push(keep);
    if (P.length >= SNAP_MAX_X) break;
  }
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++)
    for (const A of P[i]) for (const B of P[j])
      for (const p of xPrim(A, B)) push(p, 'int');
}

/* ---------------- extension ----------------
   Project past the end of a line or wall the cursor is lined up with. */
function extensionSnaps(hits, raw, r, push, tracks) {
  let n = 0;
  for (const h of hits) {
    const e = h.e;
    if (e.t !== 'line' && e.t !== 'wall') continue;
    if (++n > SNAP_MAX_X) break;
    const A = e.a, B = e.b;
    const u = norm(sub(B, A));
    if (!u[0] && !u[1]) continue;
    for (const P of [A, B]) {
      const away = dot(sub(raw, P), u) * (P === A ? -1 : 1);
      if (away < px(4)) continue;
      const t = dot(sub(raw, P), u);
      const proj = add(P, mul(u, t));
      const d = dist(raw, proj);
      if (d < r) { push(proj, 'ext', d); tracks.push([P, proj]); }
    }
  }
}

/* ---------------- nearest on curve — genuinely last resort ---------------- */
function nearestSnaps(hits, raw, r, push) {
  let n = 0;
  for (const h of hits) {
    const e = h.e;
    if (e.t === 'wall' || e.t === 'point') continue;   /* walls have their own face/centreline snaps */
    if (++n > SNAP_MAX_NEAR) break;
    let P;
    try { P = poly(e, 32); } catch (err) { continue; }
    if (!P || P.length < 2) continue;
    let bp = null, bd = Infinity;
    for (let i = 1; i < P.length; i++) {
      const c = segClosest(raw, P[i - 1], P[i]);
      const d = dist(raw, c.p);
      if (d < bd) { bd = d; bp = c.p; }
    }
    if (bp) push(bp, 'near', bd);
  }
}

/* ---------------- snap tracking ----------------
   Every acquired point radiates alignment paths at the polar increment.
   The cursor snaps onto a path, and onto the crossing of two paths. */
function trackSnaps(raw, r, push, tracks) {
  const pts = ST.trackPts;
  if (!pts || !pts.length) return;
  const inc = rad(ST.polarInc || 90) || Math.PI / 2;
  const lines = [];
  for (const tp of pts) {
    for (let a = 0; a < Math.PI - 1e-9; a += inc) {
      const u = [Math.cos(a), Math.sin(a)];
      const v = sub(raw, tp.p);
      const off = cross(u, v);                        /* signed distance to the path */
      if (Math.abs(off) > r) continue;
      const along = dot(v, u);
      const foot = [tp.p[0] + u[0] * along, tp.p[1] + u[1] * along];
      lines.push({ o: tp.p, u, foot, along });
    }
  }
  if (!lines.length) return;
  for (const L of lines) {
    push(L.foot, 'track', dist(raw, L.foot));
    const ext = Math.max(Math.abs(L.along) * 1.15, r * 6);
    tracks.push([L.o, [L.o[0] + L.u[0] * ext * Math.sign(L.along || 1), L.o[1] + L.u[1] * ext * Math.sign(L.along || 1)]]);
  }
  for (let i = 0; i < lines.length; i++) for (let j = i + 1; j < lines.length; j++) {
    const A = lines[i], B = lines[j];
    if (Math.abs(cross(A.u, B.u)) < 1e-9) continue;
    const X = xLineLine(A.o, add(A.o, A.u), B.o, add(B.o, B.u), true);
    if (X.length) push(X[0], 'trackx');
  }
}

/* ---------------- picking ---------------- */
/* pick topmost entity near a world point */
function pickAt(p, radius, filter) {
  /* The drawn pick box has to be the aperture that actually picks, otherwise
     the setting is decoration. Explicit radii still matter (a wall wants more
     reach than a line), so they scale with the box rather than ignoring it. */
  const r = px((radius || 8) * ((+ST.pickBox || 8) / 8));
  const cands = query(p[0] - r, p[1] - r, p[0] + r, p[1] + r).filter(pickable);
  let best = null, bd = r;
  for (const e of cands) {
    if (filter && !filter(e)) continue;
    const d = entDist(p, e);
    if (d <= bd) { bd = d; best = e; }
  }
  return best;
}
function pickGrip(p) {
  const r = px(7 * ((+ST.pickBox || 8) / 8));
  for (const id of SEL) {
    const e = DOC.ents.get(id); if (!e) continue;
    for (const g of gripsOf(e)) if (dist(p, g.p) < r) return { id, k: g.k, p: g.p.slice() };
  }
  return null;
}

/* ---------------- lifecycle hooks ----------------
   Acquired points are transient: Escape and the end of a command drop them,
   exactly as AutoCAD does. endCmd lives in 07-cmd, so wrap it rather than
   reaching across module boundaries. */
if (typeof endCmd === 'function' && !endCmd.__snapTracked) {
  const _endCmd = endCmd;
  const wrapped = function () { clearTracks(); return _endCmd.apply(this, arguments); };
  wrapped.__snapTracked = true;
  try { endCmd = wrapped; } catch (err) { /* frozen binding: tracking simply persists */ }
}
if (typeof window !== 'undefined' && window.addEventListener)
  window.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') clearTracks();
    else if (ev.key === 'Tab' && ST.snapCands && ST.snapCands.length > 1) {
      ev.preventDefault();
      cycleSnap(ev.shiftKey ? -1 : 1);
      if (ST.snap) { ST.cur = ST.snap.p.slice(); if (typeof draw === 'function') draw(); }
    }
  });

/* ===== 07-cmd.js ===== */
/* ============================================================
   ORTHOGRAPH — 07 command engine + drawing commands
   ============================================================ */
let CMD = null;
const CMDS = {};
/** menu grouping: 'draw' | 'modify' | 'annotate' | 'inquiry' | 'arch' */
function defc(key, o) { CMDS[key] = Object.assign({ key, group: 'draw' }, o); }

function parseCoord(s, ref, cursor) {
  s = s.trim().replace(/\s+/g, '');
  if (!s) return null;
  let rel = false;
  if (s[0] === '@') { rel = true; s = s.slice(1); }
  let m = s.match(/^(.+?)<(-?[\d.]+)$/);            /* polar  d<angle */
  if (m) {
    const d = parseLen(m[1]), a = rad(parseFloat(m[2]));
    if (isNaN(d)) return null;
    const base = rel ? (ref || [0, 0]) : [0, 0];
    return [base[0] + d * Math.cos(a), base[1] + d * Math.sin(a)];
  }
  m = s.match(/^(.+?),(.+)$/);                      /* x,y */
  if (m) {
    const x = parseLen(m[1]), y = parseLen(m[2]);
    if (isNaN(x) || isNaN(y)) return null;
    const base = rel ? (ref || [0, 0]) : [0, 0];
    return [base[0] + x, base[1] + y];
  }
  const d = parseLen(s);                            /* plain distance along cursor direction */
  if (!isNaN(d) && ref && cursor) {
    const u = norm(sub(cursor, ref));
    if (hyp(u[0], u[1]) < .5) return null;
    return [ref[0] + u[0] * d, ref[1] + u[1] * d];
  }
  return null;
}

function startCmd(key, arg) {
  endCmd(true);
  const def = CMDS[key];
  if (!def) { echo('Unknown command: ' + key); return; }
  const c = { def, pts: [], step: 0, data: {}, arg };
  CMD = c;
  ST.lastCmd = key;                                /* Space repeats this */
  ST.tool = key; ST.drawing = true; ST.preview = null;
  if (def.needSel && !SEL.size) { c.phase = 'sel'; hint(def.selHint || 'Select objects, then press <em>Enter</em>'); }
  else { c.phase = 'run'; if (def.init) def.init(c); if (def.hint && !c.done) hint(def.hint); }
  syncTools();
  /* the panel shows what is about to be drawn, so it has to follow the tool */
  if (typeof buildProps === 'function') buildProps();
  draw();
}
function endCmd(silent) {
  if (typeof dynKill === 'function') dynKill();
  if (CMD && CMD.def.done) { try { CMD.def.done(CMD); } catch (e) { console.error(e); } }
  const had = !!CMD;
  CMD = null; ST.drawing = false; ST.preview = null; ST.tool = 'select'; ST.tracks = null;
  if (!silent) { hint(''); syncTools(); draw(); }
  if (had && typeof buildProps === 'function') buildProps();
}
function cmdPoint(p) {
  const c = CMD; if (!c) return;
  if (c.phase === 'sel') return;
  try { c.def.point(c, p); } catch (e) { console.error(e); echo('That did not work'); }
  ST.lastPt = p;
  draw();
}
function cmdPreview(p) {
  const c = CMD; if (!c || c.phase === 'sel') return;
  if (c.def.preview) { try { ST.preview = c.def.preview(c, p) || null; } catch (e) { ST.preview = null; } }
}
function cmdText(s) {
  const c = CMD; if (!c) return false;
  if (c.phase === 'sel') {
    if (!s) { c.phase = 'run'; if (c.def.init) c.def.init(c); if (c.def.hint) hint(c.def.hint); return true; }
    return false;
  }
  /* an option the command understood may have changed what is about to be
     drawn — J flips the alignment, T swaps the type — so refresh the panel */
  if (c.def.text && c.def.text(c, s)) {
    if (typeof buildProps === 'function') buildProps();
    return true;
  }
  const ref = c.pts.length ? c.pts[c.pts.length - 1] : null;
  const p = parseCoord(s, ref, ST.cur);
  if (p) { cmdPoint(p); return true; }
  return false;
}
function cmdEnter() {
  const c = CMD; if (!c) return;
  if (c.phase === 'sel') {
    c.phase = 'run';
    if (c.def.init) c.def.init(c);
    if (c.def.hint) hint(c.def.hint);
    if (typeof buildProps === 'function') buildProps();
    draw(); return;
  }
  if (c.def.enter) c.def.enter(c); else endCmd();
}
/** helper: a preview entity carrying the current layer */
const pv = o => Object.assign({ layer: DOC.cur }, o);

/* =============== DRAW =============== */
defc('line', {
  hint: 'First point', group: 'draw', init: c => c.pts = [],
  point(c, p) {
    c.pts.push(p);
    if (c.pts.length >= 2) {
      begin(); addEnt({ t: 'line', a: c.pts[c.pts.length - 2], b: p }); commit('Line');
      hint('Next point · <em>C</em> close · <em>U</em> undo · <em>Enter</em> end');
    } else hint('Next point');
  },
  text(c, s) {
    if (/^c$/i.test(s) && c.pts.length > 2) {
      begin(); addEnt({ t: 'line', a: c.pts[c.pts.length - 1], b: c.pts[0] }); commit('Line'); endCmd(); return true;
    }
    if (/^u$/i.test(s) && c.pts.length > 1) { undo(); c.pts.pop(); return true; }
    return false;
  },
  preview: (c, p) => c.pts.length ? [pv({ t: 'line', a: c.pts[c.pts.length - 1], b: p })] : null,
  enter: () => endCmd(),
});

defc('pline', {
  hint: 'First point', group: 'draw', init: c => c.pts = [],
  point(c, p) { c.pts.push(p); hint('Next point · <em>C</em> close · <em>U</em> undo · <em>Enter</em> end'); },
  text(c, s) {
    if (/^c$/i.test(s) && c.pts.length > 2) { c.data.close = true; this.enter(c); return true; }
    if (/^u$/i.test(s) && c.pts.length) { c.pts.pop(); return true; }
    return false;
  },
  preview(c, p) { return c.pts.length ? [pv({ t: 'pline', pts: [...c.pts, p] })] : null; },
  enter(c) {
    if (c.pts.length > 1) { begin(); addEnt({ t: 'pline', pts: c.pts, closed: !!c.data.close }); commit('Polyline'); }
    endCmd();
  },
});

defc('spline', {
  hint: 'First fit point · <em>Enter</em> to finish', group: 'draw', init: c => c.pts = [],
  point(c, p) { c.pts.push(p); hint('Next fit point · <em>C</em> close · <em>Enter</em> end'); },
  text(c, s) {
    if (/^c$/i.test(s) && c.pts.length > 2) { c.data.close = true; this.enter(c); return true; }
    if (/^u$/i.test(s) && c.pts.length) { c.pts.pop(); return true; }
    return false;
  },
  preview(c, p) {
    if (c.pts.length < 1) return null;
    const f = [...c.pts, p];
    return [pv({ t: 'spline', pts: f.length > 2 ? fitSpline(f, false) : f, fit: f })];
  },
  enter(c) {
    if (c.pts.length > 1) {
      begin();
      addEnt({ t: 'spline', pts: c.pts.length > 2 ? fitSpline(c.pts, !!c.data.close) : c.pts, fit: c.pts, closed: !!c.data.close, deg: 3 });
      commit('Spline');
    }
    endCmd();
  },
});

defc('rect', {
  hint: 'First corner', group: 'draw', init: c => c.pts = [],
  text(c, s) {
    if (c.pts.length === 1) {
      const m = s.match(/^(.+?)[x,](.+)$/i);
      if (m) {
        const w = parseLen(m[1]), h = parseLen(m[2]);
        if (!isNaN(w) && !isNaN(h)) {
          const a = c.pts[0], b = [a[0] + w, a[1] + h];
          begin(); addEnt(rectEnt(a, b, c.data)); commit('Rectangle');
          c.pts = []; hint('First corner'); return true;
        }
      }
    }
    const m2 = s.match(/^f\s*([\d.]+)?$/i);         /* fillet radius */
    if (m2) { c.data.fillet = parseLen(m2[1] || '0') || 0; echo('Fillet ' + fmt(c.data.fillet)); return true; }
    const m3 = s.match(/^c\s*([\d.]+)?$/i);         /* chamfer */
    if (m3) { c.data.cham = parseLen(m3[1] || '0') || 0; echo('Chamfer ' + fmt(c.data.cham)); return true; }
    return false;
  },
  point(c, p) {
    c.pts.push(p);
    if (c.pts.length === 2) {
      begin(); addEnt(rectEnt(c.pts[0], p, c.data)); commit('Rectangle');
      c.pts = []; hint('First corner');
    } else hint('Opposite corner · type <em>W,H</em> · <em>F</em> fillet · <em>C</em> chamfer');
  },
  preview(c, p) { return c.pts.length === 1 ? [pv(rectEnt(c.pts[0], p, c.data))] : null; },
});
function rectEnt(a, b, o) {
  o = o || {};
  const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]);
  const y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
  const r = Math.min(Math.max(o.fillet || o.cham || 0, 0), (x1 - x0) / 2, (y1 - y0) / 2);
  if (r <= 1e-9) return { t: 'pline', pts: [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], closed: true };
  if (o.cham) {
    return { t: 'pline', closed: true, pts: [
      [x0 + r, y0], [x1 - r, y0], [x1, y0 + r], [x1, y1 - r],
      [x1 - r, y1], [x0 + r, y1], [x0, y1 - r], [x0, y0 + r]] };
  }
  const pts = [[x0 + r, y0], [x1 - r, y0]];
  const corners = [
    [[x1 - r, y0 + r], -Math.PI / 2, 0], [[x1 - r, y1 - r], 0, Math.PI / 2],
    [[x0 + r, y1 - r], Math.PI / 2, Math.PI], [[x0 + r, y0 + r], Math.PI, Math.PI * 1.5],
  ];
  const straights = [[x1, y1 - r], [x0 + r, y1], [x0, y0 + r], null];
  for (let i = 0; i < 4; i++) {
    pts.push(...arcPts({ c: corners[i][0], r, a0: corners[i][1], a1: corners[i][2] }, 12).slice(1, -1));
    if (straights[i]) pts.push(polarPt(corners[i][0], r, corners[i][2]), straights[i]);
    else pts.push(polarPt(corners[i][0], r, corners[i][2]));
  }
  return { t: 'pline', pts, closed: true };
}
defc('circle', {
  hint: 'Centre · <em>2P</em> · <em>3P</em> · <em>T</em> tan-tan-radius', group: 'draw',
  init: c => { c.pts = []; c.mode = 'cr'; c.data = {}; },
  text(c, s) {
    if (/^2p?$/i.test(s)) { c.mode = '2p'; c.pts = []; hint('First point on diameter'); return true; }
    if (/^3p?$/i.test(s)) { c.mode = '3p'; c.pts = []; hint('First point'); return true; }
    if (/^t(tr)?$/i.test(s)) { c.mode = 'ttr'; c.pts = []; c.ents = []; hint('First tangent object'); return true; }
    if (/^d$/i.test(s)) { c.data.dia = true; echo('Diameter mode'); return true; }
    if (c.mode === 'ttr' && c.ents && c.ents.length === 2) {
      const r = parseLen(s);
      if (!isNaN(r) && r > 0) { ttrCircle(c, r); return true; }
    }
    if (c.mode === 'cr' && c.pts.length === 1) {
      const d = parseLen(s);
      if (!isNaN(d) && d > 0) {
        begin(); addEnt({ t: 'circle', c: c.pts[0], r: c.data.dia ? d / 2 : d }); commit('Circle');
        c.pts = []; c.data.dia = false; hint('Centre'); return true;
      }
    }
    return false;
  },
  point(c, p) {
    if (c.mode === 'ttr') {
      const e = pickAt(p, 10, x => x.t === 'line' || x.t === 'circle' || x.t === 'arc');
      if (!e) return echo('Pick a line, circle or arc');
      c.ents = c.ents || []; c.ents.push(e); c.tp = c.tp || []; c.tp.push(p);
      SEL.add(e.id);
      hint(c.ents.length === 1 ? 'Second tangent object' : 'Type the radius');
      return;
    }
    c.pts.push(p);
    if (c.mode === 'cr' && c.pts.length === 2) { begin(); addEnt({ t: 'circle', c: c.pts[0], r: dist(c.pts[0], p) }); commit('Circle'); c.pts = []; }
    else if (c.mode === '2p' && c.pts.length === 2) { begin(); addEnt({ t: 'circle', c: mid(c.pts[0], p), r: dist(c.pts[0], p) / 2 }); commit('Circle'); c.pts = []; }
    else if (c.mode === '3p' && c.pts.length === 3) {
      const cc = circum(c.pts[0], c.pts[1], c.pts[2]);
      if (cc) { begin(); addEnt({ t: 'circle', c: cc.c, r: cc.r }); commit('Circle'); } else echo('Those points are collinear');
      c.pts = [];
    } else hint(c.mode === 'cr' ? 'Radius — click or type a value' : 'Next point');
  },
  preview(c, p) {
    if (c.mode === 'cr' && c.pts.length === 1) return [pv({ t: 'circle', c: c.pts[0], r: dist(c.pts[0], p) }), pv({ t: 'line', a: c.pts[0], b: p, lt: 'dashed' })];
    if (c.mode === '2p' && c.pts.length === 1) return [pv({ t: 'circle', c: mid(c.pts[0], p), r: dist(c.pts[0], p) / 2 })];
    if (c.mode === '3p' && c.pts.length === 2) { const cc = circum(c.pts[0], c.pts[1], p); return cc ? [pv({ t: 'circle', c: cc.c, r: cc.r })] : null; }
    return null;
  },
  done() { SEL.clear(); },
});
function ttrCircle(c, r) {
  const [e1, e2] = c.ents, [p1, p2] = c.tp;
  const f = filletCurves(e1, p1, e2, p2, r);
  if (!f) { echo('No circle of that radius touches both'); return; }
  begin(); addEnt({ t: 'circle', c: f.P, r }); commit('Circle');
  c.ents = []; c.tp = []; SEL.clear(); hint('First tangent object');
}

defc('arc', {
  hint: 'Start point · <em>C</em> centre-first · <em>S</em> start-centre-end', group: 'draw',
  init: c => { c.pts = []; c.mode = '3p'; },
  text(c, s) {
    if (/^c$/i.test(s)) { c.mode = 'cse'; c.pts = []; hint('Centre'); return true; }
    if (/^s$/i.test(s)) { c.mode = 'sce'; c.pts = []; hint('Start point'); return true; }
    return false;
  },
  point(c, p) {
    c.pts.push(p);
    if (c.mode === '3p' && c.pts.length === 3) {
      const a = arc3(c.pts[0], c.pts[1], c.pts[2]);
      if (a) { begin(); addEnt(a); commit('Arc'); } else echo('Those points are collinear');
      c.pts = []; hint('Start point');
    } else if (c.mode === 'cse' && c.pts.length === 3) {
      const [cc, s0, e0] = c.pts;
      begin(); addEnt({ t: 'arc', c: cc, r: dist(cc, s0), a0: ang(cc, s0), a1: ang(cc, e0) }); commit('Arc');
      c.pts = []; hint('Centre');
    } else if (c.mode === 'sce' && c.pts.length === 3) {
      const [s0, cc, e0] = c.pts;
      begin(); addEnt({ t: 'arc', c: cc, r: dist(cc, s0), a0: ang(cc, s0), a1: ang(cc, e0) }); commit('Arc');
      c.pts = []; hint('Start point');
    } else hint(c.mode === '3p' ? (c.pts.length === 1 ? 'Point on arc' : 'End point')
      : c.mode === 'cse' ? (c.pts.length === 1 ? 'Start point' : 'End point')
        : (c.pts.length === 1 ? 'Centre' : 'End point'));
  },
  preview(c, p) {
    if (c.mode === '3p') {
      if (c.pts.length === 1) return [pv({ t: 'line', a: c.pts[0], b: p, lt: 'dashed' })];
      if (c.pts.length === 2) { const a = arc3(c.pts[0], c.pts[1], p); return a ? [pv(a)] : null; }
    } else if (c.mode === 'cse') {
      if (c.pts.length === 1) return [pv({ t: 'circle', c: c.pts[0], r: dist(c.pts[0], p), lt: 'dashed' })];
      if (c.pts.length === 2) { const cc = c.pts[0]; return [pv({ t: 'arc', c: cc, r: dist(cc, c.pts[1]), a0: ang(cc, c.pts[1]), a1: ang(cc, p) })]; }
    } else {
      if (c.pts.length === 2) { const cc = c.pts[1]; return [pv({ t: 'arc', c: cc, r: dist(cc, c.pts[0]), a0: ang(cc, c.pts[0]), a1: ang(cc, p) })]; }
      if (c.pts.length === 1) return [pv({ t: 'line', a: c.pts[0], b: p, lt: 'dashed' })];
    }
    return null;
  },
});

defc('ellipse', {
  hint: 'Centre · <em>A</em> axis-endpoints', group: 'draw', init: c => { c.pts = []; c.mode = 'c'; },
  text(c, s) { if (/^a$/i.test(s)) { c.mode = 'a'; c.pts = []; hint('First axis endpoint'); return true; } return false; },
  point(c, p) {
    c.pts.push(p);
    const need = 3;
    if (c.pts.length === need) {
      const e = c.mode === 'a' ? ellipseFromAxis(c.pts) : ellipseFromCentre(c.pts);
      if (e) { begin(); addEnt(e); commit('Ellipse'); }
      c.pts = []; hint(c.mode === 'a' ? 'First axis endpoint' : 'Centre');
    } else hint(c.pts.length === 1 ? (c.mode === 'a' ? 'Other axis endpoint' : 'End of major axis') : 'Minor axis distance');
  },
  preview(c, p) {
    if (c.pts.length === 1) return [pv({ t: 'line', a: c.pts[0], b: p, lt: 'dashed' })];
    if (c.pts.length === 2) {
      const e = c.mode === 'a' ? ellipseFromAxis([...c.pts, p]) : ellipseFromCentre([...c.pts, p]);
      return e ? [pv(e)] : null;
    }
    return null;
  },
});
function ellipseFromCentre(p) {
  const cc = p[0], rx = dist(cc, p[1]);
  if (rx < EPS) return null;
  return { t: 'ellipse', c: cc, rx, ry: Math.max(segDist(p[2], cc, p[1]), 1e-6), rot: ang(cc, p[1]) };
}
function ellipseFromAxis(p) {
  const cc = mid(p[0], p[1]), rx = dist(p[0], p[1]) / 2;
  if (rx < EPS) return null;
  return { t: 'ellipse', c: cc, rx, ry: Math.max(segDist(p[2], p[0], p[1]), 1e-6), rot: ang(p[0], p[1]) };
}

defc('polygon', {
  hint: 'Number of sides (default 6)', group: 'draw',
  init: c => { c.pts = []; c.n = 6; c.insc = true; },
  text(c, s) {
    if (!c.pts.length) { const n = parseInt(s); if (n >= 3 && n <= 200) { c.n = n; hint('Centre · <em>I</em> inscribed · <em>C</em> circumscribed'); return true; } }
    if (/^i$/i.test(s)) { c.insc = true; echo('Inscribed'); return true; }
    if (/^c$/i.test(s)) { c.insc = false; echo('Circumscribed'); return true; }
    if (c.pts.length === 1) {
      const r = parseLen(s);
      if (!isNaN(r) && r > 0) {
        begin(); addEnt(polyGon(c.pts[0], r, c.n, 0, c.insc)); commit('Polygon'); c.pts = []; hint('Centre'); return true;
      }
    }
    return false;
  },
  point(c, p) {
    c.pts.push(p);
    if (c.pts.length === 2) {
      begin(); addEnt(polyGon(c.pts[0], dist(c.pts[0], p), c.n, ang(c.pts[0], p), c.insc)); commit('Polygon');
      c.pts = []; hint('Centre');
    } else hint('Radius');
  },
  preview(c, p) {
    return c.pts.length === 1 ? [pv(polyGon(c.pts[0], dist(c.pts[0], p), c.n, ang(c.pts[0], p), c.insc))] : null;
  },
});

defc('donut', {
  hint: 'Inside diameter', group: 'draw', init: c => { c.pts = []; c.id_ = null; c.od = null; },
  text(c, s) {
    const v = parseLen(s);
    if (isNaN(v)) return false;
    if (c.id_ === null) { c.id_ = v; hint('Outside diameter'); return true; }
    if (c.od === null) { c.od = v; hint('Centre of donut'); return true; }
    return false;
  },
  point(c, p) {
    if (c.id_ === null || c.od === null) { echo('Type the inside and outside diameters first'); return; }
    begin();
    if (c.id_ > 0) addEnt({ t: 'circle', c: p, r: c.id_ / 2 });
    addEnt({ t: 'circle', c: p, r: c.od / 2 });
    commit('Donut');
  },
  preview(c, p) {
    if (c.id_ === null || c.od === null) return null;
    const o = [pv({ t: 'circle', c: p, r: c.od / 2 })];
    if (c.id_ > 0) o.push(pv({ t: 'circle', c: p, r: c.id_ / 2 }));
    return o;
  },
});

defc('xline', {
  hint: 'Point on the construction line', group: 'draw', init: c => c.pts = [],

defc('revcloud', {
  hint: 'Drag to trace the cloud · <em>Enter</em> to close', group: 'draw',
  init: c => { c.pts = []; c.arc = DOC.revArc || 500; },
  text(c, s) { const v = parseLen(s); if (!isNaN(v) && v > 0) { c.arc = DOC.revArc = v; echo('Arc ' + fmt(v)); return true; } return false; },
  point(c, p) {
    if (!c.pts.length || dist(c.pts[c.pts.length - 1], p) > c.arc * 0.8) c.pts.push(p);
  },
  preview(c, p) {
    const pts = [...c.pts, p];
    return pts.length > 2 ? [pv({ t: 'pline', pts: revCloud(pts, c.arc, false) })] : null;
  },
  enter(c) {
    if (c.pts.length > 2) { begin(); addEnt({ t: 'pline', pts: revCloud(c.pts, c.arc, true), closed: true }); commit('Revision cloud'); }
    endCmd();
  },
});
function revCloud(pts, r, closed) {
  const out = [];
  const P = closed ? [...pts, pts[0]] : pts;
  for (let i = 1; i < P.length; i++) {
    const a = P[i - 1], b = P[i], L = dist(a, b);
    if (L < 1e-9) continue;
    const n = Math.max(1, Math.round(L / r));
    const seg = L / n, rr = seg / 2;
    const u = norm(sub(b, a)), nn = perp(u);
    for (let k = 0; k < n; k++) {
      const c0 = add(a, mul(u, seg * (k + .5)));
      const base = Math.atan2(u[1], u[0]);
      for (let s = 0; s <= 8; s++) {
        const t = Math.PI - (s / 8) * Math.PI;
        out.push([c0[0] + rr * Math.cos(base + t), c0[1] + rr * Math.sin(base + t)]);
      }
    }
  }
  return out.length > 2 ? out : pts;
}

defc('fillet', {
  group: 'modify', hint: 'Type a radius, then pick two objects · <em>P</em> polyline',
  init: c => { c.r = DOC.filletR ?? 0; c.a = null; hint('Radius ' + fmt(c.r) + ' — type a new one or pick the first object'); },
  text(c, s) {
    if (/^p$/i.test(s)) { c.polyMode = true; hint('Pick a polyline to fillet every corner'); return true; }
    const v = parseLen(s);
    if (!isNaN(v) && v >= 0) { c.r = DOC.filletR = v; hint('Pick the first object'); return true; }
    return false;

      if (!e) return echo('Pick a polyline');
      begin(); mut(e); e.pts = filletPolyline(e, c.r); commit('Fillet'); c.polyMode = false; return;
    }
    const e = pickAt(p, 10, x => x.t === 'line' || x.t === 'arc' || x.t === 'circle');
    if (!e) return echo('Fillet works on lines, arcs and circles');
    if (!c.a) { c.a = e; c.ap = p; SEL.clear(); SEL.add(e.id); hint('Pick the second object'); return; }
    if (e.id === c.a.id) return;
    const f = filletCurves(c.a, c.ap, e, p, c.r);
    if (!f) { echo('No fillet of that radius fits'); c.a = null; SEL.clear(); return; }
    begin();
    pullEnd(c.a, f.P, f.t1); pullEnd(e, f.P, f.t2);
    if (c.r > 0 && f.arc) addEnt(Object.assign(f.arc, { layer: c.a.layer, color: c.a.color, lt: c.a.lt }));
    commit('Fillet');
    c.a = null; SEL.clear(); hint('Pick the first object');
  },

function filletPolyline(e, r) {
  if (r <= 0) return e.pts;
  const P = e.pts, n = P.length, out = [];
  const last = e.closed ? n : n - 1;
  if (!e.closed) out.push(P[0]);
  for (let i = e.closed ? 0 : 1; i < (e.closed ? n : n - 1); i++) {
    const a = P[(i - 1 + n) % n], b = P[i], c = P[(i + 1) % n];
    const u1 = norm(sub(a, b)), u2 = norm(sub(c, b));
    const th = Math.acos(clamp(dot(u1, u2), -1, 1));
    if (th < 1e-4 || Math.abs(th - Math.PI) < 1e-4) { out.push(b); continue; }
    const tanL = Math.min(r / Math.tan(th / 2), dist(a, b) * .49, dist(b, c) * .49);
    const t1 = add(b, mul(u1, tanL)), t2 = add(b, mul(u2, tanL));
    const rr = tanL * Math.tan(th / 2);
    const bis = norm(add(u1, u2));
    const cc = add(b, mul(bis, rr / Math.sin(th / 2)));
    let a0 = ang(cc, t1), a1 = ang(cc, t2);
    if (wrap(a1 - a0) > Math.PI) { const k = a0; a0 = a1; a1 = k; }
    const pts = arcPts({ c: cc, r: rr, a0, a1 }, 10);
    if (dist(pts[0], t1) > dist(pts[pts.length - 1], t1)) pts.reverse();
    out.push(...pts);
  }
  if (!e.closed) out.push(P[n - 1]);
  return out;
}
defc('chamfer', {

defc('join', {

  init(c) {

    if (es.length < 2) { echo('Select two or more lines or polylines'); return endCmd(); }
    const chains = es.map(e => e.t === 'line' ? [e.a, e.b] : (e.closed ? [...e.pts, e.pts[0]] : e.pts.slice()));
