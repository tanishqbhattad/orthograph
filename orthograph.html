/* ===== 09-archcmd.js ===== */
/* ============================================================
   ORTHOGRAPH — 09 architecture commands
   ============================================================ */
const ARCH = { wt: 'brk230', dt: 'sgl900', wtp: 'w1212', just: 'center', jmode: 'centre', wallH: 3000 };

/* ---------------- wall placement ----------------
   Architects place walls by centreline, inner face or outer face. Left and
   right are what the geometry actually stores; which of them "inner" means
   depends on which way round the chain being drawn encloses its space, so the
   winding is worked out as the chain grows and the walls already placed are
   re-justified the moment the first corner tells us the answer.            */
const JUST_MODES = ['centre', 'inner', 'outer'];
const justLabel = m => m === 'centre' ? 'centreline' : m === 'inner' ? 'inner face' : 'outer face';
/** +1 anticlockwise, -1 clockwise, 0 while the chain is still a straight line */
function chainWind(pts) {
  if (!pts || pts.length < 3) return 0;
  let a = 0;
  for (let i = 0; i < pts.length; i++) a += cross(pts[i], pts[(i + 1) % pts.length]);
  if (Math.abs(a) < 1e-6) return 0;
  return a > 0 ? 1 : -1;
}
/** the stored justification for a placement mode and a chain winding.
    An anticlockwise ring encloses the space on the left of every leg. */
function justFor(mode, wind) {
  if (mode !== 'inner' && mode !== 'outer') return 'center';
  const inner = wind < 0 ? 'right' : 'left';
  return mode === 'inner' ? inner : (inner === 'left' ? 'right' : 'left');
}

/** Ortho and polar as hard constraints on the point the command accepts —
    not merely on the cursor. An object snap must never be able to slip a
    three degree wall past F8. */
function wallConstrain(ref, p) {
  if (!ref || !p) return p ? p.slice() : p;
  const d = sub(p, ref);
  if (Math.abs(d[0]) < 1e-12 && Math.abs(d[1]) < 1e-12) return p.slice();
  if (ST.ortho) {
    const q = Math.abs(d[0]) >= Math.abs(d[1]) ? [ref[0] + d[0], ref[1]] : [ref[0], ref[1] + d[1]];
    ST.tracks = [[ref, q]];
    return q;
  }
  if (ST.polar) {
    const inc = rad(ST.polarInc || 90);
    if (inc > 1e-9) {
      const a = Math.atan2(d[1], d[0]), k = Math.round(a / inc) * inc;
      if (Math.abs(wrapS(a - k)) < rad(3.2)) {
        const dir = [Math.cos(k), Math.sin(k)], L = dot(d, dir);
        if (L > EPS) { const q = add(ref, mul(dir, L)); ST.tracks = [[ref, q]]; return q; }
      }
    }
  }
  return p.slice();
}
/** unit direction from ref towards the cursor, after the same constraint */
function wallDir(ref, cur) {
  if (!ref || !cur) return null;
  const u = norm(sub(wallConstrain(ref, cur), ref));
  return (u[0] || u[1]) ? u : null;
}
function wallCmdT(c) { return (wallType(c.wt) || {}).t || 100; }
/** the point the wall command really commits to: constrained, then pulled onto
    a neighbouring node or centreline — but never at the cost of the constraint */
function wallAcceptPoint(c, p, raw) {
  const ref = c.pts.length ? c.pts[c.pts.length - 1] : null;
  const q = raw ? p.slice() : wallConstrain(ref, p);
  const s = wallCleanPoint(q, wallCmdT(c), null, ref);
  if (dist(s, q) < 1e-9) return q;
  if (!raw && ref && ST.ortho && dist(wallConstrain(ref, s), s) > 1e-6) return q;
  return s;
}
function wallHint(c) {
  const n = (wallType(c.wt) || {}).name;
  hint(`${c.pts.length ? 'Next point' : 'Wall start point'} · <em>T</em> type (${esc(n)})` +
    ` · <em>J</em> ${justLabel(c.jmode)}` +
    (c.pts.length > 1 ? ' · <em>C</em> close · <em>U</em> undo · <em>Enter</em> end' : ''));
}

defc('wall', {
  group: 'arch', hint: 'Wall start point',
  init(c) {
    c.pts = []; c.ids = []; c.wind = 0;
    c.wt = ARCH.wt; c.jmode = ARCH.jmode;
    c.th = ARCH.wallTh || null;                    /* a thickness override outlives the command */
    wallHint(c);
  },
  text(c, s) {
    if (/^t$/i.test(s)) { pickWallType(t => { c.wt = ARCH.wt = t; echo((wallType(t) || {}).name); wallHint(c); draw(); }); return true; }
    if (/^j$/i.test(s)) {
      c.jmode = ARCH.jmode = JUST_MODES[(JUST_MODES.indexOf(c.jmode) + 1) % JUST_MODES.length];
      if (c.ids && c.ids.length) { begin(); wallRejustify(c); commit('Placement'); }
      wallHint(c);
      echo('Placement: ' + justLabel(c.jmode)); draw(); return true;
    }
    if (/^c$/i.test(s) && c.pts.length > 2) {
      placeWall(c, c.pts[c.pts.length - 1], c.pts[0]); endCmd(); return true;
    }
    if (/^u$/i.test(s) && c.pts.length > 1) { undo(); c.pts.pop(); c.ids.pop(); wallRejustify(c); wallHint(c); return true; }
    const ref = c.pts.length ? c.pts[c.pts.length - 1] : null;
    /* typed coordinates are explicit and override ortho, exactly as in AutoCAD */
    if (/[@<,]/.test(s)) {
      const q = parseCoord(s, ref, ST.cur);
      if (q) { c.raw = true; cmdPoint(q); return true; }
    }
    const v = parseLen(s);                          /* a bare length runs along the lock */
    if (!isNaN(v) && v > 0 && ref) {
      const u = wallDir(ref, ST.cur);
      if (u) { c.raw = true; cmdPoint(add(ref, mul(u, v))); return true; }
    }
    return false;
  },
  point(c, p) {
    const raw = !!c.raw; c.raw = false;
    const q = wallAcceptPoint(c, p, raw);
    c.pts.push(q);
    if (c.pts.length >= 2) placeWall(c, c.pts[c.pts.length - 2], q);
    wallHint(c);
  },
  preview(c, p) {
    if (!c.pts.length) return null;
    const a = c.pts[c.pts.length - 1];
    const b = wallAcceptPoint(c, p, false);
    const wind = chainWind([...c.pts, b]) || c.wind;
    return [pv({ t: 'wall', a, b, wt: c.wt, th: c.th || null, just: justFor(c.jmode, wind),
      h: ARCH.wallH, lvl: DOC.curLevel, layer: 'A-WALL' })];
  },
  enter: () => endCmd(),
});
function placeWall(c, a, b) {
  if (dist(a, b) < 1) return null;
  begin();
  const w = addEnt({ t: 'wall', a: a.slice(), b: b.slice(), wt: c.wt, th: c.th || null,
    just: justFor(c.jmode, c.wind), h: ARCH.wallH, lvl: DOC.curLevel, layer: 'A-WALL' });
  (c.ids = c.ids || []).push(w.id);
  wallRejustify(c);
  commit('Wall');
  return w;
}
/** re-resolve inner/outer for the whole chain now that its winding is known.
    Only edits inside an open journal, so it is always undoable in one step. */
function wallRejustify(c) {
  c.wind = chainWind(c.pts);
  if (!c.ids || !c.ids.length || !JN.on) return;
  const j = justFor(c.jmode, c.wind);
  for (const id of c.ids) {
    const w = DOC.ents.get(id);
    if (w && w.t === 'wall' && w.just !== j) { mut(w); w.just = j; }
  }
}
function pickWallType(cb) {
  const list = DOC.wallTypes || [];
  modal(`<h3>Wall type</h3>
    <div class="row"><label>Type</label><select class="f" id="wt">${list.map(w =>
    `<option value="${w.id}" ${w.id === ARCH.wt ? 'selected' : ''}>${esc(w.name)} — ${fmt(w.t)}</option>`).join('')}</select></div>
    <div class="row"><label>Height</label><input class="f" id="wh" value="${+(ARCH.wallH / U[DOC.units]).toFixed(4)}"></div>
    <p style="margin-top:12px;font-size:11.5px">Add your own sizes under Architecture → Wall types.</p>`, () => {
    ARCH.wallH = parseLen($('#wh').value) || 3000;
    cb($('#wt').value);
  });
}

defc('wallrect', {
  group: 'arch', hint: 'First corner of the room',
  init: c => { c.pts = []; c.wt = ARCH.wt; c.jmode = ARCH.jmode; c.th = ARCH.wallTh || null; },
  text(c, s) {
    if (/^t$/i.test(s)) { pickWallType(t => { c.wt = ARCH.wt = t; draw(); }); return true; }
    if (/^j$/i.test(s)) {
      c.jmode = ARCH.jmode = JUST_MODES[(JUST_MODES.indexOf(c.jmode) + 1) % JUST_MODES.length];
      echo('Placement: ' + justLabel(c.jmode)); draw(); return true;
    }
    if (c.pts.length === 1) {
      const m = s.match(/^(.+?)[x,](.+)$/i);
      if (m) {
        const w = parseLen(m[1]), h = parseLen(m[2]);
        if (!isNaN(w) && !isNaN(h)) { buildWallRect(c, c.pts[0], [c.pts[0][0] + w, c.pts[0][1] + h]); endCmd(); return true; }
      }
    }
    return false;
  },
  point(c, p) {
    c.pts.push(p);
    if (c.pts.length === 2) { buildWallRect(c, c.pts[0], p); endCmd(); }
    else hint(`Opposite corner · type <em>W,H</em> · <em>T</em> wall type · <em>J</em> ${justLabel(c.jmode)}`);
  },
  preview(c, p) {
    if (c.pts.length !== 1) return null;
    return wallRectPts(c.pts[0], p).map(([a, b]) =>
      pv({ t: 'wall', a, b, wt: c.wt, th: c.th || null, just: justFor(c.jmode, 1), layer: 'A-WALL' }));
  },
});
/* corners run anticlockwise, so the enclosed side is the left of every leg */
function wallRectPts(a, b) {
  const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]);
  const y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
  const c = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  return [[c[0], c[1]], [c[1], c[2]], [c[2], c[3]], [c[3], c[0]]];
}
function buildWallRect(c, a, b) {
  const segs = wallRectPts(a, b).filter(([p, q]) => dist(p, q) > 1);
  if (!segs.length) return;
  const just = justFor(c.jmode || 'centre', 1);
  begin();
  for (const [p, q] of segs)
    addEnt({ t: 'wall', a: p, b: q, wt: c.wt, th: c.th || null, just, h: ARCH.wallH, lvl: DOC.curLevel, layer: 'A-WALL' });
  commit('Room walls');
}

/* --- openings --- */
function openingCmd(kind) {
  return {
    group: 'arch',
    hint: kind === 'door' ? 'Click on a wall to place the door' : 'Click on a wall to place the window',
    init(c) {
      c.type = kind === 'door' ? ARCH.dt : ARCH.wtp;
      const T = kind === 'door' ? doorType(c.type) : winType(c.type);
      hint(`Click on a wall · <em>T</em> type (${(T || {}).name}) · <em>F</em> flip`);
    },
    text(c, s) {
      if (/^t$/i.test(s)) { pickOpenType(kind, t => { c.type = t; if (kind === 'door') ARCH.dt = t; else ARCH.wtp = t; draw(); }); return true; }
      if (/^f$/i.test(s)) { c.flip = !c.flip; echo('Flipped'); draw(); return true; }
      if (/^h$/i.test(s)) { c.hand = c.hand === -1 ? 1 : -1; echo('Hinge swapped'); draw(); return true; }
      return false;
    },
    point(c, p) {
      const hit = pickWallAt(p, px(40));
      if (!hit) return echo('Click on a wall');
      begin();
      const e = addOpening(kind, hit.w, hit.d, c.type);
      if (kind === 'door') { mut(e); e.flip = !!c.flip; e.hand = c.hand === -1 ? -1 : 1; }
      commit(kind === 'door' ? 'Door' : 'Window');
      SEL.clear(); SEL.add(e.id); syncUI();
    },
    preview(c, p) {
      const hit = pickWallAt(p, px(40));
      if (!hit) return null;
      const wd = kind === 'door' ? (doorType(c.type) || {}).w : (winType(c.type) || {}).w;
      const L = wallLen(hit.w);
      const pos = clamp(hit.d, wd / 2, Math.max(wd / 2, L - wd / 2));
      return [kind === 'door'
        ? pv({ t: 'door', host: hit.w.id, pos, dt: c.type, flip: !!c.flip, hand: c.hand === -1 ? -1 : 1, swing: 90, layer: 'A-DOOR' })
        : pv({ t: 'window', host: hit.w.id, pos, wtp: c.type, layer: 'A-GLAZ' })];
    },
  };
}
defc('door', openingCmd('door'));
defc('window', openingCmd('window'));
function pickOpenType(kind, cb) {
  const list = kind === 'door' ? DOC.doorTypes : DOC.winTypes;
  const cur = kind === 'door' ? ARCH.dt : ARCH.wtp;
  modal(`<h3>${kind === 'door' ? 'Door' : 'Window'} type</h3>
    <div class="row"><label>Type</label><select class="f" id="ot">${list.map(w =>
    `<option value="${w.id}" ${w.id === cur ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select></div>`,
    () => cb($('#ot').value));
}

/* --- column --- */
defc('column', {
  group: 'arch', hint: 'Column position · <em>T</em> size · <em>R</em> round',
  init(c) { c.w = ARCH.colW || 400; c.d = ARCH.colD || 400; c.shape = ARCH.colShape || 'rect'; },
  text(c, s) {
    if (/^r$/i.test(s)) { c.shape = ARCH.colShape = c.shape === 'round' ? 'rect' : 'round'; echo(c.shape); return true; }
    const m = s.match(/^(?:t\s*)?(.+?)[x,](.+)$/i);
    if (m) { const w = parseLen(m[1]), d = parseLen(m[2]); if (!isNaN(w) && !isNaN(d)) { c.w = ARCH.colW = w; c.d = ARCH.colD = d; echo(fmt(w) + ' × ' + fmt(d)); return true; } }
    const v = parseLen(s);
    if (!isNaN(v) && v > 0) { c.w = c.d = ARCH.colW = ARCH.colD = v; echo(fmt(v)); return true; }
    return false;
  },
  point(c, p) {
    begin();
    addEnt({ t: 'column', p, w: c.w, d: c.d, shape: c.shape, rot: 0, lvl: DOC.curLevel, layer: 'A-COLS' });
    commit('Column');

  preview: (c, p) => [pv({ t: 'column', p, w: c.w, d: c.d, shape: c.shape, rot: 0, layer: 'A-COLS' })],
});

/* --- stair --- */
defc('stair', {
  group: 'arch', hint: 'Start of the flight · <em>W</em> width · <em>N</em> risers · <em>L</em>/<em>U</em> shape · <em>T</em> turn',
  init(c) {
    c.pts = []; c.w = ARCH.stairW || 1000; c.risers = ARCH.risers || 16;
    c.kind = ARCH.stairKind || 'straight'; c.turn = ARCH.stairTurn || 1;
    hint(`Start of the flight · ${c.kind} · <em>W</em> width · <em>N</em> risers · <em>L</em>/<em>U</em> shape · <em>T</em> turn`);
  },
  text(c, s) {
    let m = s.match(/^w\s*(.+)$/i);
    if (m) { const v = parseLen(m[1]); if (!isNaN(v) && v > 0) { c.w = ARCH.stairW = v; echo('Width ' + fmt(v)); return true; } }
    m = s.match(/^n\s*(\d+)$/i);
    if (m) { c.risers = ARCH.risers = clamp(parseInt(m[1]), 2, 60); echo(c.risers + ' risers'); return true; }
    if (/^(s|straight)$/i.test(s)) { c.kind = ARCH.stairKind = 'straight'; echo('Straight flight'); return true; }
    if (/^l$/i.test(s)) { c.kind = ARCH.stairKind = 'L'; echo('L-shaped with a landing'); return true; }
    if (/^u$/i.test(s)) { c.kind = ARCH.stairKind = 'U'; echo('U-shaped with a landing'); return true; }
    if (/^t$/i.test(s)) { c.turn = ARCH.stairTurn = (c.turn === -1 ? 1 : -1); echo('Turns ' + (c.turn === -1 ? 'right' : 'left')); draw(); return true; }
    return false;
  },
  point(c, p) {
    c.pts.push(p);
    if (c.pts.length === 2) {
      begin();
      const lv = (DOC.levels || [])[DOC.curLevel] || {};
      addEnt(stairEnt(c, c.pts[0], p, lv));
      commit('Stair'); endCmd();
    } else hint('End of the first flight · <em>T</em> flips the turn');
  },
  preview(c, p) {
    return c.pts.length === 1 ? [pv(stairEnt(c, c.pts[0], p, (DOC.levels || [])[DOC.curLevel] || {}))] : null;
  },
});
function stairEnt(c, a, b, lv) {
  return {
    t: 'stair', a, b, w: c.w, risers: c.risers, rise: (lv.h || 3000) / c.risers,
    kind: c.kind || 'straight', turn: c.turn === -1 ? -1 : 1, landing: c.w,
    dir: 1, lvl: DOC.curLevel, layer: 'A-FLOR-STRS',
  };
}

/* --- room / area --- */
defc('room', {
  group: 'arch', hint: 'Click inside an enclosed space, or pick corners then <em>Enter</em>',
  init: c => { c.pts = []; },
  point(c, p) {
    if (!c.pts.length) {
      const ring = roomTrace(p, DOC.curLevel);
      if (ring) { makeRoom(ring, p); endCmd(); return; }
      echo('That spot is not enclosed — pick corners instead, or close the walls');
    }
    c.pts.push(p);
    hint('Next corner · <em>Enter</em> to finish · <em>Esc</em> to cancel');
  },
  preview(c, p) {
    if (c.pts.length) return [pv({ t: 'pline', pts: [...c.pts, p], closed: true })];
    /* live outline of whatever encloses the cursor */
    const ring = roomTrace(p, DOC.curLevel);
    return ring ? [pv({ t: 'pline', pts: ring, closed: true })] : null;
  },
  enter(c) { if (c.pts.length > 2) makeRoom(c.pts, null); endCmd(); },
});
function makeRoom(pts, seed) {
  const uOpts = [['auto', 'follow the drawing'], ['m2', 'm²'], ['sqcm', 'cm²'], ['sqmm', 'mm²'], ['ft2', 'ft²'], ['in2', 'in²']];
  const aOpts = [['none', 'none'], ['m2', 'm²'], ['ft2', 'ft²'], ['sqcm', 'cm²'], ['in2', 'in²']];
  modal(`<h3>Room</h3>
    <div class="row"><label>Name</label><input class="f" id="rn" value="ROOM"></div>
    <div class="row"><label>Show area</label><select class="f" id="ra"><option value="1">yes</option><option value="0">no</option></select></div>
    <div class="row"><label>Area units</label><select class="f" id="ru">${uOpts.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></div>
    <div class="row"><label>Also show</label><select class="f" id="rl">${aOpts.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></div>

function nextGridLabel() {

/* WALLJOIN — pick two walls and their corner is solved, or clean a whole
   selection of near-miss corners in one go. Esc leaves nothing behind. */
defc('walljoin', {
  group: 'arch', needSel: true,
  selHint: 'Select the walls to clean up and press <em>Enter</em> — or press <em>Enter</em> now to pick two',
  init(c) {
    c.w = null;
    const ws = selEnts().filter(e => e.t === 'wall');
    if (ws.length >= 2) { cleanWallSet(ws); return endCmd(); }
    if (ws.length === 1) { c.w = ws[0]; hint('Pick the wall to join it to · <em>Esc</em> cancel'); return; }
    hint('Pick the first wall · <em>Esc</em> cancel');
  },
  point(c, p) {
    const w = pickAt(p, 14, e => e.t === 'wall');
    if (!w) return echo('Pick a wall');
    if (!c.w) {
      c.w = w; SEL.clear(); SEL.add(w.id); syncUI();
      echo('First wall — now pick the one it should meet');
      hint('Pick the wall to join it to · <em>Esc</em> cancel');
      return;
    }
    if (w.id === c.w.id) return echo('Pick a different wall');
    joinTwoWalls(c.w, w);
    endCmd();
  },
  done() { SEL.clear(); },
});
/** move the nearest end of each wall onto the true centreline intersection */
function joinTwoWalls(A, B) {
  const X = xLineLine(A.a, A.b, B.a, B.b, true);
  if (!X.length) { echo('Those two walls are parallel'); return; }
  const P = X[0];
  const reach = w => Math.max(wallLen(w) * 0.75, wallT(w) * 10);
  const ea = dist(A.a, P) <= dist(A.b, P) ? 'a' : 'b';
  const eb = dist(B.a, P) <= dist(B.b, P) ? 'a' : 'b';
  if (dist(A[ea], P) > reach(A) || dist(B[eb], P) > reach(B)) {
    echo('Those two walls do not meet anywhere near their ends'); return;
  }
  begin();
  for (const [w, e] of [[A, ea], [B, eb]]) {
    const L0 = wallLen(w);
    mut(w); w[e] = P.slice();
    if (e === 'a') wallShiftOpenings(w, wallLen(w) - L0);
    wallReclampOpenings(w);
  }
  commit('Walls joined');
}
/** pull every near-miss corner in a set onto its solved intersection */
function cleanWallSet(ws) {
  const tol = ws.reduce((m, w) => Math.max(m, wallT(w)), 100) * 1.5;
  begin();
  let n = 0;
  for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++) {
    const A = ws[i], B = ws[j];
    for (const ea of ['a', 'b']) for (const eb of ['a', 'b']) {
      const d = dist(A[ea], B[eb]);
      if (d <= 1e-9 || d > tol) continue;
      const X = xLineLine(A.a, A.b, B.a, B.b, true);
      const P = (X.length && dist(X[0], A[ea]) <= tol * 2) ? X[0] : mid(A[ea], B[eb]);
      mut(A); A[ea] = P.slice(); mut(B); B[eb] = P.slice(); n++;
    }
  }
  for (const w of ws) wallReclampOpenings(w);
  commit(n ? `Cleaned ${n} corner${n > 1 ? 's' : ''}` : 'Nothing to clean up');
}

/* WALLSPLIT — click the wall, then the split point. A click that already
   lands on a sensible spot does both in one go. */
defc('wallsplit', {
  group: 'arch', hint: 'Click the wall you want to split · <em>Esc</em> cancel',
  init(c) { c.w = null; },
  text(c, s) {
    if (!c.w) return false;
    const d = parseLen(s);                          /* type the distance from the start */
    if (isNaN(d)) return false;
    doWallSplit(c, d); return true;
  },
  point(c, p) {
    if (!c.w || !DOC.ents.get(c.w.id)) {
      const hit = pickWallAt(p, px(30));
      if (!hit) return echo('Click on a wall to split it');
      c.w = hit.w; SEL.clear(); SEL.add(hit.w.id);
      const L = wallLen(hit.w);
      if (hit.d > 10 && hit.d < L - 10) return doWallSplit(c, hit.d);
      echo('Now pick the point to split at');
      hint(`Split point along the wall (0 – ${fmt(L)}) · type a distance · <em>Esc</em> cancel`);
      return;
    }
    doWallSplit(c, dot(sub(p, c.w.a), wallU(c.w)));
  },
  preview(c, p) {
    if (!c.w || !DOC.ents.get(c.w.id)) return null;
    const u = wallU(c.w), d = clamp(dot(sub(p, c.w.a), u), 0, wallLen(c.w));
    const q = add(c.w.a, mul(u, d)), n = mul(perp(u), wallT(c.w));
    return [pv({ t: 'line', a: sub(q, n), b: add(q, n), lt: 'dashed', layer: 'A-WALL' })];
  },
  done() { SEL.clear(); },
});
function doWallSplit(c, d) {
  const w = c.w && DOC.ents.get(c.w.id);
  if (!w) { echo('That wall has gone'); return endCmd(); }
  const L = wallLen(w);
  if (!(d > 10 && d < L - 10)) return echo('Too close to the end — pick a point along the wall');
  const u = wallU(w), split = add(w.a, mul(u, d));
  begin();
  const b0 = w.b;
  mut(w); w.b = split;
  const n = addEnt({ t: 'wall', a: split, b: b0, wt: w.wt, th: w.th, just: w.just,
    hatch: w.hatch, h: w.h, lvl: w.lvl, layer: w.layer });
  /* re-home openings that now sit past the split */
  for (const o of (openingsByHost().get(w.id) || [])) {
    if (o.pos > d) { mut(o); o.host = n.id; o.pos -= d; }
  }
  commit('Wall split');
  SEL.clear(); SEL.add(n.id);
  c.w = null;
  hint('Click the wall you want to split · <em>Esc</em> cancel');
}

/* ===== 10-dxf.js ===== */
/* ============================================================
   ORTHOGRAPH — 10 DXF in and out
   Writer targets AC1015 (R2000) so ellipses, splines and real
   DIMENSION entities survive the round trip. Reader accepts
   R12 through R2018.
   ============================================================ */

/* ---------------- reader ---------------- */
function dxfScan(txt) {
  const raw = txt.split(/\r\n|\r|\n/);
  const out = [];
  for (let i = 0; i + 1 < raw.length; i++) {
    const code = parseInt(raw[i].trim(), 10);
    if (isNaN(code)) continue;
    out.push([code, raw[i + 1]]);
    i++;
  }
  return out;
}
/** collect one entity's group codes; points assembled per 10/11/12… family */
function readOne(g, i) {
  const type = g[i][1];
  const o = { type, g: Object.create(null), P: Object.create(null) };
  let j = i + 1;
  for (; j < g.length && g[j][0] !== 0; j++) {
    const c = g[j][0], v = g[j][1];
    if (c >= 10 && c <= 39) {
      const f = c % 10, ax = Math.floor(c / 10) - 1;
      const arr = o.P[f] || (o.P[f] = []);
      if (ax === 0) arr.push([parseFloat(v), 0, 0]);
      else if (arr.length) arr[arr.length - 1][ax] = parseFloat(v);
      continue;
    }
    (o.g[c] || (o.g[c] = [])).push(v);
  }
  return { o, next: j };
}
const G = (o, c, d) => (o.g[c] !== undefined ? o.g[c][0] : d);
const GN = (o, c, d) => (o.g[c] !== undefined ? parseFloat(o.g[c][0]) : d);
const GI = (o, c, d) => (o.g[c] !== undefined ? parseInt(o.g[c][0]) : d);
const GA = (o, c) => (o.g[c] || []).map(parseFloat);
const PT = (o, f, i) => (o.P[f] && o.P[f][i || 0]) ? o.P[f][i || 0].slice(0, 2) : null;

function dxfParse(txt) {
  const g = dxfScan(txt);
  const res = { layers: {}, ents: [], blocks: {}, header: {}, styles: {} };
  let i = 0;
  while (i < g.length) {
    const [c, v] = g[i];
    if (c === 0 && v === 'SECTION') {
      const name = g[i + 1] && g[i + 1][0] === 2 ? g[i + 1][1] : '';
      let j = i + 2, depth = 0;
      while (j < g.length && !(g[j][0] === 0 && g[j][1] === 'ENDSEC')) j++;
      const body = g.slice(i + 2, j);
      if (name === 'TABLES') readTables(body, res);
      else if (name === 'ENTITIES') res.ents = readEnts(body);
      else if (name === 'BLOCKS') readBlocks(body, res);
      else if (name === 'HEADER') readHeader(body, res);
      i = j + 1;
    } else i++;
  }
  return res;
}
function readHeader(b, res) {
  for (let i = 0; i < b.length; i++) if (b[i][0] === 9 && b[i + 1]) res.header[b[i][1]] = b[i + 1][1];
}
function readTables(b, res) {
  let i = 0;
  while (i < b.length) {
    if (b[i][0] === 0 && (b[i][1] === 'LAYER' || b[i][1] === 'STYLE')) {
      const { o, next } = readOne(b, i);
      if (o.type === 'LAYER') {
        res.layers[G(o, 2, '0')] = {
          name: G(o, 2, '0'), color: GI(o, 62, 7), lt: G(o, 6, 'CONTINUOUS'),
          flags: GI(o, 70, 0), lw: GI(o, 370, -1),
        };
      } else res.styles[G(o, 2, 'STANDARD')] = { h: GN(o, 40, 0) };
      i = next;
    } else i++;
  }
}
function readEnts(b) {
  const out = [];
  let i = 0;
  while (i < b.length) {
    if (b[i][0] !== 0) { i++; continue; }
    const { o, next } = readOne(b, i);
    out.push(o); i = next;
  }
  return out;
}
function readBlocks(b, res) {
  let i = 0;
  while (i < b.length) {
    if (b[i][0] === 0 && b[i][1] === 'BLOCK') {
      const { o, next } = readOne(b, i);
      const name = G(o, 2, '');
      const base = PT(o, 0) || [0, 0];
      let k = next;
      while (k < b.length && !(b[k][0] === 0 && b[k][1] === 'ENDBLK')) k++;
      res.blocks[name] = { base, body: readEnts(b.slice(next, k)) };
      i = k + 1;
    } else i++;
  }
}
function ltName(s) {
  if (!s) return null;
  s = String(s).toUpperCase();
  if (s.includes('DASHDOT')) return 'dashdot';
  if (s.includes('CENTER')) return 'center';
  if (s.includes('HIDDEN')) return 'hidden';
  if (s.includes('DASH') || s.includes('DOT')) return 'dashed';
  return null;
}
function mtextPlain(s) {
  return String(s || '')
    .replace(/\\P/g, '\n').replace(/\\~/g, ' ')
    .replace(/\\[LlOoKkXx]/g, '')
    .replace(/\\[FfHhWwQqAaCcTtp][^;\\]*;/g, '')
    .replace(/\\S([^;]*);/g, (m, a) => a.replace(/[\^#]/g, '/'))
    .replace(/[{}]/g, '')
    .replace(/\\\\/g, '\\')
    .trim();
}
function dxfToEnts(res, body, layerOverride, depth) {
  depth = depth || 0;
  const list = [];
  let pending = null;                              /* open POLYLINE collecting VERTEX */
  for (const o of body) {
    const lay = layerOverride && (G(o, 8, '0') === '0') ? layerOverride : G(o, 8, '0');
    const col = GI(o, 62, 256);
    const trueCol = o.g[420] ? int2hex(parseInt(o.g[420][0])) : null;
    const meta = {
      layer: lay,
      color: trueCol || ((col > 0 && col < 256) ? aci(col) : null),
      lt: ltName(G(o, 6, null)),
      lw: o.g[370] ? Math.max(GI(o, 370, 25), 0) / 100 : null,
    };
    let e = null;
    switch (o.type) {
      case 'LINE': { const a = PT(o, 0), b = PT(o, 1); if (a && b) e = { t: 'line', a, b }; break; }
      case 'LWPOLYLINE': {
        const pts = (o.P[0] || []).map(p => p.slice(0, 2));
        if (pts.length > 1) e = { t: 'pline', pts, closed: !!(GI(o, 70, 0) & 1) };
        break;
      }
      case 'POLYLINE':
        pending = { t: 'pline', pts: [], closed: !!(GI(o, 70, 0) & 1), ...meta };
        continue;
      case 'VERTEX': { const p = PT(o, 0); if (pending && p) pending.pts.push(p); continue; }
      case 'SEQEND':
        if (pending) { if (pending.pts.length > 1) list.push(pending); pending = null; }
        continue;
      case 'CIRCLE': { const c = PT(o, 0); if (c) e = { t: 'circle', c, r: GN(o, 40, 1) }; break; }
      case 'ARC': { const c = PT(o, 0); if (c) e = { t: 'arc', c, r: GN(o, 40, 1), a0: rad(GN(o, 50, 0)), a1: rad(GN(o, 51, 0)) }; break; }
      case 'POINT': { const p = PT(o, 0); if (p) e = { t: 'point', p }; break; }
      case 'ELLIPSE': {
        const c = PT(o, 0), maj = PT(o, 1);
        if (!c || !maj) break;
        const rx = hyp(maj[0], maj[1]);
        e = {
          t: 'ellipse', c, rx, ry: rx * GN(o, 40, 1), rot: Math.atan2(maj[1], maj[0]),
          a0: GN(o, 41, 0), a1: GN(o, 42, TAU),
        };
        break;
      }
      case 'SPLINE': {
        const cps = (o.P[0] || []).map(p => p.slice(0, 2));
        const fits = (o.P[1] || []).map(p => p.slice(0, 2));

/* ============================================================
   ORTHOGRAPH — 11 SVG, PNG and the native project file
   ============================================================ */
function exportSVG() {
  const b = bboxAll([...DOC.ents.values()].filter(visible)) || [0, 0, 100, 100];
  const pad = Math.max((b[2] - b[0]), (b[3] - b[1])) * .04 + 5;
  const x0 = b[0] - pad, y0 = b[1] - pad, w = b[2] - b[0] + pad * 2, h = b[3] - b[1] + pad * 2;
  const T2 = p => `${(+p[0].toFixed(4))},${(+(-p[1]).toFixed(4))}`;
  const out = [
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${(+x0.toFixed(3))} ${(+(-(y0 + h)).toFixed(3))} ${(+w.toFixed(3))} ${(+h.toFixed(3))}" width="${Math.round(w)}" height="${Math.round(h)}">`,
    `<rect x="${x0}" y="${-(y0 + h)}" width="${w}" height="${h}" fill="#ffffff"/>`,
  ];
  const dashMap = { dashed: '4,2.5', hidden: '2.5,1.8', center: '8,2,2,2', dashdot: '6,2,1,2' };
  const ink = c => (c.toLowerCase() === '#ffffff' || c.toLowerCase() === '#d7dee8' || c.toLowerCase() === '#e8e8e8') ? '#111111' : c;
  const strokeOf = (col, lw, lt) =>
    `stroke="${col}" stroke-width="${Math.max(lw, 0.13)}" fill="none" stroke-linecap="round" stroke-linejoin="round"` +
    (dashMap[lt] ? ` stroke-dasharray="${dashMap[lt]}"` : '');

  const emitShape = (s, col, lw, baseLt) => {
    const lt = s.lt || baseLt;
    const st = strokeOf(col, lw * (ROLE_W[s.role] || 1), lt);
    if (s.text != null) {
      out.push(`<text x="${s.p[0]}" y="${-s.p[1]}" font-family="Inter,Helvetica,sans-serif" font-size="${s.h}" fill="${col}" text-anchor="${s.anchor === 'c' ? 'middle' : s.anchor === 'r' ? 'end' : 'start'}" transform="rotate(${-deg(s.rot || 0)} ${s.p[0]} ${-s.p[1]})">${esc(s.text)}</text>`);
    } else if (s.pts) {
      if (s.pts.length < 2) return;
      out.push(`<path d="M${s.pts.map(T2).join('L')}${s.closed ? 'Z' : ''}" ${st}${s.role === 'arrowhead' ? ` fill="${col}"` : ''}/>`);
    } else if (s.r != null && s.a0 != null) {
      out.push(`<path d="M${arcPts(s, 64).map(T2).join('L')}" ${st}/>`);
    } else if (s.r != null) {
      out.push(`<circle cx="${s.c[0]}" cy="${-s.c[1]}" r="${s.r}" ${st}/>`);
    }
  };
  const ordered = [...DOC.ents.values()].filter(visible);
  ordered.sort((a, x) => ((a.t === 'hatch' || a.t === 'room') ? 0 : 1) - ((x.t === 'hatch' || x.t === 'room') ? 0 : 1));
  for (const e of ordered) {
    const col = ink(entColor(e));
    const lw = Math.max(entLw(e), 0.13);
    const lt = entLt(e);
    if (e.t === 'hatch') {
      for (const L of (e.loops || [])) {
        out.push(`<path d="M${L.map(T2).join('L')}Z" fill="${e.solid ? col + '55' : 'none'}" stroke="${col}" stroke-width="${lw}"/>`);
      }
      continue;
    }
    if (e.t === 'dim') {
      const g = dimGeom(e);
      for (const [a, bb] of g.lines) out.push(`<line x1="${a[0]}" y1="${-a[1]}" x2="${bb[0]}" y2="${-bb[1]}" ${strokeOf(col, lw, '')}/>`);
      for (const ar of g.arrows) out.push(`<path d="M${arrowPoly(ar.p, ar.a, g.S.arrow).map(T2).join('L')}Z" fill="${col}" stroke="none"/>`);
      out.push(`<text x="${g.tp[0]}" y="${-g.tp[1]}" font-family="Inter,sans-serif" font-size="${g.S.txt}" fill="${col}" text-anchor="middle" transform="rotate(${-deg(g.tr)} ${g.tp[0]} ${-g.tp[1]})">${esc(g.txt)}</text>`);
      continue;
    }
    if (e.t === 'text') { emitShape({ text: e.s, p: e.p, h: e.h, rot: e.rot, anchor: e.anchor }, col, lw, lt); continue; }
    if (e.t === 'point') {
      const r = DOC.textH * 0.4;
      out.push(`<path d="M${e.p[0] - r},${-e.p[1]}L${e.p[0] + r},${-e.p[1]}M${e.p[0]},${-e.p[1] - r}L${e.p[0]},${-e.p[1] + r}" ${strokeOf(col, lw, '')}/>`);
      continue;
    }
    for (const s of shapes(e, 96)) emitShape(s, col, lw, lt);
  }
  out.push('</svg>');
  return out.join('\n');
}

function exportPNG(maxPx) {
  const b = bboxAll([...DOC.ents.values()].filter(visible)) || [0, 0, 100, 100];
  const pad = Math.max(b[2] - b[0], b[3] - b[1]) * .05 + 4;
  const w = (b[2] - b[0] + pad * 2), h = (b[3] - b[1] + pad * 2);
  const k = clamp((maxPx || 2400) / Math.max(w, h), .001, 400);
  const c2 = document.createElement('canvas');
  c2.width = Math.round(w * k); c2.height = Math.round(h * k);
  const realCtx = ctx, old = Object.assign({}, V);
  const keep = {
    grid: ST.grid, cur: ST.cur, prev: ST.preview, snap: ST.snap, band: ST.band, hot: ST.hot,
    tracks: ST.tracks, sel: new Set(SEL),
  };
  V.z = k; V.px = -(b[0] - pad) * k; V.py = (b[3] + pad) * k;
  V.w = c2.width; V.h = c2.height; V.dpr = 1;
  ST.grid = false; ST.cur = null; ST.preview = null; ST.snap = null; ST.band = null; ST.hot = null; ST.tracks = null;
  SEL.clear();
  ctx = c2.getContext('2d');
  paint();
  ctx = realCtx;
  Object.assign(V, old);
  Object.assign(ST, { grid: keep.grid, cur: keep.cur, preview: keep.prev, snap: keep.snap, band: keep.band, hot: keep.hot, tracks: keep.tracks });
  keep.sel.forEach(i => SEL.add(i));
  draw();
  return c2;
}

function download(name, text, mime) {
  const blob = text instanceof Blob ? text : new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ===== 12-dwg.js ===== */
/* ============================================================
   ORTHOGRAPH — 12 DWG reader (R13 – R2000), experimental
   ------------------------------------------------------------
   DWG is a closed binary format. This is written from the Open
   Design Alliance's published specification. Objects are located
   independently through the object map, so a failure to decode
   one object cannot desynchronise the others — anything that
   does not decode cleanly is skipped and counted, never guessed.
   R2004 and later wrap the sections in a compressed container
   that this does not decode; those files are reported, not
   half-read.
   ============================================================ */

const DWG_SENTINEL_HDR = [0x95, 0xA0, 0x4E, 0x28, 0x99, 0x82, 0x1A, 0xE5, 0x5F, 0x1D, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF];

  bit() {

  }
  bits(n) { let v = 0; for (let i = 0; i < n; i++) v = (v << 1) | this.bit(); return v >>> 0; }

  BL() { const c = this.BB(); if (c === 0) return this.RLs(); if (c === 1) return this.bits(8); return 0; }

  DD(def) {

    if (c === 1) { for (let i = 0; i < 4; i++) t[i] = this.bits(8); }
    else if (c === 2) { for (const i of [4, 5, 0, 1, 2, 3]) t[i] = this.bits(8); }

/** Pixel height the rail needs for a mode — must stay under the stage height. */
function railMetricsFor(mode, cols, tool) {
  const L = RAIL_LAYOUT, groups = RAILS[mode || MODE] || [];
  let rows = 0, tools = 0;
  for (const g of groups) { tools += g[1].length; rows += Math.ceil(g[1].length / cols); }
  const gridRows = groups.length + rows;
  return {
    groups: groups.length, tools, rows, cols, tool,
    height: L.pad * 2 + groups.length * L.head + rows * tool
      + Math.max(gridRows - 1, 0) * L.gap + Math.max(groups.length - 1, 0) * L.groupGap,
    width: cols * tool + (cols - 1) * L.gap + L.pad * 2,
  };
}
/** Height the rail may occupy: the viewport less the top and bottom bars. */
function railAvailable() {

/** Every tool has to be visible without scrolling, so the rail fits itself to
    the window rather than assuming a tall one: widen to more columns first,
    then step the button size down. A fixed 3-column rail needed 674px and was
    silently clipping twelve tools on a 1366x768 laptop. */
function railFit(mode, avail) {
  const room = avail == null ? railAvailable() : avail;
  let best = null;
  for (const tool of [26, 24, 22, 20, 18]) {
    for (const cols of [3, 4, 5, 6]) {
      const m = railMetricsFor(mode, cols, tool);
      if (m.height <= room) return m;
      if (!best || m.height < best.height) best = m;
    }
  }

}

const tipEl = el('div', 'tip'); document.body.appendChild(tipEl);
/** Shared hover tooltip. side: 'right' (rail) or 'bottom' (top bar / nav). */
function tipOn(b, label, key, side) {
  b.onpointerenter = () => {
    const q = b.getBoundingClientRect ? b.getBoundingClientRect() : null; if (!q) return;
    tipEl.innerHTML = esc(label) + (key ? '<b>' + esc(key) + '</b>' : '');
    const vh = (typeof window !== 'undefined' && window.innerHeight) || 900;
    const vw = (typeof window !== 'undefined' && window.innerWidth) || 1400;
    if (side === 'bottom') { tipEl.style.left = Math.min(q.left, vw - 190) + 'px'; tipEl.style.top = (q.bottom + 7) + 'px'; }
    else if (side === 'left') { tipEl.style.left = Math.max(q.left - 168, 8) + 'px'; tipEl.style.top = (q.top + 4) + 'px'; }
    else { tipEl.style.left = (q.right + 8) + 'px'; tipEl.style.top = Math.min(q.top + 4, vh - 40) + 'px'; }
    tipEl.style.opacity = 1;
  };

}

function buildRail() {

  clearNode(r);
  /* fit the rail to the window so nothing is ever clipped or scrolled away */
  RAIL_FIT = railFit(MODE);
  const cols = (RAIL_FIT && RAIL_FIT.cols) || RAIL_LAYOUT.cols;
  const tool = (RAIL_FIT && RAIL_FIT.tool) || RAIL_LAYOUT.tool;
  r.style.gridTemplateColumns = 'repeat(' + cols + ',var(--tool))';
  if (r.style) {

  }
  const railW = cols * tool + (cols - 1) * RAIL_LAYOUT.gap + RAIL_LAYOUT.pad * 2;
  const root = document.documentElement;
  if (root && root.style && root.style.setProperty) root.style.setProperty('--rail', railW + 'px');
  for (const [title, tools] of (RAILS[MODE] || [])) {
    const h = el('div', 'rgrp', esc(title)); h.dataset.group = title;
    r.appendChild(h);
    for (const [k, label, key] of tools) {
      const b = el('button', 'tool', svg(k));
      b.dataset.tool = k; b.dataset.group = title; if (key) b.dataset.k = key;
      b.onclick = () => { tipEl.style.opacity = 0; k === 'select' ? endCmd() : startCmd(k); };

}

/* ---------- navigation: fit + view rotation dial ---------- */
function setViewRot(r) {
  V.rot = wrapS(r);
  if (Math.abs(V.rot) < 1e-9) V.rot = 0;
  draw(); syncNav();
}
function viewRotDeg() { const d = deg(V.rot) % 360; return d < 0 ? d + 360 : d; }
function syncNav() {
  const rose = $('#dialRose');
  if (rose) rose.style.transform = 'rotate(' + (-deg(V.rot)).toFixed(3) + 'deg)';
  const a = $('#navAng'); if (a) a.textContent = viewRotDeg().toFixed(1) + '°';
  const n = $('#vNorth'); if (n) n.classList.toggle('off', !V.rot);
}
function initDial() {
  const d = $('#dialWrap'); if (!d || !d.addEventListener) return;
  let grab = null;
  const angAt = ev => {
    const r = d.getBoundingClientRect();
    return Math.atan2(ev.clientX - (r.left + r.width / 2), -(ev.clientY - (r.top + r.height / 2)));
  };
  d.addEventListener('pointerdown', ev => {
    if (ev.preventDefault) ev.preventDefault();
    if (ev.stopPropagation) ev.stopPropagation();
    grab = { a: angAt(ev), r: V.rot };
    if (d.setPointerCapture && ev.pointerId != null) { try { d.setPointerCapture(ev.pointerId); } catch (e) { } }
  });
  d.addEventListener('pointermove', ev => {
    if (!grab) return;
    if (ev.stopPropagation) ev.stopPropagation();
    let r = grab.r - (angAt(ev) - grab.a);
    if (ev.shiftKey) r = Math.round(r / rad(15)) * rad(15);

  d.addEventListener('pointerup', up);
  d.addEventListener('pointercancel', up);
  d.addEventListener('pointerleave', up);
  d.addEventListener('dblclick', () => setViewRot(0));
}

/* ---------- properties panel ---------- */
function buildProps() {

  clearNode(w);

  if (!es.length) { hideQuickProps(); return emptyProps(w); }
  const e = es[0], one = es.length === 1;

  head.appendChild(el('i', '', one ? '#' + e.id : esc(kindSummary(es))));
  w.appendChild(head);

  const upd = () => { draw(); buildProps(); };
  const set = fn => v => { begin(); es.forEach(x => mut(x)); fn(v); commit(); upd(); };

  /* most-edited things first: the object's own parameters */
  if (one) {

    if (P) P(w, e, set, upd); else genericProps(w, e, set);

function openingProps(w, e, set, upd, kind) {
  const host = hostOf(e);
  const lib = kind === 'door' ? DOC.doorTypes : DOC.winTypes;
  const key = kind === 'door' ? 'dt' : 'wtp';
  selRow(w, 'Type', lib.map(t => [t.id, t.name]), e[key], v => {
    begin(); mut(e); e[key] = v; e.w = null; e.h = null; e.k = null;
    if (host) wallReclampOpenings(host);
    commit('Type'); upd();
  });
  addRow(w, 'Width', openW(e), set(v => { e.w = Math.max(v, 50); if (host) wallReclampOpenings(host); }));
  addRow(w, 'Height', openH(e), set(v => e.h = Math.max(v, 50)));
  if (kind === 'window') {
    const T = winType(e.wtp) || {};
    addRow(w, 'Sill height', e.sill != null ? e.sill : (T.sill || 900), set(v => e.sill = Math.max(v, 0)));
  }
  addRow(w, 'Position on wall', e.pos, set(v => {
    const L = host ? wallLen(host) : v;
    e.pos = clamp(v, openW(e) / 2, Math.max(openW(e) / 2, L - openW(e) / 2));
  }));
  if (host) {
    ro(w, 'Wall', '#' + host.id + ' · ' + fmt(wallLen(host)));
    ro(w, 'From far end', fmt(Math.max(wallLen(host) - e.pos, 0)));
    btnRow(w, '', 'Select the wall', () => { SEL.clear(); SEL.add(host.id); syncUI(); draw(); });
  } else ro(w, 'Wall', 'missing');
  if (kind === 'door') {
    selRow(w, 'Leaf', [['single', 'single'], ['double', 'double'], ['slide', 'sliding'], ['pocket', 'pocket'], ['bifold', 'bifold'], ['opening', 'opening only']],
      e.k || (doorType(e.dt) || {}).k || 'single', v => { begin(); mut(e); e.k = v; commit(); upd(); });
    addRow(w, 'Swing °', e.swing == null ? 90 : e.swing, set(v => e.swing = clamp(v, 5, 180)), 1);
    btnRow(w, 'Flip facing', e.flip ? 'other side' : 'this side',
      () => { begin(); flipFacing(e); commit('Flip facing'); upd(); });
    if (flipHandApplies(e)) btnRow(w, 'Flip hand', e.hand === -1 ? 'far jamb' : 'near jamb',
      () => { begin(); flipHand(e); commit('Flip hand'); upd(); });
    btnRow(w, 'Flip both', 'mirror the door', () => { begin(); flipBoth(e); commit('Flip'); upd(); });
  } else {
    selRow(w, 'Style', [['casement', 'casement'], ['fixed', 'fixed'], ['sliding', 'sliding'], ['bay', 'bay']],
      e.k || (winType(e.wtp) || {}).k || 'casement', v => { begin(); mut(e); e.k = v; commit(); upd(); });
  }
}

/* ---------- component library manager ---------- */
function openTypeManager() {
  const rows = (list, cols) => list.map((t, i) =>
    `<tr data-i="${i}">${cols.map(c => `<td><input class="tf" data-k="${c[0]}" value="${esc(t[c[0]] == null ? '' : (c[2] ? +(t[c[0]] / U[DOC.units]).toFixed(4) : t[c[0]]))}"></td>`).join('')}
      <td><button class="tdel" data-i="${i}">×</button></td></tr>`).join('');
  const wallCols = [['name', 'Name'], ['t', 'Thickness', 1]];
  const doorCols = [['name', 'Name'], ['w', 'Width', 1], ['h', 'Height', 1]];
  const winCols = [['name', 'Name'], ['w', 'Width', 1], ['h', 'Height', 1], ['sill', 'Sill', 1]];
  modal(`<h3>Component library</h3>
    <p>Sizes are in ${DOC.units}. These travel with the drawing.</p>
    <style>
      .tabs{display:flex;gap:4px;margin-bottom:10px}
      .tab{padding:5px 10px;border-radius:5px;background:var(--bg2);font-size:12px}
      .tab.on{background:var(--amber);color:#141821}
      table{width:100%;border-collapse:collapse;font-size:11.5px}
      td{padding:2px}
      .tf{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:4px;padding:3px 5px;font-family:var(--mono);font-size:11px}
      .tdel{color:var(--rose);padding:0 5px}
      th{text-align:left;font-size:9.5px;letter-spacing:.12em;color:var(--tx2);text-transform:uppercase;padding:4px 2px}
    </style>
    <div class="tabs"><button class="tab on" data-t="wall">Walls</button><button class="tab" data-t="door">Doors</button><button class="tab" data-t="win">Windows</button></div>
    <div id="tmbody"></div>
    <div class="acts" style="justify-content:flex-start;margin-top:10px"><button class="btn" id="tmadd">Add a row</button></div>`, () => {
    saveTypeTable();
    syncUI(); draw();
  });
  let cur = 'wall';
  const conf = {
    wall: { list: () => DOC.wallTypes, cols: wallCols, blank: () => ({ id: 'w' + Date.now().toString(36), name: 'New wall', t: 100 }) },
    door: { list: () => DOC.doorTypes, cols: doorCols, blank: () => ({ id: 'd' + Date.now().toString(36), name: 'New door', w: 900, h: 2100, k: 'single' }) },
    win: { list: () => DOC.winTypes, cols: winCols, blank: () => ({ id: 'n' + Date.now().toString(36), name: 'New window', w: 1200, h: 1200, sill: 900, k: 'casement' }) },
  };
  function render() {
    const c = conf[cur];
    clearNode($('#tmbody')).innerHTML = `<table><thead><tr>${c.cols.map(x => `<th>${x[1]}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows(c.list(), c.cols)}</tbody></table>`;
    document.querySelectorAll('.tdel').forEach(b => b.onclick = () => {
      saveTypeTable();
      const list = conf[cur].list();
      if (list.length > 1) list.splice(+b.dataset.i, 1);
      render();
    });
  }
  window.saveTypeTable = () => {
    const c = conf[cur], list = c.list();
    document.querySelectorAll('#tmbody tbody tr').forEach(tr => {
      const t = list[+tr.dataset.i]; if (!t) return;
      tr.querySelectorAll('.tf').forEach(inp => {
        const k = inp.dataset.k;
        const spec = c.cols.find(x => x[0] === k);
        if (spec && spec[2]) { const v = parseLen(inp.value); if (!isNaN(v)) t[k] = v; }
        else t[k] = inp.value;
      });
    });
  };
  const saveTypeTable2 = window.saveTypeTable;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    saveTypeTable2();
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); cur = b.dataset.t; render();
  });
  $('#tmadd').onclick = () => { saveTypeTable2(); conf[cur].list().push(conf[cur].blank()); render(); };
  render();
}

    const quad = [s2w(x0, y0), s2w(x1, y0), s2w(x1, y1), s2w(x0, y1)];
    const qx = quad.map(q => q[0]), qy = quad.map(q => q[1]);
    const qb = [Math.min(...qx), Math.min(...qy), Math.max(...qx), Math.max(...qy)];
    ST.lastBand = qb;
    if (!ev.shiftKey) SEL.clear();
    for (const e of query(qb[0], qb[1], qb[2], qb[3])) {
      if (!pickable(e)) continue;
      if (crossing ? crossQuad(e, quad) : inQuad(e, quad)) SEL.add(e.id);
    }
    ST.band = null; syncUI(); draw(); downPt = null; downScr = null;
    if (CMD && CMD.phase === 'sel') echo(SEL.size + ' selected — press Enter');
    return;
  }
  if (!moved && (!CMD || CMD.phase === 'sel')) {
    const e = pickAt(p, 9);
    if (e) { if (ev.shiftKey) { SEL.has(e.id) ? SEL.delete(e.id) : SEL.add(e.id); } else { SEL.clear(); SEL.add(e.id); } }
    else if (!ev.shiftKey) SEL.clear();
    syncUI(); draw();
  }
  downPt = null; downScr = null;
});
stage.addEventListener('pointercancel', ev => { ptrs.delete(ev.pointerId); pinch = null; ST.panning = null; });
stage.addEventListener('contextmenu', ev => {
  ev.preventDefault();
  /* AutoCAD's convention: Shift + right-click is the object snap menu */
  if (ev.shiftKey) { showSnapMenu(ev.clientX, ev.clientY); return; }
  hideSnapMenu();
  if (CMD) { if (CMD.def.enter) cmdEnter(); else endCmd(); }
});
window.addEventListener('pointerdown', ev => {
  if (SNAPMENU && !ev.target.closest('.snapmenu')) hideSnapMenu();
}, true);
stage.addEventListener('dblclick', () => {
  const p = ST.cur; if (!p) return;
  const e = pickAt(p, 9);
  if (!e) return;
  SEL.clear(); SEL.add(e.id); syncUI();
  if (e.t === 'text') {
    modal('<h3>Edit text</h3><div class="row"><label>Text</label><input class="f" id="tx" value="' + esc(e.s) + '"></div>',
      () => { begin(); mut(e); e.s = $('#tx').value; commit('Text'); draw(); buildProps(); });
  } else if (e.t === 'room') {
    modal('<h3>Room name</h3><div class="row"><label>Name</label><input class="f" id="rn" value="' + esc(e.name || '') + '"></div>',
      () => { begin(); mut(e); e.name = ($('#rn').value || '').toUpperCase(); commit('Room'); draw(); buildProps(); });
  } else if (e.t === 'door' || e.t === 'window') {
    begin(); mut(e); e.flip = !e.flip; commit('Flipped'); draw(); buildProps();
  } else if (MODE !== 'arch' && GEOM[e.t]) setMode('arch');
  draw();
});
stage.addEventListener('wheel', ev => {
  ev.preventDefault();
  const scr = localXY(ev);
  const f = Math.pow(0.9988, ev.deltaY * (ev.deltaMode === 1 ? 16 : 1));
  zoomAt(scr[0], scr[1], clamp(f, .2, 5));
  ST.cur = snapPoint(scr[0], scr[1], refPoint());
  syncCoord(); syncDyn();
}, { passive: false });

/* ============================================================
   Dynamic input
   ------------------------------------------------------------
   Always live while a command is running: absolute X/Y before the
   first point, then length and angle. Typing in a field locks it
   and the mouse drives the other one — that is the whole point of
   dynamic input, and it is what makes it feel unlocked rather than
   a box that freezes on stale numbers. Tab moves on and locks what
   you typed, Enter commits, Esc releases the locks before it ever
   cancels the command.
   ============================================================ */
let dynEl = null, dynMode = null;
const dynLock = { f1: false, f2: false };

function dynRelease() {
  dynLock.f1 = false; dynLock.f2 = false;
  if (dynEl) dynEl.querySelectorAll('input').forEach(i => i.classList.remove('act'));
}
function dynKill() { if (dynEl) { dynEl.remove(); dynEl = null; } dynMode = null; dynRelease(); }
function dynLocked() { return dynLock.f1 || dynLock.f2; }

/** the point the command should actually use, after any locked field */
function dynApply(p) {
  if (!ST.dyn || !dynEl || !p || !dynLocked()) return p;
  const ref = refPoint();
  const f1 = $('#dF1'), f2 = $('#dF2');
  if (!f1 || !f2) return p;
  if (!ref) {
    const x = dynLock.f1 ? parseLen(f1.value) : p[0];
    const y = dynLock.f2 ? parseLen(f2.value) : p[1];
    return [isNaN(x) ? p[0] : x, isNaN(y) ? p[1] : y];
  }
  let L = dynLock.f1 ? parseLen(f1.value) : dist(ref, p);
  let A = dynLock.f2 ? rad(parseFloat(f2.value)) : ang(ref, p);
  if (isNaN(L)) L = dist(ref, p);
  if (isNaN(A)) A = ang(ref, p);
  return [ref[0] + Math.cos(A) * L, ref[1] + Math.sin(A) * L];
}
function dynCommit() {
  const p = dynApply(ST.cur);
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) return;
  const ref = refPoint();
  const f1 = $('#dF1'), f2 = $('#dF2');
  let out = p;
  if (!ref) {
    const x = parseLen(f1.value), y = parseLen(f2.value);
    if (isNaN(x) && isNaN(y)) return;
    out = [isNaN(x) ? p[0] : x, isNaN(y) ? p[1] : y];
  } else {
    const L = parseLen(f1.value);
    const A = f2.value.trim() === '' ? ang(ref, ST.cur) : rad(parseFloat(f2.value));
    if (isNaN(L)) return;
    out = [ref[0] + Math.cos(isNaN(A) ? ang(ref, ST.cur) : A) * L,
      ref[1] + Math.sin(isNaN(A) ? ang(ref, ST.cur) : A) * L];
  }
  dynRelease();
  cmdPoint(out);
  cv.focus();
}
function syncDyn() {
  syncTouch();
  if (!ST.dyn || !CMD || CMD.phase !== 'run' || !ST.cur) { dynKill(); return; }
  const ref = refPoint();
  const mode = ref ? 'polar' : 'abs';
  if (dynEl && dynMode !== mode) dynKill();        /* the fields mean something else now */
  const s = w2s(ST.cur);
  if (!isFinite(s[0]) || !isFinite(s[1])) { dynKill(); return; }
  if (!dynEl) {
    dynMode = mode;
    const l1 = mode === 'abs' ? 'X' : 'LENGTH', l2 = mode === 'abs' ? 'Y' : 'ANGLE';
    dynEl = el('div', 'dyn',
      `<div style="position:relative"><label>${l1}</label><input id="dF1" autocomplete="off" spellcheck="false"></div>
       <div style="position:relative"><label>${l2}</label><input id="dF2" autocomplete="off" spellcheck="false"></div>`);
    $('#hud').appendChild(dynEl);
    const fields = [$('#dF1'), $('#dF2')];
    fields.forEach((inp, idx) => {
      const key = idx === 0 ? 'f1' : 'f2';
      inp.addEventListener('keydown', ev => {
        ev.stopPropagation();
        if (ev.key === 'Enter') { ev.preventDefault(); dynCommit(); }
        else if (ev.key === 'Tab') {
          ev.preventDefault();
          dynLock[key] = inp.value.trim() !== '';
          inp.classList.toggle('act', dynLock[key]);
          const o = fields[(idx + 1) % 2];
          o.focus(); if (o.select) o.select();
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          /* release the locks first; a second Esc cancels the command */
          if (dynLocked()) { dynRelease(); cv.focus(); }
          else { dynKill(); endCmd(); }
        }
      });
      inp.addEventListener('input', () => {
        dynLock[key] = inp.value.trim() !== '';
        inp.classList.toggle('act', dynLock[key]);
        cmdPreview(dynApply(ST.cur));
        draw();
      });
    });
  }
  dynEl.style.left = s[0] + 'px'; dynEl.style.top = s[1] + 'px';
  const f1 = $('#dF1'), f2 = $('#dF2');
  const live1 = mode === 'abs' ? fmt(ST.cur[0]) : fmt(dist(ref, ST.cur));
  const live2 = mode === 'abs' ? fmt(ST.cur[1]) : deg(ang(ref, ST.cur)).toFixed(1);
  if (document.activeElement !== f1 && !dynLock.f1) f1.value = live1;
  if (document.activeElement !== f2 && !dynLock.f2) f2.value = live2;
}
/** hand focus to the dynamic input so a typed digit starts editing it */
function focusDyn() {
  if (!dynEl) return false;
  const f = $('#dF1'); if (!f) return false;
  f.focus(); if (f.select) f.select();
  return true;
}

const KEYS_DRAFT = {
  l: 'line', p: 'pline', r: 'rect', c: 'circle', a: 'arc', e: 'ellipse', g: 'polygon',
  t: 'text', d: 'dim', h: 'hatch', m: 'move', k: 'copy', o: 'rotate', s: 'scale',
  i: 'mirror', f: 'offset', x: 'trim', v: 'fillet',
};
const KEYS_ARCH = {
  w: 'wall', d: 'door', n: 'window', a: 'area', t: 'text', m: 'move', k: 'copy', o: 'rotate', i: 'mirror',
};
window.addEventListener('keydown', ev => {
  const tag = document.activeElement && document.activeElement.tagName;
  const inField = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
  if (ev.key === 'Escape') {
    if (SNAPMENU) { hideSnapMenu(); return; }
    if (ST.styleTarget) { ST.styleTarget = null; echo('Cancelled'); buildProps(); return; }
    if ($('#modal').classList.contains('show')) return closeModal();
    if (dynLocked()) { dynRelease(); draw(); return; }
    dynKill();
    if (CMD) endCmd(); else { SEL.clear(); syncUI(); }
    ST.band = null; hint(''); draw(); return;
  }
  if (inField) {
    if (ev.key === 'Enter' && $('#modal').classList.contains('show') && tag !== 'TEXTAREA') {
      const f = _ok; closeModal(); if (f) f();
    }
    return;
  }
  const K = ev.key.toLowerCase();
  if (ev.ctrlKey || ev.metaKey) {
    if (K === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
    else if (K === 'y') { ev.preventDefault(); redo(); }
    else if (K === 'a') { ev.preventDefault(); META.all(); }
    else if (K === 's') { ev.preventDefault(); doSave(); }
    else if (K === 'o') { ev.preventDefault(); $('#fileIn').click(); }
    else if (K === 'c') { ev.preventDefault(); doClipCopy(); }
    else if (K === 'v') { ev.preventDefault(); doClipPaste(); }
    else if (K === 'd') { ev.preventDefault(); setMode(MODE === 'arch' ? 'drafting' : 'arch'); }
    return;
  }
  if (ev.key === 'Enter') { ev.preventDefault(); if (CMD) cmdEnter(); else focusCmd(); return; }
  if (ev.key === 'Delete' || ev.key === 'Backspace') {
    ev.preventDefault();
    if (SEL.size) { begin(); selEnts().forEach(e => eraseEnt(e.id)); commit('Erase'); draw(); syncUI(); }
    return;
  }
  if (ev.key === ' ') {
    ev.preventDefault();
    if (CMD) return cmdEnter();
    if (ST.lastCmd && CMDS[ST.lastCmd]) { startCmd(ST.lastCmd); echo(ST.lastCmd.toUpperCase()); return; }
    if (HISTC.length) runInput(HISTC[HISTC.length - 1]);
    return;
  }
  if (ev.key === 'F8') { ev.preventDefault(); return tgl('ortho'); }
  if (ev.key === 'F9') { ev.preventDefault(); return tgl('snapgrid'); }
  if (ev.key === 'F3') { ev.preventDefault(); return tgl('osnap'); }
  if (ev.key === 'F7') { ev.preventDefault(); return tgl('grid'); }
  if (ev.key === 'F10') { ev.preventDefault(); return tgl('polar'); }
  if (/^[0-9.@\-]$/.test(ev.key) && CMD) { if (!focusDyn()) focusCmd(); return; }
  /* A letter typed while a command is running belongs to that command — the
     on-screen prompt says "C to close", so C must close, not start CIRCLE.
     Only if the running command has no use for the key does it fall through
     to starting a tool. */
  if (CMD && CMD.phase === 'run' && /^[a-z]$/.test(K) && !ev.repeat) {
    let taken = false;
    try { taken = !!cmdText(K); } catch (e) { taken = false; }
    if (taken) {
      ev.preventDefault();
      cmdPreview(ST.cur || [0, 0]);
      syncDyn(); draw();
      return;
    }
  }
  const map = MODE === 'arch' ? KEYS_ARCH : KEYS_DRAFT;
  if (map[K] && !ev.repeat) { ev.preventDefault(); startCmd(map[K]); return; }
  if (K === 'q') { ev.preventDefault(); fit(); }
});
window.addEventListener('keyup', ev => { if (ev.key === 'Shift') ST.shift = false; });
window.addEventListener('keydown', ev => { if (ev.key === 'Shift') ST.shift = true; });

/* ---------- clipboard ---------- */
let CLIP = [];
function doClipCopy() { CLIP = selEnts().map(clone); echo(CLIP.length + ' copied'); }
function doClipPaste() {
  if (!CLIP.length) return;
  const b = bboxAll(CLIP), c = [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
  const d = sub(ST.cur || c, c);
  begin(); SEL.clear();
  const idmap = {};
  CLIP.forEach(e => {
    const n = clone(e); const old = n.id; delete n.id;
    addEnt(xf(n, T.move(d)));
    idmap[old] = n.id; SEL.add(n.id);
  });
  /* keep openings attached to the copied wall, not the original */
  for (const id of SEL) {
    const e = DOC.ents.get(id);
    if (e && (e.t === 'door' || e.t === 'window') && idmap[e.host]) e.host = idmap[e.host];
  }
  commit('Paste'); draw(); syncUI();
}

/* ---------- files ---------- */
function doNew() {
  modal('<h3>Start a new drawing</h3><p>The current drawing is discarded. Save it first if you need it.</p>', () => {
    resetDoc(); V.z = 1; V.px = V.w / 2; V.py = V.h / 2;
    DOC.gridStep = 100; DOC.snapStep = 100; DOC.textH = 200;
    syncUI(); draw(); echo('New drawing');
  });
}
function doSave() { download('drawing.dxf', exportDXF(), 'application/dxf'); toast('Saved drawing.dxf (R2000)'); }
function doExport() {
  modal(`<h3>Export</h3><p>DXF keeps everything editable. The project file also keeps walls, doors and windows
    as live objects — DXF turns them into plain geometry.</p>
    <div class="acts" style="justify-content:flex-start;flex-wrap:wrap">
      <button class="btn pri" id="eJson">Project file (.ocad)</button>
      <button class="btn" id="eDxf">DXF R2000</button>
      <button class="btn" id="eSvg">SVG</button>
      <button class="btn" id="ePng">PNG</button>
      <button class="btn" id="eDwg">DWG (experimental)</button>
    </div>`, null);
  $('#mo').style.display = 'none';
  $('#eDxf').onclick = () => { closeModal(); doSave(); };
  $('#eSvg').onclick = () => { closeModal(); download('drawing.svg', exportSVG(), 'image/svg+xml'); toast('Saved drawing.svg'); };
  $('#ePng').onclick = () => { closeModal(); exportPNG(2400).toBlob(b => { download('drawing.png', b); toast('Saved drawing.png'); }); };
  $('#eJson').onclick = () => { closeModal(); download('drawing.ocad', saveNative(), 'application/json'); toast('Saved drawing.ocad'); };
  $('#eDwg').onclick = () => { closeModal(); doSaveDWG(); };
}
function readFile(f) {
  if (/\.dwg$/i.test(f.name)) return importDWG(f);
  const r = new FileReader();
  r.onload = () => {
    try {
      const txt = String(r.result);
      if (/\.ocad$|\.json$/i.test(f.name) || txt.trim().startsWith('{')) loadNative(txt);
      else importDXF(txt);
    } catch (e) { console.error(e); toast('Could not read that file'); }
  };
  r.readAsText(f);
}

/* ---------- touch ---------- */
const TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints > 0;
function syncTouch() { const t = $('#touchbar'); if (t) t.classList.toggle('show', TOUCH && !!CMD); }

/* ---------- help ---------- */
function showHelp() {
  modal(`<h3>Orthograph</h3>
  <p>A 2D drafting board with a parametric architecture layer. Type commands, or use the rail on the left.
  <kbd>Ctrl</kbd>+<kbd>D</kbd> swaps between Drafting and Architecture.</p>
  <div class="keys">
    <kbd>L P R C A</kbd><span>Line, Polyline, Rectangle, Circle, Arc</span>
    <kbd>T D H</kbd><span>Text, Dimension, Hatch</span>
    <kbd>M K O S I F</kbd><span>Move, Copy, Rotate, Scale, Mirror, Offset</span>
    <kbd>X V</kbd><span>Trim (hold <kbd>Shift</kbd> to extend), Fillet</span>
    <kbd>W D N</kbd><span>In Architecture: Wall, Door, wiNdow</span>
    <kbd>Q</kbd><span>Zoom to everything</span>
    <kbd>F3 F7 F8 F9 F10</kbd><span>Object snap · grid · ortho · grid snap · polar</span>
    <kbd>Space</kbd><span>Repeat the last command</span>
    <kbd>Esc</kbd><span>Cancel / clear the selection</span>
  </div>
  <p style="margin-top:14px">Coordinates take <kbd>250</kbd>, <kbd>1200,600</kbd>, <kbd>@0,-450</kbd>, <kbd>@800&lt;30</kbd>,
  and units like <kbd>2.5m</kbd> or <kbd>4'-6"</kbd>. Drag left→right to take what is fully inside,
  right→left to catch anything you touch.</p>
  <p><b>Walls</b> are centrelines with a type. Corners mitre themselves, T-junctions clean up, and doors and
  windows are hosted on the wall — move the wall and they travel with it. Select one and the panel on the right
  edits its parameters.</p>
  <p>Drop a DXF, a DWG or a project file on the canvas to open it. <kbd>AUDIT</kbd> checks the drawing for problems.</p>`, null);
  $('#mo').style.display = 'none'; $('#mc').textContent = 'Close';
}

/* ---------- boot ---------- */
function seed() {
  const W = 8400, H = 6000;
  const mk = (a, b, wt) => addEnt({ t: 'wall', a, b, wt: wt || 'brk230', just: 'center', h: 3000, lvl: 0, layer: 'A-WALL' });
  const c = [[0, 0], [W, 0], [W, H], [0, H]];
  for (let i = 0; i < 4; i++) mk(c[i], c[(i + 1) % 4]);
  mk([3600, 0], [3600, 3400], 'part90');
  mk([3600, 3400], [W, 3400], 'part90');
  mk([3600, 3400], [3600, H], 'part90');
  const walls = [...DOC.ents.values()].filter(e => e.t === 'wall');
  addOpening('door', walls[4], 1200, 'sgl900');
  addOpening('door', walls[6], 900, 'sgl800');
  addOpening('window', walls[0], 2100, 'w1512');
  addOpening('window', walls[0], 6000, 'w1512');
  addOpening('window', walls[2], 2400, 'w1812');
  addOpening('door', walls[3], 3000, 'dbl1500');
  /* rooms are seeded as associative so the first thing you can try is moving a
     wall and watching the areas follow */
  for (const [seed, name] of [[[1800, 3000], 'LIVING'], [[6000, 1700], 'KITCHEN'], [[6000, 4700], 'BEDROOM']]) {
    const ring = roomTrace(seed, 0);
    if (ring) addEnt({
      t: 'room', pts: ring, seed, auto: true, name, showArea: true,
      areaUnits: 'auto', h: 280, lvl: 0, layer: 'A-AREA',
    });
  }
  addEnt({ t: 'stair', a: [4200, 4300], b: [6600, 4300], w: 1100, risers: 16, rise: 187,
    tread: 280, kind: 'L', turn: -1, landing: 1100, dir: 1, lvl: 0, layer: 'A-FLOR-STRS' });
  addEnt({ t: 'column', p: [3600, 3400], w: 350, d: 350, shape: 'rect', rot: 0, lvl: 0, layer: 'A-COLS' });
  addEnt({ t: 'dim', k: 'horizontal', p1: [0, 0], p2: [W, 0], off: -900, layer: 'DIMENSIONS' });
  addEnt({ t: 'dim', k: 'vertical', p1: [0, 0], p2: [0, H], off: -900, layer: 'DIMENSIONS' });
  addEnt({ t: 'dim', k: 'horizontal', p1: [0, 0], p2: [3600, 0], off: -450, layer: 'DIMENSIONS' });
  addEnt({ t: 'dim', k: 'horizontal', p1: [3600, 0], p2: [W, 0], off: -450, layer: 'DIMENSIONS' });
}
function boot() {
  resetDoc();
  initTheme();
  DOC.gridStep = 100; DOC.snapStep = 100; DOC.textH = 200;
  buildRail();
  seed();
  HIST.past.length = 0; HIST.future.length = 0;
  document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  document.querySelectorAll('.tg').forEach(b => b.onclick = () => tgl(b.dataset.tg));
  $('#addLay').onclick = () => {
    let i = 1, n; do { n = 'LAYER' + i++; } while (DOC.layers.some(l => l.name === n));
    begin(); touchLayers(); DOC.layers.push(newLayer(n, '#ffd166')); DOC.cur = n; commit('Layer added'); buildLayers();
  };
  $('#mNew').onclick = doNew;
  $('#mOpen').onclick = () => $('#fileIn').click();
  $('#mSave').onclick = doSave;
  $('#mExport').onclick = doExport;
  $('#mUndo').onclick = undo;
  $('#mRedo').onclick = redo;
  $('#unit').onchange = () => { DOC.units = $('#unit').value; syncUI(); syncCoord(); draw(); };
  $('#vFit').onclick = () => fit();
  $('#mHelp').onclick = showHelp;
  $('#mPanel').onclick = () => $('#panel').classList.toggle('open');
  $('#tEsc').onclick = () => { endCmd(); SEL.clear(); syncUI(); draw(); syncTouch(); };
  $('#tDone').onclick = () => { cmdEnter(); syncTouch(); };
  $('#fileIn').onchange = ev => { const f = ev.target.files[0]; if (f) readFile(f); ev.target.value = ''; };
  ['dragenter', 'dragover'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); $('#drop').classList.add('show'); }));
  ['dragleave', 'drop'].forEach(t => stage.addEventListener(t, e => {
    e.preventDefault();
    if (t === 'dragleave' && e.relatedTarget && stage.contains(e.relatedTarget)) return;
    $('#drop').classList.remove('show');
  }));
  stage.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) readFile(f); });
  $('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

  let _railH = -1;
  new ResizeObserver(() => {
    resize();
    /* the rail fits itself to the window, so refit when the window changes */
    const h = (window.innerHeight || 800);
    if (h !== _railH) { _railH = h; buildRail(); }
  }).observe(stage);
  resize(); fit(); syncUI(); syncToggles(); syncCoord();
  if (window.innerWidth <= 860) $('#mPanel').style.display = '';
  hint('Press <em>?</em> for the shortcut list · <em>Ctrl+D</em> swaps Drafting and Architecture');
  setTimeout(() => hint(''), 7000);
  echo('Ready');
}
if (typeof ORTHO_HEADLESS === 'undefined') boot();
