<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orthograph — browser CAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0e1116; --bg1:#151a21; --bg2:#1c222b; --bg3:#242c37;
  --canvas:#212830;                /* model space — mirrored by CO.bg in 05-view.js */
  --bd:#28313d; --bd2:#394453;
  --tx0:#dbe2ea; --tx1:#8d9aab; --tx2:#5c6878;
  --amber:#ffd166; --mint:#4ee6a8; --steel:#6ba8ff; --rose:#ff6b81;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --top:46px; --right:276px; --bot:60px;
  /* tool rail metrics — mirrored by RAIL_LAYOUT in 13-ui.js.
     The rail is a fixed 3-column grid and never scrolls: see railMetrics(). */
  --tool:26px; --tgap:3px; --rpad:6px; --rhead:14px; --rgap:4px;
  --rail:96px;                     /* 3*26 + 2*3 + 2*6 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--tx0);
  font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

#app{display:grid;height:100%;
  grid-template-columns:var(--rail) 1fr var(--right);
  grid-template-rows:var(--top) 1fr var(--bot);
  grid-template-areas:"top top top" "rail stage panel" "bot bot bot"}

/* ---------------- top bar ---------------- */
#topbar{grid-area:top;display:flex;align-items:center;gap:2px;padding:0 10px;
  background:var(--bg1);border-bottom:1px solid var(--bd);z-index:20}
.brand{display:flex;align-items:baseline;gap:7px;margin-right:14px;user-select:none}
.brand b{font-weight:600;letter-spacing:-.02em;font-size:14px}
.brand span{font-family:var(--mono);font-size:9px;color:var(--tx2);
  letter-spacing:.14em;text-transform:uppercase}
.tb{padding:6px 10px;border-radius:5px;color:var(--tx1);font-size:12.5px;white-space:nowrap}
.tb:hover{background:var(--bg3);color:var(--tx0)}
.tb:disabled{opacity:.3;cursor:default;background:none;color:var(--tx2)}
.tb.ico{width:30px;height:28px;padding:0;display:grid;place-items:center}
.tb.ico svg{width:17px;height:17px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tb.ico:disabled:hover{background:none}
.sep{width:1px;height:20px;background:var(--bd);margin:0 7px;flex:none}
.grow{flex:1}
.modes{display:flex;gap:2px;background:var(--bg2);border-radius:7px;padding:2px;margin-left:8px}
.mode{padding:5px 13px;border-radius:5px;font-size:11.5px;font-weight:500;color:var(--tx1);
  letter-spacing:.03em;white-space:nowrap}
.mode:hover{color:var(--tx0)}
.mode.on{background:var(--amber);color:#141821}
.unit{font-family:var(--mono);font-size:11px;background:var(--bg2);border:1px solid var(--bd);
  border-radius:5px;padding:5px 7px;cursor:pointer}
.unit option{background:var(--bg2)}

/* ---------------- tool rail ----------------
   A fixed multi-column grid. Every tool in the active mode is on screen at
   once — there is no scroll container here by design. */
#rail{grid-area:rail;background:var(--bg1);border-right:1px solid var(--bd);
  display:grid;grid-template-columns:repeat(3,var(--tool));
  justify-content:center;align-content:start;
  gap:var(--tgap);padding:var(--rpad) 0;overflow:hidden;z-index:15}
.rgrp{grid-column:1/-1;height:var(--rhead);margin-top:var(--rgap);
  display:flex;align-items:flex-end;
  font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx2);padding:0 2px 3px;
  border-bottom:1px solid var(--bd);user-select:none;white-space:nowrap;overflow:hidden}
.rgrp:first-child{margin-top:0}
.tool{width:var(--tool);height:var(--tool);border-radius:5px;
  display:grid;place-items:center;color:var(--tx1);position:relative}
.tool svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--bg3);color:var(--tx0)}
.tool.on{background:var(--amber);color:#141821;box-shadow:0 0 0 1px #ffd16655}
.tool[data-k]::after{content:attr(data-k);position:absolute;right:1px;bottom:0;
  font-family:var(--mono);font-size:6.5px;line-height:1;opacity:.5;letter-spacing:-.02em}
.tool.on[data-k]::after{opacity:.65}
.tip{position:fixed;background:#05070a;border:1px solid var(--bd2);border-radius:5px;
  padding:5px 9px;font-size:11.5px;pointer-events:none;opacity:0;z-index:400;
  transition:opacity .1s;white-space:nowrap;box-shadow:0 6px 18px #0009}
.tip b{font-family:var(--mono);color:var(--amber);font-weight:500;margin-left:8px}

/* ---------------- stage ---------------- */
/* the drawing area carries AutoCAD's model-space grey, a little lighter than
   the chrome around it; the crosshair is drawn on the canvas, so the system
   cursor is hidden and JS puts it back for the pan and zoom modes */
#stage{grid-area:stage;position:relative;overflow:hidden;background:var(--canvas);
  touch-action:none;cursor:none}
#hud,#nav,#touchbar,#drop,.qp{cursor:default}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
.dyn{position:absolute;display:flex;gap:4px;transform:translate(14px,14px);pointer-events:auto}
.dyn input{font-family:var(--mono);font-size:11.5px;width:78px;padding:4px 6px;
  background:#0b0e13ee;border:1px solid var(--bd2);border-radius:4px;color:var(--tx0)}
.dyn input.act{border-color:var(--amber);color:var(--amber)}
.dyn label{position:absolute;top:-13px;font-family:var(--mono);font-size:8.5px;
  color:var(--tx2);letter-spacing:.1em}
#hint{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:11px;
  color:var(--tx1);background:#0b0e13cc;border:1px solid var(--bd);border-radius:5px;
  padding:5px 10px;pointer-events:none;max-width:58%}
#hint em{color:var(--amber);font-style:normal}

/* ---- navigation widget: fit + view rotation ---- */
#nav{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;
  align-items:center;gap:6px;pointer-events:auto;user-select:none}
.navbtn{width:32px;height:26px;display:grid;place-items:center;color:var(--tx1);
  background:#0b0e13cc;border:1px solid var(--bd);border-radius:5px}
.navbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{color:var(--amber);border-color:var(--bd2)}
.navbtn.off{opacity:.35}
.navbtn.off:hover{color:var(--tx1);border-color:var(--bd)}
#dialWrap{position:relative;width:60px;height:60px;border-radius:50%;
  background:#0b0e13d9;border:1px solid var(--bd);display:grid;place-items:center;
  cursor:grab;touch-action:none}
#dialWrap:hover{border-color:var(--bd2)}
#dialWrap:active{cursor:grabbing;border-color:var(--amber)}
#dial{width:56px;height:56px;overflow:visible;display:block}
#dial .ring{stroke:var(--bd2);fill:none;stroke-width:1}
#dial .tick{stroke:var(--tx2);stroke-width:1}
#dial .tick.maj{stroke:var(--tx1)}
#dial .idx{fill:var(--tx1)}
#dial .n{fill:var(--amber)}
#dial .s{fill:var(--tx2)}
#dial .bar{stroke:var(--bd2);stroke-width:1}
#dial .lbl{fill:var(--tx2);font-family:var(--mono);font-size:6px;letter-spacing:.06em}
#dialRose{transform-origin:28px 28px;transform-box:view-box}
#navAng{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--amber);
  background:#0b0e13cc;border:1px solid var(--bd);border-radius:4px;
  padding:2px 0;width:52px;text-align:center;letter-spacing:.01em}
#vlegacy{display:none}

#touchbar{position:absolute;right:12px;bottom:12px;display:none;gap:6px;z-index:30}
#touchbar.show{display:flex}
#touchbar button{font-family:var(--mono);font-size:11px;padding:9px 13px;border-radius:6px;
  background:#0b0e13ee;border:1px solid var(--bd2);color:var(--tx0)}
#touchbar button.pri{background:var(--amber);border-color:var(--amber);color:#141821}
#drop{position:absolute;inset:0;display:none;place-items:center;background:#0e1116e0;
  border:2px dashed var(--amber);z-index:50;font-family:var(--mono);
  font-size:13px;color:var(--amber);letter-spacing:.08em;text-align:center;line-height:2}
#drop.show{display:grid}

/* ---- floating quick properties ---- */
.qp{position:absolute;width:198px;pointer-events:auto;z-index:40;
  background:#0f141bf5;border:1px solid var(--bd2);border-radius:7px;
  box-shadow:0 10px 28px #000a;overflow:hidden}
.qp .qph{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 8px;
  background:var(--bg2);border-bottom:1px solid var(--bd)}
.qp .qph b{flex:1;font-size:11px;font-weight:600;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qp .qph i{font-family:var(--mono);font-size:9px;color:var(--tx2);font-style:normal}
.qp .qph button{width:16px;height:16px;display:grid;place-items:center;
  color:var(--tx2);border-radius:3px;flex:none}
.qp .qph button svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.qp .qph button:hover{color:var(--rose);background:#ffffff10}
.qp .qpb{padding:5px 0 6px}
.qp .row{padding:2px 8px;min-height:23px;gap:6px}
.qp .row label{width:60px;font-size:10px}
.qp .row .f{padding:3px 6px;font-size:11px;border-radius:3px}
.qp .row .ro{font-size:11px}

/* ---------------- right panel ---------------- */
#panel{grid-area:panel;background:var(--bg1);border-left:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;z-index:15}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tx2);border-bottom:1px solid var(--bd);flex:none}
.ph button{color:var(--tx1);font-size:15px;line-height:1;padding:0 3px}
.ph button:hover{color:var(--amber)}
#layers{overflow-y:auto;flex:none;max-height:32%}
.lay{display:flex;align-items:center;gap:7px;padding:5px 11px;font-size:12px;cursor:pointer}
.lay:hover{background:var(--bg2)}
.lay.cur{background:var(--bg3)}
.lay.cur .lname{color:var(--amber)}
.sw{width:11px;height:11px;border-radius:2px;border:1px solid #0006;flex:none}
.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay .ic{opacity:.42;width:14px;height:14px;flex:none}
.lay .ic:hover{opacity:1}
.lay .ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5}
.lay .ic.off{opacity:.85;color:var(--rose)}

#props{flex:1;overflow-y:auto;padding:0 0 14px}
.pttl{display:flex;align-items:center;gap:8px;padding:8px 11px;
  background:var(--bg2);border-bottom:1px solid var(--bd)}
.pttl b{flex:1;font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pttl i{font-family:var(--mono);font-size:9.5px;color:var(--tx2);font-style:normal}
.row{display:flex;align-items:center;gap:8px;padding:3px 11px;min-height:26px}
.row label{width:80px;font-size:11px;color:var(--tx1);flex:none;line-height:1.25}
.row .f{flex:1;font-family:var(--mono);font-size:11.5px;background:var(--bg2);
  border:1px solid var(--bd);border-radius:4px;padding:4px 7px;min-width:0}
.row .f:hover{border-color:var(--bd2)}
.row .f:focus{border-color:var(--amber)}
.row .ro{flex:1;text-align:right;color:var(--tx1);font-family:var(--mono);font-size:11.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{padding:12px 11px 4px;font-family:var(--mono);font-size:8.5px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);
  border-top:1px solid var(--bd);margin-top:7px}
.grp:first-child{border-top:none;margin-top:0}
.pttl + .grp{border-top:none;margin-top:0;padding-top:9px}
.empty{padding:20px 13px;color:var(--tx2);font-size:11.5px;line-height:1.65}
.empty b{display:block;color:var(--tx0);font-size:12.5px;font-weight:600;margin-bottom:5px}
.empty p{margin:0}
.empty .cl{margin-top:12px;font-family:var(--mono);font-size:10px;letter-spacing:.05em}
.empty .cl i{color:var(--amber);font-style:normal}

/* ---------------- bottom bar ---------------- */
#bot{grid-area:bot;background:var(--bg1);border-top:1px solid var(--bd);
  display:flex;flex-direction:column;z-index:20}
#cmdwrap{display:flex;align-items:center;gap:8px;padding:0 11px;height:32px;flex:none}
#caret{font-family:var(--mono);color:var(--amber);font-size:12px;flex:none}
#cmd{flex:1;font-family:var(--mono);font-size:12px;min-width:0}
#cmd::placeholder{color:var(--tx2)}
#echo{font-family:var(--mono);font-size:11px;color:var(--tx1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%;text-align:right}
#status{display:flex;align-items:center;gap:6px;padding:0 11px 4px;height:28px;flex:none;
  overflow:hidden}
#coord{font-family:var(--mono);font-size:11px;color:var(--tx1);
  min-width:168px;flex:none;letter-spacing:-.01em}
#coord b{color:var(--tx2);font-weight:400}
#vscale{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--tx1);
  height:21px;padding:0 8px;flex:none;border:1px solid var(--bd);border-radius:4px}
#vscale:hover{color:var(--amber);border-color:var(--bd2)}
.tgs{display:flex;align-items:center;gap:3px;flex:none}
.tg{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:3px 6px;
  border-radius:4px;border:1px solid var(--bd);color:var(--tx2);flex:none;height:21px}
.tg:hover{border-color:var(--bd2);color:var(--tx1)}
.tg.on{background:var(--amber);border-color:var(--amber);color:#141821}
#dset{display:flex;align-items:center;gap:4px;flex:none}
.ds{display:flex;align-items:center;gap:5px;height:21px;padding:0 6px;flex:none;
  background:var(--bg2);border:1px solid var(--bd);border-radius:4px;cursor:text}
.ds i{font-family:var(--mono);font-size:8.5px;font-style:normal;letter-spacing:.1em;
  color:var(--tx2);user-select:none}
.ds input{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--tx0);
  width:44px;text-align:right}
.ds:hover{border-color:var(--bd2)}
.ds:focus-within{border-color:var(--amber)}
.ds:focus-within i{color:var(--amber)}
.gear{width:24px;height:21px;flex:none;display:grid;place-items:center;color:var(--tx2);
  border:1px solid var(--bd);border-radius:4px}
.gear:hover{color:var(--amber);border-color:var(--bd2)}
.gear svg{width:13px;height:13px;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#dsPop{position:fixed;right:10px;bottom:calc(var(--bot) + 8px);width:242px;z-index:120;
  background:var(--bg1);border:1px solid var(--bd2);border-radius:8px;
  box-shadow:0 14px 34px #000b;padding-bottom:9px;display:none;
  max-height:60vh;overflow-y:auto}
#dsPop.show{display:block}
#dsPop .ph{position:sticky;top:0;background:var(--bg1);z-index:1}

/* ---------------- modal ---------------- */
#modal{position:fixed;inset:0;background:#060810cc;display:none;
  place-items:center;z-index:300;backdrop-filter:blur(3px)}
#modal.show{display:grid}
.card{background:var(--bg1);border:1px solid var(--bd2);border-radius:10px;
  width:min(460px,92vw);padding:20px;max-height:86vh;overflow-y:auto}
.card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.card p{color:var(--tx1);font-size:12px;line-height:1.6;margin-bottom:14px}
.card .row{padding:5px 0;min-height:0}
.card .row label{width:96px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{padding:7px 14px;border-radius:6px;background:var(--bg3);font-size:12.5px}
.btn:hover{background:var(--bd2)}
.btn.pri{background:var(--amber);color:#141821;font-weight:500}
.btn.pri:hover{filter:brightness(1.08)}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--bg2);border:1px solid var(--bd);
  border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--tx0)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;
  font-size:12px;color:var(--tx1)}
/* ---- Command panel: the style header, segmented controls, swatches ---- */
.sty{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:5px 11px 7px}
.sty b{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.styacts{display:flex;gap:2px}
.styb{width:24px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--tx1)}
.styb:hover{background:var(--bg3);color:var(--tx0)}
.styb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;gap:2px;flex:1;background:var(--bg2);border:1px solid var(--bd);
  border-radius:6px;padding:2px;min-width:0}
.segb{flex:1;height:24px;border-radius:4px;display:grid;place-items:center;
  color:var(--tx1);font-size:11px;min-width:0}
.segb:hover{background:var(--bg3);color:var(--tx0)}
.segb.on{background:var(--bg0);color:var(--amber);box-shadow:0 1px 0 #0006 inset}
.segb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
.swrow{display:flex;align-items:center;gap:7px;text-align:left}
.swb{width:22px;height:13px;border-radius:3px;border:1px solid #0006;flex:none}
.swt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swx{width:20px;height:22px;border-radius:4px;color:var(--tx2);flex:none;font-size:14px;line-height:1}
.swx:hover{background:var(--bg3);color:var(--rose)}
.cmdhint{margin:10px 11px 4px;padding:7px 9px;border-radius:6px;background:var(--bg2);
  border:1px solid var(--bd);font-family:var(--mono);font-size:10.5px;color:var(--tx1);line-height:1.55}
.cmdhint em{color:var(--amber);font-style:normal}
.snapmenu{position:fixed;z-index:400;background:var(--bg1);border:1px solid var(--bd2);
  border-radius:8px;padding:5px;min-width:186px;box-shadow:0 12px 34px #000a}
.snapmenu .smh{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tx2);padding:5px 8px 6px}
.snapmenu .smi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:4px 8px;border-radius:5px;font-size:12px;color:var(--tx0)}
.snapmenu .smi:hover{background:var(--bg3)}
.snapmenu .smx{width:11px;color:var(--amber);font-size:11px}
.snapmenu .smg{width:20px;height:20px;flex:none;display:block}
.snapmenu .smt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snapmenu .smsep{height:1px;background:var(--bd);margin:5px 4px}

/* ---------------- drafting settings dialog ---------------- */
.dstabs{display:flex;gap:2px;margin:2px 0 12px;border-bottom:1px solid var(--bd)}
.dstab{font-size:11.5px;padding:6px 11px;color:var(--tx2);border-bottom:2px solid transparent;
  margin-bottom:-1px;border-radius:5px 5px 0 0}
.dstab:hover{color:var(--tx0);background:var(--bg2)}
.dstab.on{color:var(--amber);border-bottom-color:var(--amber)}
.osgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin:2px 0 6px}
.osr{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:5px;cursor:pointer}
.osr:hover{background:var(--bg2)}
.osr input{width:13px;height:13px;flex:none;accent-color:var(--amber);cursor:pointer}
.osr .smg{width:20px;height:20px;flex:none;display:block}
.osr span{font-size:11.5px;color:var(--tx0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.osr.ext span{color:var(--tx1)}
.oshead{display:flex;align-items:baseline;gap:10px}
.oshead .grp2{flex:1;font-family:var(--mono);font-size:8.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tx2)}
.oshead .lnk{font-size:11px;color:var(--amber);padding:2px 4px;border-radius:4px}
.oshead .lnk:hover{background:var(--bg2)}
.oshint{margin-top:12px;padding:8px 10px;border-radius:6px;background:var(--bg2);
  border:1px solid var(--bd);font-size:11px;color:var(--tx1);line-height:1.6}
.pang{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px;align-items:center}
.pangb{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:4px;
  border:1px solid var(--bd);color:var(--tx1);height:22px}
.pangb:hover{border-color:var(--bd2);color:var(--tx0)}
.pangb.on{background:var(--amber);border-color:var(--amber);color:#141821}
.pnone{font-size:11px;color:var(--tx2);padding:0 2px}
#toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(8px);
  background:#000;border:1px solid var(--bd2);border-radius:6px;padding:8px 14px;
  font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:250}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:980px){
  :root{--right:0px;--top:42px;--tool:24px;--rail:90px}
  #panel{position:fixed;right:0;top:var(--top);bottom:var(--bot);width:250px;
    transform:translateX(100%);transition:transform .2s;border-left:1px solid var(--bd2)}
  #panel.open{transform:none}
  #app{grid-template-columns:var(--rail) 1fr;grid-template-areas:"top top" "rail stage" "bot bot"}
  .hide-sm{display:none}
  .brand span{display:none}
  .brand b{font-size:13px}
  .brand{margin-right:8px}
  #topbar{padding:0 6px;gap:0}
  .tb{padding:6px 7px;font-size:12px}
  .mode{padding:5px 9px;font-size:11px}
  .tool[data-k]::after{display:none}
  #coord{min-width:132px;font-size:10px}
  #hint{max-width:52%;font-size:10.5px}
  #dset .ds:nth-child(n+3){display:none}
}
@media (max-width:760px){ #dset{display:none} }

  <div id="bot">

<script>
'use strict';
/* ===== 00-core.js ===== */
/* ============================================================
   ORTHOGRAPH — 00 core: math, colour, units
   ============================================================ */
const TAU = Math.PI * 2, EPS = 1e-9;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = (x, y) => Math.sqrt(x * x + y * y);
const dist = (a, b) => hyp(b[0] - a[0], b[1] - a[1]);
const dist2 = (a, b) => (b[0] - a[0]) ** 2 + (b[1] - a[1]) ** 2;
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, s) => [a[0] * s, a[1] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
const norm = a => { const l = hyp(a[0], a[1]); return l < EPS ? [0, 0] : [a[0] / l, a[1] / l]; };
const perp = a => [-a[1], a[0]];
const ang = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);
const rot = (p, c, t) => {
  const s = Math.sin(t), k = Math.cos(t), d = sub(p, c);
  return [c[0] + d[0] * k - d[1] * s, c[1] + d[0] * s + d[1] * k];
};
const wrap = t => { t %= TAU; return t < 0 ? t + TAU : t; };
/* signed wrap to (-PI, PI] */
const wrapS = t => { t = wrap(t); return t > Math.PI ? t - TAU : t; };
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const near = (a, b, e = 1e-7) => Math.abs(a - b) < e;
const clone = e => JSON.parse(JSON.stringify(e));

/* AutoCAD Color Index (256 entries, packed hex) */
const ACI_HEX = "000000ff0000ffff0000ff0000ffff0000ffff00ffffffff808080c0c0c0ff0000ff7f7fcc0000cc6666990000994c4c7f00007f3f3f4c00004c2626ff3f00ff9f7fcc3300cc7f66992600995f4c7f1f007f4f3f4c13004c2f26ff7f00ffbf7fcc6600cc9966994c0099724c7f3f007f5f3f4c26004c3926ffbf00ffdf7fcc9900ccb26699720099854c7f5f007f6f3f4c39004c4226ffff00ffff7fcccc00cccc6698980098984c7f7f007f7f3f4c4c004c4c26bfff00dfff7f99cc00b2cc6672980085984c5f7f006f7f3f394c00424c267fff00bfff7f66cc0099cc664c980072984c3f7f005f7f3f264c00394c263fff009fff7f33cc007fcc662698005f984c1f7f004f7f3f134c002f4c2600ff007fff7f00cc0066cc660098004c984c007f003f7f3f004c00264c2600ff3f7fff9f00cc3366cc7f0098264c985f007f1f3f7f4f004c13264c2f00ff7f7fffbf00cc6666cc9900984c4c9872007f3f3f7f5f004c26264c3900ffbf7fffdf00cc9966ccb20098724c9885007f5f3f7f6f004c39264c4200ffff7fffff00cccc66cccc0098984c9898007f7f3f7f7f004c4c264c4c00bfff7fdfff0099cc66b2cc0072984c8598005f7f3f6f7f00394c26424c007fff7fbfff0066cc6699cc004c984c7298003f7f3f5f7f00264c26394c003fff7f9fff0033cc667fcc0026984c5f98001f7f3f4f7f00134c262f4c0000ff7f7fff0000cc6666cc0000984c4c9800007f3f3f7f00004c26264c3f00ff9f7fff3300cc7f66cc2600985f4c981f007f4f3f7f13004c2f264c7f00ffbf7fff6600cc9966cc4c0098724c983f007f5f3f7f26004c39264cbf00ffdf7fff9900ccb266cc720098854c985f007f6f3f7f39004c42264cff00ffff7fffcc00cccc66cc980098984c987f007f7f3f7f4c004c4c264cff00bfff7fdfcc0099cc66b2980072984c857f005f7f3f6f4c00394c2642ff007fff7fbfcc0066cc669998004c984c727f003f7f3f5f4c00264c2639ff003fff7f9fcc0033cc667f980026984c5f7f001f7f3f4f4c00134c262f3333335b5b5b848484adadadd6d6d6ffffff";
function aci(i) {
  i = i | 0; if (i < 0 || i > 255) return '#ffffff';
  return '#' + ACI_HEX.substr(i * 6, 6);
}
const _aciCache = new Map();
function toAci(hex) {                      /* nearest ACI slot for export */
  if (!hex) return 7;
  const hit = _aciCache.get(hex); if (hit !== undefined) return hit;
  const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
  let best = 7, bd = Infinity;
  for (let i = 1; i < 256; i++) {
    const h = ACI_HEX.substr(i * 6, 6);
    const dr = r - parseInt(h.substr(0, 2), 16), dg = g - parseInt(h.substr(2, 2), 16), db = b - parseInt(h.substr(4, 2), 16);
    const d = dr * dr + dg * dg + db * db;
    if (d < bd) { bd = d; best = i; }
  }
  _aciCache.set(hex, best);
  return best;
}
const hex2rgb = h => [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
const rgb2int = h => { const [r, g, b] = hex2rgb(h); return (r << 16) | (g << 8) | b; };
const int2hex = n => '#' + ((n >>> 0) & 0xffffff).toString(16).padStart(6, '0');

/* ---------------- unit formatting ---------------- */
/* internal working unit is always the millimetre */
const U = { mm: 1, cm: 10, m: 1000, in: 25.4, ft: 304.8 };
function fmt(v, u) {
  u = u || DOC.units;
  if (u === 'ft') {
    const neg = v < 0;
    const inch = Math.abs(v) / 25.4; let ft = Math.floor(inch / 12);
    let rem = inch - ft * 12;
    const six = Math.round(rem * 16) / 16;
    if (six >= 12) { ft++; rem = 0; } else rem = six;
    const frac = rem - Math.floor(rem);
    let fs = '';
    if (frac > 1e-6) {
      let n = Math.round(frac * 16), d = 16;
      while (n % 2 === 0 && d > 1) { n /= 2; d /= 2; } fs = ' ' + n + '/' + d;
    }
    return (neg ? '-' : '') + ft + "'-" + Math.floor(rem) + fs + '"';
  }
  const k = v / U[u];
  const dp = u === 'mm' ? 1 : u === 'cm' ? 2 : 3;
  return (+k.toFixed(dp)).toString() + (u === 'in' ? '"' : '');
}
function parseLen(s) {
  s = String(s).trim().replace(/,/g, '.'); if (!s) return NaN;
  /* 4'-6 1/2"  |  4' 6"  |  4' */
  let m = s.match(/^(-?[\d.]+)\s*'\s*-?\s*([\d.]+)?(?:\s+(\d+)\/(\d+))?"?$/);
  if (m) return ((+m[1]) * 12 + (+(m[2] || 0)) + (m[3] ? +m[3] / +m[4] : 0)) * 25.4;
  /* 6 1/2" */
  m = s.match(/^(-?\d+)\s+(\d+)\/(\d+)\s*"?$/);
  if (m) return ((+m[1]) + (+m[2]) / (+m[3])) * 25.4;
  m = s.match(/^(-?[\d.]+)\s*(mm|cm|m|in|ft|"|')$/i);
  if (m) { const u = { '"': 'in', "'": 'ft' }[m[2]] || m[2].toLowerCase(); return +m[1] * U[u]; }
  const v = parseFloat(s);
  return isNaN(v) ? NaN : v * U[DOC.units];
}
/** Area, shown in the unit an architect actually wants: square metres for
    metric drawings and square feet for imperial, dropping to the small unit
    only when the area is genuinely small. */
function fmtArea(mm2) {
  const u = DOC.units;
  if (u === 'ft' || u === 'in') {
    const ft2 = mm2 / (304.8 * 304.8);
    if (ft2 >= 0.5 || mm2 === 0) return ft2.toFixed(2) + ' ft²';
    return (mm2 / (25.4 * 25.4)).toFixed(1) + ' in²';
  }
  const m2 = mm2 / 1e6;
  if (m2 >= 0.01 || mm2 === 0) return m2.toFixed(2) + ' m²';
  const k = U[u] * U[u];
  return (+(mm2 / k).toFixed(2)) + ' ' + u + '²';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------- lineweights ----------------
   A lineweight is a *plot* width in millimetres, not a model dimension: it is
   the same thickness on screen however far you zoom, which is what makes a
   0.5mm pen look like a 0.5mm pen. The ladder is the set of widths a plotter
   can actually produce, so the property panels never offer anything else.
   These live in core rather than with the renderer because the document model
   needs LW_DEFAULT for its fallback layer. */
const LW_LADDER = [0, 0.05, 0.09, 0.13, 0.15, 0.18, 0.20, 0.25, 0.30, 0.35, 0.40, 0.50,
  0.53, 0.60, 0.70, 0.80, 0.90, 1.00, 1.06, 1.20, 1.40, 1.58, 2.00, 2.11];
const LW_DEFAULT = 0.25;                           /* LWDEFAULT */
const PX_PER_MM = 96 / 25.4;                       /* the CSS reference pixel: 1in = 96px */
/** nearest standard pen width, so the property panels only ever offer real ones */
function lwSnap(mm) {
  let best = LW_DEFAULT, bd = Infinity;
  for (const v of LW_LADDER) { const d = Math.abs(v - mm); if (d < bd) { bd = d; best = v; } }
  return best;
}

/* ===== 01-doc.js ===== */
/* ============================================================
   ORTHOGRAPH — 01 document, journalled history, spatial index
   ============================================================ */

let UID = 1;
const DOC = {
  layers: [],
  ents: new Map(),
  cur: '0',
  units: 'mm',
  gridStep: 10,
  snapStep: 10,
  textH: 2.5,
  filletR: 0,
  chamD: 0,
  /* architectural libraries — travel with the document */
  wallTypes: null,
  doorTypes: null,
  winTypes: null,
  levels: null,
  curLevel: 0,
  wallHatch: true,        /* draw a poche fill inside walls */
  areaUnits: 'auto',      /* room tag units: auto | m2 | ft2 | sqmm | sqin */
  altArea: false,         /* show a second area unit under the first */
};
const SEL = new Set();

function newLayer(name, color) {
  return { name, color: color || '#d7dee8', on: true, lock: false, lw: 0.25, lt: 'solid' };
}
function layer(n) { return DOC.layers.find(l => l.name === n) || DOC.layers[0]; }
function hasLayer(n) { return DOC.layers.some(l => l.name === n); }
function ensureLayer(n, col, lt) {
  if (hasLayer(n)) return layer(n);
  const l = newLayer(n, col); if (lt) l.lt = lt;
  DOC.layers.push(l); return l;
}

/* ---- standard component libraries (millimetres) ---- */
function stdWallTypes() {
  return [
    { id: 'gen100', name: 'Generic 100', t: 100, fn: 'interior' },
    { id: 'part90', name: 'Stud partition 90', t: 90, fn: 'interior' },
    { id: 'part140', name: 'Stud partition 140', t: 140, fn: 'interior' },
    { id: 'brk115', name: 'Brick 115 (half)', t: 115, fn: 'interior' },
    { id: 'brk230', name: 'Brick 230 (full)', t: 230, fn: 'exterior' },
    { id: 'cav300', name: 'Cavity 300', t: 300, fn: 'exterior' },
    { id: 'cmu190', name: 'Block 190', t: 190, fn: 'exterior' },
    { id: 'con150', name: 'Concrete 150', t: 150, fn: 'structural' },
    { id: 'con200', name: 'Concrete 200', t: 200, fn: 'structural' },
    { id: 'con250', name: 'Concrete 250', t: 250, fn: 'structural' },
    { id: 'ret300', name: 'Retaining 300', t: 300, fn: 'structural' },
  ];
}
function stdDoorTypes() {

    { id: 'sgl800', name: 'Single 800', w: 800, h: 2100, k: 'single' },
    { id: 'sgl900', name: 'Single 900', w: 900, h: 2100, k: 'single' },
    { id: 'sgl1000', name: 'Single 1000', w: 1000, h: 2100, k: 'single' },
    { id: 'dbl1200', name: 'Double 1200', w: 1200, h: 2100, k: 'double' },
    { id: 'dbl1500', name: 'Double 1500', w: 1500, h: 2100, k: 'double' },
    { id: 'dbl1800', name: 'Double 1800', w: 1800, h: 2400, k: 'double' },
    { id: 'sld1500', name: 'Sliding 1500', w: 1500, h: 2100, k: 'slide' },
    { id: 'sld1800', name: 'Sliding 1800', w: 1800, h: 2100, k: 'slide' },
    { id: 'pkt900', name: 'Pocket 900', w: 900, h: 2100, k: 'pocket' },
    { id: 'bif1200', name: 'Bifold 1200', w: 1200, h: 2100, k: 'bifold' },
    { id: 'grg2400', name: 'Garage 2400', w: 2400, h: 2100, k: 'slide' },
    { id: 'opn900', name: 'Opening 900', w: 900, h: 2100, k: 'opening' },
  ];
}
function stdWinTypes() {
  return [
    { id: 'w0606', name: 'Window 600×600', w: 600, h: 600, sill: 1200, k: 'fixed' },
    { id: 'w0909', name: 'Window 900×900', w: 900, h: 900, sill: 900, k: 'casement' },
    { id: 'w0912', name: 'Window 900×1200', w: 900, h: 1200, sill: 750, k: 'casement' },
    { id: 'w1212', name: 'Window 1200×1200', w: 1200, h: 1200, sill: 900, k: 'casement' },
    { id: 'w1215', name: 'Window 1200×1500', w: 1200, h: 1500, sill: 600, k: 'casement' },
    { id: 'w1512', name: 'Window 1500×1200', w: 1500, h: 1200, sill: 900, k: 'sliding' },
    { id: 'w1812', name: 'Window 1800×1200', w: 1800, h: 1200, sill: 900, k: 'sliding' },
    { id: 'w2415', name: 'Window 2400×1500', w: 2400, h: 1500, sill: 750, k: 'sliding' },
    { id: 'wb1815', name: 'Bay 1800×1500', w: 1800, h: 1500, sill: 600, k: 'bay' },
  ];
}
function stdLevels() {
  return [
    { id: 0, name: 'Level 0 — Ground', elev: 0, h: 3000 },
    { id: 1, name: 'Level 1', elev: 3000, h: 3000 },
  ];
}
function wallType(id) { return (DOC.wallTypes || []).find(w => w.id === id) || (DOC.wallTypes || [])[0]; }
function doorType(id) { return (DOC.doorTypes || []).find(w => w.id === id) || (DOC.doorTypes || [])[0]; }
function winType(id) { return (DOC.winTypes || []).find(w => w.id === id) || (DOC.winTypes || [])[0]; }

const ARCH_LAYERS = [
  ['A-WALL', '#e8e8e8'], ['A-WALL-PATT', '#8d9aab'], ['A-DOOR', '#4ee6a8'],
  ['A-GLAZ', '#6ba8ff'], ['A-FLOR-STRS', '#c792ea'], ['A-COLS', '#ff9f43'],
  ['A-AREA', '#ffd166'], ['A-GRID', '#ff6b81'],
];
function resetDoc() {
  DOC.layers = [
    newLayer('0', '#d7dee8'),
    newLayer('DIMENSIONS', '#6ba8ff'),
    newLayer('TEXT', '#ffd166'),
    newLayer('HIDDEN', '#8d9aab'),
  ];
  DOC.layers[3].lt = 'dashed';
  for (const [n, c] of ARCH_LAYERS) DOC.layers.push(newLayer(n, c));
  DOC.ents.clear(); DOC.cur = '0'; UID = 1;
  DOC.wallTypes = stdWallTypes(); DOC.doorTypes = stdDoorTypes();
  DOC.winTypes = stdWinTypes(); DOC.levels = stdLevels(); DOC.curLevel = 0;
  idxInvalidate(); HIST.past.length = 0; HIST.future.length = 0;
}

/* ============================================================

/* ---- UCS icon ----

   to an edge for the icon to fit — it falls back to the lower-left corner,
   which is exactly what UCSICON does. */

  if (!VS.ucsIcon) return;
  /* screen direction of world +X and +Y. Canvas y points down, so +Y comes
     out negative — get this wrong and the icon points into the floor. */

  const xd = [cr, sr], yd = [sr, -cr];

    const s = w2s([0, 0]);
    const m = UCS_ARM + UCS_PAD;
    if (isFinite(s[0]) && s[0] > m && s[0] < V.w - m && s[1] > m && s[1] < V.h - m) o = s;

  ctx.save();
  ctx.setLineDash(DASH_SOLID);

    ctx.strokeStyle = col;
    ctx.beginPath(); ctx.moveTo(o[0], o[1]); ctx.lineTo(ex, ey); ctx.stroke();
    const n = [-d[1], d[0]];
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(ex + d[0] * 8, ey + d[1] * 8);
    ctx.lineTo(ex - d[0] * 1 + n[0] * 3.2, ey - d[1] * 1 + n[1] * 3.2);
    ctx.lineTo(ex - d[0] * 1 - n[0] * 3.2, ey - d[1] * 1 - n[1] * 3.2);
    ctx.closePath(); ctx.fill();
    ctx.font = "600 10px 'JetBrains Mono',monospace";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, ex + d[0] * 18, ey + d[1] * 18);

  head(yd, CO.ucsY, 'Y');

  ctx.lineTo(o[0] + xd[0] * q + yd[0] * q, o[1] + xd[1] * q + yd[1] * q);

/* ---- draw order ----
   DRAWORDER writes e.ord; the renderer sorts on it so the result is stable
   between frames instead of following whatever order the spatial index
   happened to hand back. Fills sit under geometry, annotation on top. */

const byOrder = (a, b) => (ordOf(a) - ordOf(b)) || (a.id - b.id);
function ordRange() {
  let lo = 0, hi = 0;
  for (const e of DOC.ents.values()) { const o = ordOf(e); if (o < lo) lo = o; if (o > hi) hi = o; }
  return [lo, hi];

  if (!list || !list.length) return 0;
  const [lo, hi] = ordRange();
  let n = 0;
  const set = (e, v) => { mut(e); e.ord = v; n++; };
  if (mode === 'front') { let k = hi; for (const e of list) set(e, ++k); }
  else if (mode === 'back') { let k = lo; for (const e of list.slice().reverse()) set(e, --k); }
  else if (ref) {
    const base = ordOf(ref);
    /* shuffle everything past the reference out of the way, then slot in */
    for (const e of DOC.ents.values()) {

      const o = ordOf(e);

/* ============================================================
   ORTHOGRAPH — 06 input state, the snap engine, AutoTrack
   ------------------------------------------------------------
   The snap engine is a *priority* model, not a scoring model.
   Every candidate inside the aperture is collected; the one with
   the highest priority wins and distance only breaks ties. That
   makes the behaviour predictable: an endpoint inside the box
   always beats a nearest-on-curve, however close the curve is.

   Everything the cursor could land on is kept in ST.snapCands so
   Tab can cycle through overlapping points, and acquired points
   (ST.trackPts) throw alignment paths that the cursor can snap
   to — AutoCAD's object snap tracking.

   Three layers of osnap state, in the order they win:
     1. a temporary override held on the keyboard (Shift+E …) or
        picked from the Shift+right-click menu — ST.osnapOne;
     2. the running set — ST.osnapOn, gated by F3 (ST.osnap);
     3. nothing, when F3 is off.

  polarInc: 45, lastPt: null, dragGrip: null, panning: false, shift: false,
  /* Running object snaps. AutoCAD ships OSMODE 4133 (endpoint, centre,

    ins: 0, perp: 1, tan: 0, near: 0, appint: 0, par: 0,
    wcen: 1, wface: 1,

  apBox: false,           /* draw the aperture box at a point prompt — APBOX */

/* ============================================================

   ============================================================ */
/**
 * Resolve a screen position to a world point.

    const dp = hyp(x - raw[0], y - raw[1]);

    if (!(d <= r)) return;
    const pri = priOverride == null ? (SNAP_PRI[k] || 1) : priOverride;
    const i0 = Math.round(x / gtol), j0 = Math.round(y / gtol);

      if (c && dist2(c.p, [x, y]) < merge2) {

          c.k = k; c.d = d; c.pri = pri; c.p = [x, y]; c.meta = meta || null;
        }
        return;
      }

    const c = { p: [x, y], k, d, pri, meta: meta || null };
    cell.set(i0 + ',' + j0, c);
    cands.push(c);

    const hits = nearEnts(raw, r);
    const pool = hits.slice(0, SNAP_MAX_POINT);

    if (on.int || on.appint) pairIntersections(pool, raw, r, push, on);
    if (on.wface && on.int) wallFaceIntersections(pool, raw, r, push);
    if (on.ins) insertionSnaps(raw, r, push);
    if (on.ext) extensionSnaps(hits, raw, r, push, tracks);
    if (on.near) nearestSnaps(hits, raw, r, push);

     dropping a perpendicular onto a quarter arc lands at 180 degrees, nowhere
     near the arc itself. Those entities never reach the pool above, so scan
     the carriers separately. */

  /* ---- parallel: a direction lifted off another object, offered as a ray
     out of the rubber-band reference point ---- */
  if (osOn && ref) {
    parDwell(raw, r, now, on);
    if (on.par) parallelSnaps(raw, ref, r, push, tracks);

  /* ---- alignment paths from acquired points ---- */
  trackSnaps(raw, r, push, tracks);

  /* ---- grid snap: above nearest, below every real object snap ---- */
  if (ST.snapgrid) {

     comparator is non-transitive and sorts inconsistently. */
  const bias = px(SNAP_BIAS_PX) / SNAP_PRI_MAX;
  for (const c of cands) c.score = c.d - c.pri * bias;

  let out = best ? best.p.slice() : raw;
  ST.snapTip = best ? snapTipFor(best) : null;

  /* ---- ortho / polar constrain relative to ref ---- */
  if (ref && !best) {
    const v = sub(out, ref);

      const t = [ref, out]; t.k = 'ortho'; tracks.push(t);
      ST.snapTip = 'Ortho: ' + fmt(dist(ref, out)) + ' < ' + fmtAng(ang(ref, out)) + '°';
    } else if (ST.polar) {
      const lock = polarLock(ref, out);
      if (lock) {
        out = lock.p;
        const t = polarPath(ref, lock.u, lock.L); t.k = 'polar'; tracks.push(t);
        ST.snapTip = 'Polar: ' + fmt(lock.L) + ' < ' + fmtAng(lock.a) + '°';
      }
    }
  }
  ST.tracks = tracks.length ? tracks : null;
  return out;
}

/* ---------------- entity shortlist ---------------- */
/** entities whose geometry comes within reach of the cursor, closest first */
function nearEnts(raw, r) {
  const w = r * 3;
  let pool = query(raw[0] - w, raw[1] - w, raw[0] + w, raw[1] + w);
  if (pool.length > SNAP_MAX_SCAN) {
    /* the spatial index gave up (or the doc is tiny and returned everything):
       fall back to a cheap bbox pass so we never entDist thousands of objects */
    const f = [];
    for (const e of pool) {
      let b; try { b = bbox(e); } catch (err) { continue; }
      if (bboxHit(b, raw[0] - w, raw[1] - w, raw[0] + w, raw[1] + w)) f.push(e);
      if (f.length >= SNAP_MAX_SCAN) break;
    }
    pool = f;
  }
  const reach = r * 2.4, hits = [];
  for (const e of pool) {
    if (!e || e.t === 'text' || !visible(e)) continue;
    let d; try { d = entDist(raw, e); } catch (err) { continue; }
    if (!(d < reach)) continue;
    hits.push({ e, d });
  }
  hits.sort((a, b) => a.d - b.d);
  return hits;
}

/* ---------------- per-entity snap points ---------------- */
function entSnaps(e, dEnt, raw, ref, r, push, on) {
  on = on || activeModes();
  switch (e.t) {
    case 'line': {
      if (on.end) { push(e.a, 'end'); push(e.b, 'end'); }
      if (on.mid) push(mid(e.a, e.b), 'mid');
      if (ref && on.perp) perpOnSeg(e.a, e.b, ref, raw, push);
      break;
    }
    case 'xline': case 'ray': {
      const q = xlineSeg(e);
      if (on.end && e.t === 'ray') push(e.a, 'end');
      if (ref && on.perp) perpOnSeg(q[0], q[1], ref, raw, push);
      break;
    }
    case 'pline': case 'spline': {
      const P = e.t === 'spline' ? poly(e, 48) : e.pts;
      if (on.end) for (const p of (e.t === 'spline' ? [e.pts[0], e.pts[e.pts.length - 1]] : P)) push(p, 'end');
      if (on.end && e.t === 'spline' && e.fit) for (const p of e.fit) push(p, 'end');
      const Q = e.closed ? [...P, P[0]] : P;
      for (let i = 1; i < Q.length; i++) {
        if (on.mid && e.t !== 'spline') push(mid(Q[i - 1], Q[i]), 'mid');
        if (ref && on.perp) perpOnSeg(Q[i - 1], Q[i], ref, raw, push);
      }
      if (on.gcen && e.closed) geomCentreSnap(e, raw, dEnt, r, push);
      break;
    }
    case 'arc': {
      if (on.end) { push(arcPt(e, 0), 'end'); push(arcPt(e, 1), 'end'); }
      if (on.mid) push(arcPt(e, .5), 'mid');
      if (on.cen) centreSnap(e, e.c, raw, dEnt, r, push);
      if (on.quad) for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        if (angOnArc(e, a) === null) continue;
        push([e.c[0] + e.r * Math.cos(a), e.c[1] + e.r * Math.sin(a)], 'quad');
      }
      if (ref) roundPerpTan(e, ref, raw, dEnt, push, on);
      break;
    }
    case 'circle': {
      if (on.cen) centreSnap(e, e.c, raw, dEnt, r, push);
      if (on.gcen) push(e.c, 'gcen', dist(raw, e.c));
      if (on.quad) for (let i = 0; i < 4; i++)
        push([e.c[0] + e.r * Math.cos(i * Math.PI / 2), e.c[1] + e.r * Math.sin(i * Math.PI / 2)], 'quad');
      if (ref) roundPerpTan(e, ref, raw, dEnt, push, on);
      break;
    }
    case 'ellipse': {
      if (on.cen) push(e.c, 'cen');
      if (on.gcen) push(e.c, 'gcen', dist(raw, e.c));
      if (on.quad) for (let i = 0; i < 4; i++) push(ellPt(e, i * Math.PI / 2), 'quad');
      break;
    }
    case 'point': {
      if (on.node) push(e.p, 'node');
      break;
    }
    case 'dim': {
      if (on.end) { push(e.p1, 'end'); push(e.p2, 'end'); if (e.p3) push(e.p3, 'end'); }
      break;
    }
    case 'hatch': {
      if (on.end) for (const L of (e.loops || [])) for (const p of L) push(p, 'end');
      if (on.gcen) geomCentreSnap(e, raw, dEnt, r, push);
      break;
    }
    case 'wall': {
      wallSnaps(e, raw, ref, push, on);
      break;
    }
    default: {
      if (!GEOM[e.t]) break;
      for (const s of shapes(e, 24)) {
        if (s.pts) {
          if (on.end) for (const p of s.pts) push(p, 'end');
          if (on.mid && s.pts.length === 2) push(mid(s.pts[0], s.pts[1]), 'mid');
          if (ref && on.perp) for (let i = 1; i < s.pts.length; i++) perpOnSeg(s.pts[i - 1], s.pts[i], ref, raw, push);
        } else if (s.c && s.r != null) {
          if (on.cen) centreSnap({ t: 'circle', c: s.c, r: s.r }, s.c, raw, dEnt, r, push);
          if (on.quad) for (let i = 0; i < 4; i++)
            push([s.c[0] + s.r * Math.cos(i * Math.PI / 2), s.c[1] + s.r * Math.sin(i * Math.PI / 2)], 'quad');
        }
      }
      if (on.gcen) geomCentreSnap(e, raw, dEnt, r, push);
    }
  }
}

/** perpendicular from ref onto one segment. Hovering the segment is enough —
    when the foot falls past the end it is a *deferred* perpendicular (perpx). */
function perpOnSeg(a, b, ref, raw, push, kOn, kOff) {
  const f = perpFoot(a, b, ref);
  if (!f) return;
  push(f.p, f.on ? (kOn || 'perp') : (kOff || 'perpx'), dist(raw, f.p));
}
/** A centre is a full-strength snap when the cursor is on it. Hovering the
    curve instead still offers it — that is how you pick the centre of a big
    circle — but at a lower rank, and never while a point that actually lies
    on the curve (quadrant, end, midpoint) is already inside the aperture. */
function centreSnap(e, c, raw, dEnt, r, push) {
  const dc = dist(raw, c);
  if (dc <= r) { push(c, 'cen', dc); return; }
  if (dEnt > r || curvePtInReach(e, raw, r)) return;
  push(c, 'cen', dEnt, SNAP_PRI.cenEdge, true);
}
/** The centre of area of a closed shape — AutoCAD's Geometric Center. Like
    CEN it is offered both by pointing at the centroid and by hovering the
    boundary, because on a big room the centroid has nothing to point at. */
function geomCentreSnap(e, raw, dEnt, r, push) {
  const c = geomCentre(e);
  if (!c) return;
  const dc = dist(raw, c);
  if (dc <= r) { push(c, 'gcen', dc); return; }
  if (dEnt > r) return;
  push(c, 'gcen', dEnt, SNAP_PRI.gcenEdge, true);
}
/** area centroid of a closed outline; falls back to the vertex mean for a
    degenerate (zero-area) ring so the snap never returns NaN */
function geomCentre(e) {
  let pts = null;
  if (e.t === 'hatch') pts = (e.loops || [])[0];
  else if (e.t === 'circle' || e.t === 'ellipse') return e.c;
  else {
    if (!e.closed && e.t !== 'room' && e.t !== 'column' && e.t !== 'polygon') return null;
    try { pts = poly(e, 24); } catch (err) { return null; }
  }
  if (!pts || pts.length < 3) return null;
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    const f = p[0] * q[1] - q[0] * p[1];
    a += f; cx += (p[0] + q[0]) * f; cy += (p[1] + q[1]) * f;
  }
  if (Math.abs(a) < 1e-12) {
    let sx = 0, sy = 0;
    for (const p of pts) { sx += p[0]; sy += p[1]; }
    return [sx / pts.length, sy / pts.length];
  }
  a *= 0.5;
  return [cx / (6 * a), cy / (6 * a)];
}
/** is a point lying on this circle/arc already within the aperture? */
function curvePtInReach(e, raw, r) {
  if (e.t === 'arc' &&
    (dist(raw, arcPt(e, 0)) <= r || dist(raw, arcPt(e, 1)) <= r || dist(raw, arcPt(e, .5)) <= r)) return true;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    if (e.t === 'arc' && angOnArc(e, a) === null) continue;
    if (hyp(e.c[0] + e.r * Math.cos(a) - raw[0], e.c[1] + e.r * Math.sin(a) - raw[1]) <= r) return true;
  }
  return false;
}
/** perpendicular and tangent onto a circle or an arc */
function roundPerpTan(e, ref, raw, dEnt, push, on) {
  on = on || activeModes();
  const D = dist(ref, e.c);
  if (on.tan && D > e.r + 1e-9) {
    const a0 = ang(e.c, ref), da = Math.acos(clamp(e.r / D, -1, 1));
    for (const s of [1, -1]) {
      const p = [e.c[0] + e.r * Math.cos(a0 + s * da), e.c[1] + e.r * Math.sin(a0 + s * da)];
      const onArc = e.t !== 'arc' || angOnArc(e, ang(e.c, p)) !== null;
      push(p, onArc ? 'tan' : 'tanx', dist(raw, p));
    }
  }
  if (on.perp && D > 1e-9) {
    const u = norm(sub(ref, e.c));
    for (const s of [1, -1]) {
      const p = [e.c[0] + u[0] * e.r * s, e.c[1] + u[1] * e.r * s];
      const onArc = e.t !== 'arc' || angOnArc(e, ang(e.c, p)) !== null;
      push(p, onArc ? 'perp' : 'perpx', dist(raw, p));
    }
  }
}

/** Perpendicular feet onto carriers whose own geometry is out of reach.
    Cheap because it only looks at entities whose infinite carrier passes
    through the aperture. */
function deferredPerp(raw, ref, r, push) {
  const box = query(raw[0] - r * 2, raw[1] - r * 2, raw[0] + r * 2, raw[1] + r * 2);
  let n = 0;
  for (const e of box) {
    if (n > SNAP_MAX_POINT) break;
    if (!visible(e)) continue;
    if (e.t === 'line') {
      const f = perpFoot(e.a, e.b, ref);
      if (f && !f.on && dist(raw, f.p) <= r) { push(f.p, 'perpx', dist(raw, f.p)); n++; }
    } else if (e.t === 'arc') {
      const D = dist(ref, e.c);
      if (D < 1e-9) continue;
      const u = norm(sub(ref, e.c));
      for (const sg of [1, -1]) {
        const p = [e.c[0] + u[0] * e.r * sg, e.c[1] + u[1] * e.r * sg];
        if (dist(raw, p) > r) continue;
        if (angOnArc(e, ang(e.c, p)) !== null) continue;   /* on the sweep: handled already */
        push(p, 'perpx', dist(raw, p)); n++;
      }
    }
  }
}

/* ---------------- parallel ----------------
   PAR is a two-step snap: hover a straight edge to lift its direction, then
   swing the rubber band until it lines up with that direction. The alignment
   path only appears once the band is within tolerance, exactly like polar. */
function parallelSnaps(raw, ref, r, push, tracks) {
  if (!ST.parRefs.length) return;
  const v = sub(raw, ref);
  const L0 = hyp(v[0], v[1]);
  if (!(L0 > px(6))) return;
  const a0 = Math.atan2(v[1], v[0]);
  for (const q of ST.parRefs) {
    for (const s of [1, -1]) {
      const a = q.a + (s < 0 ? Math.PI : 0);
      if (Math.abs(wrapS(a0 - a)) > rad(POLAR_TOL)) continue;
      const u = [Math.cos(a), Math.sin(a)];
      const L = dot(v, u);
      if (!(L > 0)) continue;
      const foot = [ref[0] + u[0] * L, ref[1] + u[1] * L];
      if (dist(raw, foot) > r) continue;
      push(foot, 'par', dist(raw, foot), null, false, { a, L });
      const t = polarPath(ref, u, L); t.k = 'par'; tracks.push(t);
    }
  }
}

/* ---------------- insertion ----------------
   Text is deliberately excluded from the entity shortlist (you do not want to
   snap to letterforms), so the insertion points are gathered separately. */
function insertionSnaps(raw, r, push) {
  const box = query(raw[0] - r, raw[1] - r, raw[0] + r, raw[1] + r);
  let n = 0;
  for (const e of box) {
    if (n > SNAP_MAX_POINT) break;
    if (!visible(e)) continue;
    const p = insertionPoint(e);
    if (p) { push(p, 'ins'); n++; }
  }
}

/* ---------------- walls ----------------
   wcen: the centreline — its ends, its midpoint, nearest along it.
   wface: the two mitred face lines — their ends, midpoints, nearest,
          and the corner points where faces of different walls cross. */
function wallSnaps(w, raw, ref, push, on) {
  on = on || activeModes();
  if (wallLen(w) < EPS) return;
  if (on.wcen) {
    if (on.end) { push(w.a, 'end'); push(w.b, 'end'); }
    if (on.mid) push(mid(w.a, w.b), 'mid');
    const c = segClosest(raw, w.a, w.b);
    push(c.p, 'wcen', dist(raw, c.p));
    if (ref && on.perp) perpOnSeg(w.a, w.b, ref, raw, push);
  }
  if (!on.wface) return;
  /* the mitred face carriers are cheap; the full shape list (jambs at
     openings, breaks at T-junctions) costs a scan of every wall, so only take
     it on drawings small enough to afford it. A mitred end has no cap — the
     diagonal between the two face points is not a line anyone can see. */
  const E0 = wallEndPoints(w, 0), E1 = wallEndPoints(w, 1);
  const segs = [[E0.plus, E1.minus], [E0.minus, E1.plus]];
  if (E0.capped) segs.push([E0.plus, E0.minus]);
  if (E1.capped) segs.push([E1.plus, E1.minus]);
  for (const [a, b] of segs) {
    if (on.end) { push(a, 'end'); push(b, 'end'); }
    if (on.mid) push(mid(a, b), 'mid');
    const c = segClosest(raw, a, b);
    push(c.p, 'wface', dist(raw, c.p));
    if (ref && on.perp) perpOnSeg(a, b, ref, raw, push);
  }
  if (allWalls().length > 240) { ST.snapLimited = true; return; }
  for (const s of wallShapes(w)) {
    if (!s.pts || s.pts.length < 2) continue;
    const a = s.pts[0], b = s.pts[s.pts.length - 1];
    if (on.end) { push(a, 'end'); push(b, 'end'); }
    if (on.mid) push(mid(a, b), 'mid');
    const c = segClosest(raw, a, b);
    push(c.p, 'wface', dist(raw, c.p));
  }
}
/** walls whose *body* comes near the cursor, closest first.
    A face corner sits a full thickness away from the centreline, so this
    reaches wider than the point-snap shortlist does. */
function nearWalls(raw, r, pool) {
  const all = allWalls();
  const src = all.length <= 400 ? all
    : pool.map(h => h.e).filter(e => e.t === 'wall');
  const out = [];
  for (const w of src) {
    if (wallLen(w) < EPS || !visible(w)) continue;
    const d = segDist(raw, w.a, w.b) - wallT(w) / 2;
    if (d > r * 3) continue;
    out.push({ w, d });
  }
  out.sort((a, b) => a.d - b.d);
  return out.slice(0, SNAP_MAX_WALL).map(x => x.w);
}
/** the two mitred face lines of a wall, as finite segments */
function wallFaceSegs(w) {
  const E0 = wallEndPoints(w, 0), E1 = wallEndPoints(w, 1);
  return [[E0.plus, E1.minus], [E0.minus, E1.plus]];
}
/** where the faces of two nearby walls cross — the corner points of a junction.
    Deliberately segment-to-segment, not carrier-to-carrier: at a T the stem's
    faces stop at the head, and an intersection out on the far face would be a
    point nothing is actually drawn at. */
function wallFaceIntersections(pool, raw, r, push) {
  const ws = nearWalls(raw, r, pool);
  const F = ws.map(wallFaceSegs);
  for (let i = 0; i < ws.length; i++) for (let j = i + 1; j < ws.length; j++) {
    if ((ws[i].lvl || 0) !== (ws[j].lvl || 0)) continue;
    for (const A of F[i]) for (const B of F[j]) {
      const X = xLineLine(A[0], A[1], B[0], B[1], false);
      if (X.length) push(X[0], 'int');
    }
  }
}

/* ---------------- pairwise intersections ----------------
   Bounded two ways: only the SNAP_MAX_X entities nearest the cursor take
   part, and each is reduced to the primitives that actually reach into the
   aperture, so a 5000-vertex polyline contributes one or two segments. */
function pairIntersections(pool, raw, r, push, on) {
  on = on || activeModes();
  const P = [];
  for (const h of pool) {
    const e = h.e;
    if (!X_TYPES[e.t]) continue;
    let pr; try { pr = prims(e); } catch (err) { continue; }
    const reach = r * 2.5;
    const keep = [];
    for (const q of pr) {
      if (q.k === 'c') { if (Math.abs(dist(raw, q.c) - q.r) < reach) keep.push(q); }
      else if (segDist(raw, q.a, q.b) < reach) keep.push(q);
    }
    if (keep.length) P.push(keep);
    if (P.length >= SNAP_MAX_X) break;
  }
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++)
    for (const A of P[i]) for (const B of P[j]) {
      if (on.int) for (const p of xPrim(A, B)) push(p, 'int');
      if (on.appint) for (const p of xPrimInf(A, B)) push(p, 'appint');
    }
}

/* ---------------- extension ----------------
   Project past the end of a line, a wall or an arc, and draw the dotted path
   back to the end it came from.

   The entity shortlist cannot find these on its own: stand 3 metres past the
   end of a wall and the wall is 3 metres away, far outside the aperture. So
   the ends are *acquired* by hovering them, exactly as AutoCAD does, and the
   extension stays live from then until the command ends. Entities that happen
   to be near the cursor anyway are still offered without acquisition, because
   short extensions should not need a ceremony. */
const EXT_MAX = 4;
const EXT_TYPES = { line: 1, wall: 1, arc: 1 };
/** the two ends of an extendable entity */
function extEnds(e) {
  if (e.t === 'arc') return [arcPt(e, 0), arcPt(e, 1)];
  return [e.a, e.b];
}
/** hovering an end remembers it, so the extension survives moving away */
function acquireExt(hits, raw, r) {
  /* hits are distance-sorted, so only the handful nearest the cursor can
     possibly have an end inside the aperture — scanning the rest is pure cost
     on a drawing with hundreds of walls under the pointer */
  for (let i = 0; i < hits.length && i < 6; i++) {
    const e = hits[i].e;
    if (!EXT_TYPES[e.t] || e.id == null) continue;
    const ends = extEnds(e);
    for (let i = 0; i < 2; i++) {
      if (!ends[i] || dist(raw, ends[i]) > r) continue;
      const j = ST.extPts.findIndex(q => q.id === e.id && q.i === i);
      if (j >= 0) ST.extPts.splice(j, 1);
      ST.extPts.push({ id: e.id, i });
      while (ST.extPts.length > EXT_MAX) ST.extPts.shift();
    }
  }
}
function extensionSnaps(hits, raw, r, push, tracks) {
  acquireExt(hits, raw, r);
  const seen = new Set();
  const list = [];
  for (const q of ST.extPts) {
    const e = DOC.ents.get(q.id);
    if (e && EXT_TYPES[e.t] && visible(e) && !seen.has(e.id)) { seen.add(e.id); list.push(e); }
  }
  for (const h of hits) {
    const e = h.e;
    if (!EXT_TYPES[e.t] || seen.has(e.id)) continue;
    seen.add(e.id); list.push(e);
    if (list.length >= SNAP_MAX_X + EXT_MAX) break;
  }
  let n = 0;
  for (const e of list) {
    if (e.t === 'arc') { if (++n > SNAP_MAX_X) break; arcExtension(e, raw, r, push, tracks); continue; }
    if (++n > SNAP_MAX_X) break;
    const A = e.a, B = e.b;
    const u = norm(sub(B, A));
    if (!u[0] && !u[1]) continue;
    for (const P of [A, B]) {
      const away = dot(sub(raw, P), u) * (P === A ? -1 : 1);
      if (away < px(4)) continue;
      const t = dot(sub(raw, P), u);
      const proj = add(P, mul(u, t));
      const d = dist(raw, proj);
      if (d < r) { push(proj, 'ext', d); const tr = [P, proj]; tr.k = 'ext'; tracks.push(tr); }
    }
  }
}
/** an arc's extension runs on around its own circle, not off on a tangent */
function arcExtension(e, raw, r, push, tracks) {
  const sweep = arcSweep(e);
  if (!(e.r > 0) || sweep >= TAU - 1e-9) return;
  if (Math.abs(dist(raw, e.c) - e.r) > r) return;
  const a = ang(e.c, raw);
  if (angOnArc(e, a) !== null) return;             /* still on the sweep */
  const aEnd = e.a0 + sweep;
  const past = wrap(a - aEnd);                     /* how far beyond the far end */
  const before = wrap(e.a0 - a);                   /* how far before the near end */
  const fwd = past <= before;
  const span = fwd ? past : before;
  if (span > Math.PI / 2) return;                  /* half the circle away is not an extension */
  const p = [e.c[0] + e.r * Math.cos(a), e.c[1] + e.r * Math.sin(a)];
  const d = dist(raw, p);
  if (d > r) return;
  push(p, 'ext', d);
  const from = fwd ? aEnd : e.a0, dir = fwd ? 1 : -1;
  const steps = Math.max(2, Math.ceil(span / rad(4)));
  const path = [];
  for (let i = 0; i <= steps; i++) {
    const t = from + dir * span * (i / steps);
    path.push([e.c[0] + e.r * Math.cos(t), e.c[1] + e.r * Math.sin(t)]);
  }
  path.k = 'ext';
  tracks.push(path);
}

/* ---------------- nearest on curve — genuinely last resort ---------------- */
function nearestSnaps(hits, raw, r, push) {
  let n = 0;
  for (const h of hits) {
    const e = h.e;
    if (e.t === 'wall' || e.t === 'point') continue;   /* walls have their own face/centreline snaps */
    if (++n > SNAP_MAX_NEAR) break;
    let P;
    try { P = poly(e, 32); } catch (err) { continue; }
    if (!P || P.length < 2) continue;
    let bp = null, bd = Infinity;
    for (let i = 1; i < P.length; i++) {
      const c = segClosest(raw, P[i - 1], P[i]);
      const d = dist(raw, c.p);
      if (d < bd) { bd = d; bp = c.p; }
    }
    if (bp) push(bp, 'near', bd);
  }
}

/* ---------------- object snap tracking ----------------
   Every acquired point radiates alignment paths. AutoCAD offers a choice:
   orthogonal only, or every polar angle. The cursor snaps onto a path, and
   onto the crossing of two paths — the feature that lets you place a point
   "above that corner and to the right of that one" without drawing a thing. */
function trackAngles() {
  if (!ST.trackPolar) return [0, Math.PI / 2];
  const set = [], seen = new Set();
  for (const a of polarAngles()) {
    const h = wrap(a) % Math.PI;                   /* a path is a line: fold to a half turn */
    const key = Math.round(h * 1e7);
    if (seen.has(key)) continue;
    seen.add(key); set.push(h);
  }
  return set.length ? set : [0, Math.PI / 2];
}
function trackSnaps(raw, r, push, tracks) {
  const pts = ST.trackPts;
  if (!ST.otrack || !pts || !pts.length) return;
  const angs = trackAngles();
  const lines = [];
  for (const tp of pts) {
    for (const a of angs) {
      const u = [Math.cos(a), Math.sin(a)];
      const v = sub(raw, tp.p);
      const off = cross(u, v);                        /* signed distance to the path */
      if (Math.abs(off) > r) continue;
      const along = dot(v, u);
      const foot = [tp.p[0] + u[0] * along, tp.p[1] + u[1] * along];
      lines.push({ o: tp.p, u, foot, along, k: tp.k, a });
    }
  }
  if (!lines.length) return;
  for (const L of lines) {
    const dir = Math.sign(L.along || 1);
    push(L.foot, 'track', dist(raw, L.foot), null, false,
      { o: L.o, k: L.k, a: Math.atan2(L.u[1] * dir, L.u[0] * dir) });
    const t = polarPath(L.o, [L.u[0] * dir, L.u[1] * dir], Math.abs(L.along));
    t.k = 'track';
    tracks.push(t);
  }
  for (let i = 0; i < lines.length; i++) for (let j = i + 1; j < lines.length; j++) {
    const A = lines[i], B = lines[j];
    if (Math.abs(cross(A.u, B.u)) < 1e-9) continue;
    const X = xLineLine(A.o, add(A.o, A.u), B.o, add(B.o, B.u), true);
    if (X.length) push(X[0], 'trackx');
  }
}

/* ---------------- picking ---------------- */
/* pick topmost entity near a world point */
function pickAt(p, radius, filter) {
  /* The drawn pick box has to be the aperture that actually picks, otherwise
     the setting is decoration. Explicit radii still matter (a wall wants more
     reach than a line), so they scale with the box rather than ignoring it. */
  const r = px((radius || 8) * ((+ST.pickBox || 8) / 8));
  const cands = query(p[0] - r, p[1] - r, p[0] + r, p[1] + r).filter(pickable);
  let best = null, bd = r;
  for (const e of cands) {
    if (filter && !filter(e)) continue;
    const d = entDist(p, e);
    if (d <= bd) { bd = d; best = e; }
  }
  return best;
}
function pickGrip(p) {
  const r = px(7 * ((+ST.pickBox || 8) / 8));
  for (const id of SEL) {
    const e = DOC.ents.get(id); if (!e) continue;
    for (const g of gripsOf(e)) if (dist(p, g.p) < r) return { id, k: g.k, p: g.p.slice() };
  }
  return null;
}

/* ============================================================
   point modifiers — FROM, mid-between-2-points, temporary track point
   ------------------------------------------------------------
   These sit *between* the pointing device and the running command: they eat
   one or two points of their own and then hand the command a single derived
   point. Everything a command sees is still an ordinary point.
   ============================================================ */
const PT_MODS = {
  from: { n: 1, hint: 'Base point', label: 'FROM' },
  fro: { n: 1, hint: 'Base point', label: 'FROM' },
  m2p: { n: 2, hint: 'First point of mid', label: 'MID BETWEEN 2 POINTS' },
  mtp: { n: 2, hint: 'First point of mid', label: 'MID BETWEEN 2 POINTS' },
  tt: { n: 1, hint: 'Temporary track point', label: 'TEMPORARY TRACK POINT' },
  tk: { n: 1, hint: 'Temporary track point', label: 'TEMPORARY TRACK POINT' },
};
/** start a point modifier; returns true when one was recognised */
function startPtMod(name) {
  const m = PT_MODS[name];
  if (!m) return false;
  ST.ptMod = { mode: name === 'fro' ? 'from' : (name === 'mtp' ? 'm2p' : (name === 'tk' ? 'tt' : name)), pts: [], def: m };
  ST.fromBase = null;
  if (typeof hint === 'function') hint(m.hint);
  if (typeof echo === 'function') echo(m.label);
  return true;
}
/** feed a point to the pending modifier. Returns the point the *command*
    should receive, or null when the modifier swallowed it. */
function ptModPoint(p) {
  const m = ST.ptMod;
  if (!m) return p;
  m.pts.push(p.slice());
  if (m.mode === 'from') {
    ST.ptMod = null; ST.fromBase = p.slice();
    if (typeof hint === 'function') hint('Offset from the base point — <em>@dx,dy</em> or pick');
    return null;
  }
  if (m.mode === 'tt') {
    ST.ptMod = null;
    acquireTrack(p, 'end');
    if (typeof hint === 'function') hint('Track from the temporary point');
    return null;
  }
  if (m.mode === 'm2p') {
    if (m.pts.length < 2) { if (typeof hint === 'function') hint('Second point of mid'); return null; }
    ST.ptMod = null;
    return mid(m.pts[0], m.pts[1]);
  }
  ST.ptMod = null;
  return p;
}
/** the rubber-band reference a modifier imposes (FROM measures from its base) */
function ptModRef() {
  if (ST.ptMod && ST.ptMod.mode === 'm2p' && ST.ptMod.pts.length) return ST.ptMod.pts[0];
  return ST.fromBase || null;
}
function cancelPtMods() { ST.ptMod = null; ST.fromBase = null; }

/** Text typed at a point prompt that belongs to the snap layer rather than to
    the command: FROM, M2P, TT and every osnap override name. */
function snapInputText(s) {
  const k = String(s || '').trim().toLowerCase().replace(/^[._']+/, '');
  if (!k) return false;
  if (startPtMod(k)) { if (typeof draw === 'function') draw(); return true; }
  const kind = SNAP_ALIAS[k];
  if (!kind) return false;
  setSnapOverride(kind, true);
  if (typeof echo === 'function') echo(kind === 'none' ? 'No snap for the next point' : snapKindLabel(kind).toUpperCase());
  if (typeof draw === 'function') draw();
  return true;
}

/* ---------------- lifecycle hooks ----------------
   Acquired points are transient: Escape and the end of a command drop them,
   exactly as AutoCAD does. endCmd/cmdPoint/cmdText live in 07-cmd, so wrap
   them rather than reaching across module boundaries. Function declarations
   from every module are hoisted into the one bundle scope, so they are
   already visible here. */
if (typeof endCmd === 'function' && !endCmd.__snapTracked) {
  const _endCmd = endCmd;
  const wrapped = function () {
    clearTracks(); cancelPtMods(); clearSnapOverride(true);
    return _endCmd.apply(this, arguments);
  };
  wrapped.__snapTracked = true;
  try { endCmd = wrapped; } catch (err) { /* frozen binding: tracking simply persists */ }
}
if (typeof cmdPoint === 'function' && !cmdPoint.__snapTracked) {
  const _cmdPoint = cmdPoint;
  const wrapped = function (p) {
    const eff = ptModPoint(p);
    if (eff == null) { if (typeof draw === 'function') draw(); return; }
    ST.fromBase = null;
    clearSnapOverride();
    return _cmdPoint.call(this, eff);
  };
  wrapped.__snapTracked = true;
  try { cmdPoint = wrapped; } catch (err) { /* modifiers unavailable */ }
}
if (typeof cmdText === 'function' && !cmdText.__snapTracked) {
  const _cmdText = cmdText;
  const wrapped = function (s) {
    const c = (typeof CMD !== 'undefined') && CMD;
    const live = c && c.phase !== 'sel';
    /* a FROM offset is measured from the base point, not from the last point
       the command took, so it has to be resolved before anything else */
    if (live) {
      const base = ptModRef();
      if (base && /^@/.test(String(s).trim())) {
        const p = parseCoord(String(s).trim(), base, ST.cur);
        if (p) { cmdPoint(p); return true; }
      }
    }
    /* the running command's own options win: "C to close" must close */
    if (_cmdText.apply(this, arguments)) return true;
    return live ? snapInputText(s) : false;
  };
  wrapped.__snapTracked = true;
  try { cmdText = wrapped; } catch (err) { /* typed overrides unavailable */ }
}

/* ---------------- keyboard ----------------
   AutoCAD's temporary override keys. They are momentary: the override lives
   only while the key is held, and the running set comes straight back on
   key-up. Shift on its own toggles ortho, but only while a command is asking
   for a point — outside that, Shift belongs to the selection. */
const SNAP_OVERRIDE_KEYS = {
  e: 'end', p: 'end',                              /* endpoint            */
  v: 'mid', m: 'mid',                              /* midpoint            */
  c: 'cen', ',': 'cen',                            /* centre              */
  d: 'none', l: 'none',                            /* disable all snapping */
};
let _shiftOrtho = false, _heldOverride = null;
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { clearTracks(); cancelPtMods(); clearSnapOverride(true); return; }
    if (ev.key === 'Tab' && ST.snapCands && ST.snapCands.length > 1) {
      ev.preventDefault();
      cycleSnap(ev.shiftKey ? -1 : 1);
      if (ST.snap) { ST.cur = ST.snap.p.slice(); if (typeof draw === 'function') draw(); }
      return;
    }
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    /* Shift on its own is AutoCAD's momentary ortho override: it inverts
       ORTHO while held and puts it straight back on release. Only while a
       command is asking for a point — elsewhere Shift belongs to selection. */
    if (ev.key === 'Shift' && !_shiftOrtho && typeof CMD !== 'undefined' && CMD && CMD.phase === 'run') {
      _shiftOrtho = true; ST.ortho = !ST.ortho;
      if (typeof syncToggles === 'function') syncToggles();
      if (typeof draw === 'function') draw();
      return;
    }
    if (!ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = String(ev.key).toLowerCase();
    if (k === 'x' || k === '.') {
      ev.preventDefault(); if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();
      draftToggle('polar'); return;
    }
    if (k === 'q' || k === ']') {
      ev.preventDefault(); if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();
      draftToggle('otrack'); return;
    }
    if (k === 's' || k === "'") {
      ev.preventDefault(); if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();
      draftToggle('osnap'); return;
    }
    const kind = SNAP_OVERRIDE_KEYS[k];
    if (!kind) return;
    ev.preventDefault();
    if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();
    if (_heldOverride === kind) return;
    _heldOverride = kind;
    setSnapOverride(kind, false);
    if (typeof echo === 'function') echo(kind === 'none' ? 'Snap off (held)' : snapKindLabel(kind) + ' (held)');
    if (typeof draw === 'function') draw();
  });
  window.addEventListener('keyup', ev => {
    if (ev.key === 'Shift') {
      if (_shiftOrtho) {
        _shiftOrtho = false; ST.ortho = !ST.ortho;
        if (typeof syncToggles === 'function') syncToggles();
      }
      if (_heldOverride) { _heldOverride = null; clearSnapOverride(true); }
      if (typeof draw === 'function') draw();
      return;
    }
    const k = String(ev.key).toLowerCase();
    if (_heldOverride && SNAP_OVERRIDE_KEYS[k] === _heldOverride) {
      _heldOverride = null; clearSnapOverride(true);
      if (typeof draw === 'function') draw();
    }
  });
}

/** ORTHO and POLAR are mutually exclusive in AutoCAD: turning one on turns
    the other off. Everything that flips a drafting toggle comes through here. */
function draftToggle(k, val) {
  const v = val == null ? !ST[k] : !!val;
  ST[k] = v;
  if (v && k === 'ortho') ST.polar = false;
  if (v && k === 'polar') ST.ortho = false;
  if (!v && k === 'osnap') { ST.snapCands = null; ST.snap = null; }
  if (typeof syncToggles === 'function') syncToggles();
  if (typeof draw === 'function') draw();
  return v;
}

/* ===== 07-cmd.js ===== */
/* ============================================================
   ORTHOGRAPH — 07 command engine + drawing commands
   ------------------------------------------------------------
   The command line is the primary interface, so this module owns
   rather more than the drawing commands: the alias table, the
   system variables, the prompt/keyword model that the command
   line and the crosshair tooltip both render from one string, the
   transparent-command stack, and coordinate entry.
   ============================================================ */
let CMD = null;
const CMDS = {};
/** commands that act at once and have no prompts of their own — see defm() */
const META = {};
/** menu grouping: 'draw' | 'modify' | 'annotate' | 'inquiry' | 'arch' | 'view' */
function defc(key, o) { CMDS[key] = Object.assign({ key, group: 'draw' }, o); }

/* ============================================================
   System variables
   ------------------------------------------------------------
   Real variables, not a lookup table with a pretty name: every
   one of these reads and writes the state the rest of the app
   already runs on, so `OSMODE 39` changes what the snap engine
   does on the very next mouse move. Names, types, bit codes and
   defaults follow AutoCAD; where our state genuinely differs the
   comment says so.
   ============================================================ */
const SYSVAR = {};
function defvar(name, o) { SYSVAR[name] = Object.assign({ name, type: 'int' }, o); }
function varNames() { return Object.keys(SYSVAR).sort(); }
function getvar(n) {
  const v = SYSVAR[String(n).toUpperCase()];
  return v ? v.get() : undefined;
}
function setvar(n, val) {
  const v = SYSVAR[String(n).toUpperCase()];
  if (!v) return false;
  if (v.ro) return false;
  v.set(val);
  return true;
}
/** the string form the command line shows: points as `x,y`, reals trimmed */
function varStr(v) {
  const raw = v.get();
  if (v.type === 'point') return raw.map(x => +(+x).toFixed(4)).join(',');
  if (v.type === 'real') return String(+(+raw).toFixed(4));
  if (v.type === 'string') return '"' + raw + '"';
  if (v.type === 'bool') return raw ? 'ON' : 'OFF';
  return String(raw);
}
/** parse a typed value into the variable's type; undefined = rejected */
function varParse(v, s) {
  s = String(s).trim();
  if (v.type === 'string') return s.replace(/^"|"$/g, '');
  /* AutoCAD takes ON/OFF for the toggle variables as well as 1/0, and the
     commands that front them (LWDISPLAY, UCSICON) prompt in those words. */
  if (v.type === 'bool') {
    const k = s.toLowerCase();
    if (k === 'on' || k === '1' || k === 'yes' || k === 'true') return true;
    if (k === 'off' || k === '0' || k === 'no' || k === 'false') return false;
    return undefined;
  }
  if (v.type === 'point') {
    const p = s.split(/[, ]+/).map(parseFloat);
    return p.length >= 2 && p.every(isFinite) ? p.slice(0, 2) : undefined;
  }
  const n = parseFloat(s.replace(/,/g, '.'));
  if (!isFinite(n)) return undefined;
  return v.type === 'int' ? Math.round(n) : n;
}

/* OSMODE is a bit code and always has been. 64 (insertion), 1024, 2048
   (apparent intersection) and 8192 (parallel) have no snap in this app, so
   they round-trip as zero rather than pretending. 16384 suppresses the lot,
   which is exactly what our osnap toggle does. */
const OSBITS = [[1, 'end'], [2, 'mid'], [4, 'cen'], [8, 'node'], [16, 'quad'],
  [32, 'int'], [128, 'perp'], [256, 'tan'], [512, 'near'], [4096, 'ext']];

defvar('OSMODE', {
  desc: 'Running object snap modes, bit coded',
  get() { let v = 0; for (const [b, k] of OSBITS) if (ST.osnapOn[k]) v |= b; if (!ST.osnap) v |= 16384; return v; },
  set(v) {
    v = v | 0;
    ST.osnap = !(v & 16384);
    for (const [b, k] of OSBITS) ST.osnapOn[k] = (v & b) ? 1 : 0;
    if (typeof syncToggles === 'function') syncToggles();
    draw();
  },
});
const flagVar = (name, key, desc, after) => defvar(name, {
  desc, get: () => ST[key] ? 1 : 0,
  set(v) { ST[key] = !!v; if (typeof syncToggles === 'function') syncToggles(); if (after) after(); draw(); },
});

flagVar('SNAPMODE', 'snapgrid', 'Snap to the grid on/off');

/* ============================================================
   Prompts and keywords
   ------------------------------------------------------------
   A prompt is written the way AutoCAD writes it:

       Specify next point or [Close/Undo]:

   The bracketed group IS the keyword list, and the capitals
   inside a word are the letters you may type instead ("eXit" is
   typed X). One string therefore drives the command line, the
   clickable keywords and the crosshair tooltip — a command only
   ever states its prompt once.

   are translated into the same structure so every command gets

/* ============================================================
   Coordinate entry
   ------------------------------------------------------------
   Every form AutoCAD takes:
     1200,600     absolute
     @0,-450      relative to the last point
     @800<30      relative polar
     800<30       absolute polar
     #1200,600    absolute override (for the tooltip, where entry
                  is relative by default)
     250          direct distance entry — the number goes along
                  whatever direction the cursor is pointing

   what DYNPICOORDS=0 does in AutoCAD.
   ============================================================ */
function parseCoord(s, ref, cursor, rel) {
  s = String(s).trim().replace(/\s+/g, '');
  if (!s) return null;
  let relative = !!rel && !!ref;
  if (s[0] === '@') { relative = true; s = s.slice(1); }
  else if (s[0] === '#') { relative = false; s = s.slice(1); }
  if (!s) return null;
  let m = s.match(/^(.+?)<(-?[\d.]+)$/);            /* polar  d<angle */
  if (m) {
    const d = parseLen(m[1]), a = rad(parseFloat(m[2]));
    if (isNaN(d) || isNaN(a)) return null;
    const base = relative ? (ref || [0, 0]) : [0, 0];
    return [base[0] + d * Math.cos(a), base[1] + d * Math.sin(a)];

  m = s.match(/^(.+?),(.+)$/);                      /* x,y */
  if (m) {
    const x = parseLen(m[1]), y = parseLen(m[2]);
    if (isNaN(x) || isNaN(y)) return null;
    const base = relative ? (ref || [0, 0]) : [0, 0];
    return [base[0] + x, base[1] + y];

  const d = parseLen(s);                            /* direct distance entry */
  if (!isNaN(d) && ref) {
    /* an angle override (`<45`) beats the cursor; otherwise the cursor
       direction is the direction, which is the whole point of DDE */
    if (ST.angOverride != null) return [ref[0] + Math.cos(ST.angOverride) * d, ref[1] + Math.sin(ST.angOverride) * d];

    const u = norm(sub(cursor, ref));

defc('spline', {
