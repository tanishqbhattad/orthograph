name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the single-file artefact
        run: node build.js

      # orthograph.html is committed, because the one-file download is the
      # whole pitch. A stale build has shipped from this repo before, so the
      # build is re-run above and the result must match what was committed.
      # index.html is the same bytes under a second name, so that a static host
      # serves the app from a bare URL. It has to be checked too, or half the
      # release can go stale on its own.
      - name: Fail if the committed build is stale
        run: git diff --exit-code orthograph.html index.html

      - name: Unit tests
        run: node test/run.js

      - name: Behavioural checks
        run: node tools/verify.js

      # The suite above runs the program against a stub canvas, a Map for
      # localStorage and an IndexedDB that answers synchronously. That stub is
      # why it is fast, and it is also why three faults shipped past it: a
      # press-drag nothing ever performed, a recovery pointer written before
      # the drawing reached the store, and a hole at a junction that only a
      # painted canvas can show. This job drives the real thing.
      - name: Install Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Real-browser tests
        run: node test/browser.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate DXF output against ezdxf
        run: |
          pip install ezdxf
          python tools/check_dxf.py test/out/fixture.dxf

      # ezdxf is forgiving by design, and that is the gap: it read a DXF
      # happily that AutoCAD refused outright over a missing class marker.
      # This checks the structural rules a strict reader enforces.
      - name: Validate DXF structure the way a strict reader would
        run: python tools/dxf_strict.py test/out/fixture.dxf
